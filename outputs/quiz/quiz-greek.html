<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그리스 신화 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면에 카드 하나. 질문은 크게, 보기는 엄지로 누르는 넓은 단추, 결과는 카드 아래 한 줄. */
:root {
  --bg: #f3f4f1;          /* 대리석 — 살짝 푸른 흰색 */
  --card: #ffffff;
  --fg: #1b2433;
  --muted: #5d6676;
  --line: #d6dad3;
  --accent: #1f5fa8;      /* 에게해 */
  --accent-fg: #ffffff;
  --gold: #b8892b;        /* 올리브 기름빛 */
  --ok: #2d8a4e;
  --ok-bg: #e3f3e8;
  --bad: #c2403a;
  --bad-bg: #fbe6e4;
  --display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a26; --card: #1b2533; --fg: #eef1f5; --muted: #a3adbb; --line: #2f3b4c;
    --accent: #6ea4e6; --accent-fg: #0f1826; --gold: #d8ab52;
    --ok: #6fcf8f; --ok-bg: #1d3a2a; --bad: #f08a84; --bad-bg: #44252a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a26; --card: #1b2533; --fg: #eef1f5; --muted: #a3adbb; --line: #2f3b4c;
  --accent: #6ea4e6; --accent-fg: #0f1826; --gold: #d8ab52;
  --ok: #6fcf8f; --ok-bg: #1d3a2a; --bad: #f08a84; --bad-bg: #44252a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 16px 32px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .01em; }
h1 small { font-family: var(--body); font-size: .8rem; color: var(--muted); margin-left: .5em; }
.score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.score b { color: var(--fg); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.q { font-family: var(--display); font-size: 1.45rem; line-height: 1.35; margin: 0; text-wrap: balance; }
.choices { display: grid; gap: 10px; }
@media (min-width: 560px) { .choices.short { grid-template-columns: 1fr 1fr; } }
.choice { font: inherit; font-size: 1.1rem; text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 56px; }
.choice span.n { font-family: var(--display); color: var(--muted); width: 1.2em; flex: none; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice.ok { border-color: var(--ok); background: var(--ok-bg); }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; opacity: .9; }
.fb { border-radius: 10px; padding: 12px 14px; font-size: 1rem; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.fb .x { color: var(--fg); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-family: var(--display); font-size: 1.1rem; padding: 12px 22px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.cats { display: flex; gap: 8px; flex-wrap: wrap; }
.cat { font: inherit; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.cat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.intro p { margin: 0; color: var(--muted); }
.big { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: .8rem; }
footer a { color: inherit; }
.term { color: var(--accent); text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; border-radius: 3px; }
.term:hover, .term:focus-visible { background: var(--ok-bg); outline: none; }
.fb .term { color: inherit; }
.pop { position: fixed; z-index: 10; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 12px 14px; font-size: .95rem; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
.pop.anchored { width: min(360px, calc(100vw - 16px)); }
.pop.sheet { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 14px; }
.pop-h { display: flex; align-items: baseline; gap: 8px; }
.pop-h b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.pop-h span { font-size: .8rem; color: var(--gold); letter-spacing: .06em; }
.pop p { margin: 4px 0 0; line-height: 1.45; }
.pop-m { color: var(--muted); font-size: .85rem; }
.pop-item + .pop-item { border-top: 1px solid var(--line); padding-top: 10px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>그리스 신화 퀴즈 <small>로마 건국 신화는 빼고</small></h1>
    <div class="score" id="score" hidden><b id="s-ok">0</b> 맞힘 · <span id="s-pos">1</span>/<span id="s-len">10</span></div>
  </header>
  <div class="bar" id="bar" hidden><i id="bar-i"></i></div>

  <section class="card intro" id="intro">
    <div class="label">시작하기</div>
    <p class="q">무엇을 맞춰 볼까?</p>
    <div class="cats" id="cats">
      <button class="cat" type="button" data-cat="figure" aria-pressed="true">인물 <span id="n-figure"></span></button>
      <button class="cat" type="button" data-cat="place" aria-pressed="true">장소 <span id="n-place"></span></button>
      <button class="cat" type="button" data-cat="thing" aria-pressed="true">상징과 맡은 일 <span id="n-thing"></span></button>
    </div>
    <p>한 판에 열 문제. 네 보기 가운데 하나를 고른다. 맞히면 다음으로, 틀리면 다시 고른다. 자판 1·2·3·4 로도 고를 수 있다.</p>
    <div class="actions"><button class="btn" type="button" id="start">시작</button></div>
  </section>

  <section class="card" id="play" hidden>
    <div class="label" id="label"></div>
    <p class="q" id="q"></p>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb" hidden></div>
    <div class="actions"><button class="btn" type="button" id="next" disabled>다음</button></div>
  </section>

  <section class="card" id="done" hidden>
    <div class="label">한 판 끝</div>
    <div class="big" id="final"></div>
    <p class="q" id="final-msg"></p>
    <p class="intro" id="final-sub"></p>
    <div class="actions"><button class="btn ghost" type="button" id="again-cats">종류 바꾸기</button><button class="btn" type="button" id="again">한 판 더</button></div>
  </section>

  <div class="pop" id="pop" hidden></div>
  <footer>문제 <span id="n-all"></span>개. 글 속의 <span class="term" tabindex="-1">이름</span>을 누르면 설명이 뜬다. 모두 공개 도메인 원전(아폴로도로스·호메로스·헤시오도스·오비디우스·베르길리우스 등)에서 쓴 자료다. 한 번 나온 문제는 다 돌 때까지 다시 나오지 않는다.</footer>
</div>

,"해 그 자체인 신. 하늘을 마차로 건넌다.",""],"hyperion":["히페리온","티탄","해와 달과 새벽의 아버지.",""],"gigantes":["기간테스","무리","가이아가 티탄의 일을 갚으려고 낳은 거인 무리.",""],"demeter":["데메테르","신","곡식의 여신. 딸을 잃고 세상을 겨울로 만들었다.",""],"dionysos":["디오니소스","신","포도와 축제의 신. 사람의 어머니에게서 난 유일한 올림포스 신이다.",""],"ares":["아레스","신","싸움 그 자체를 좋아하는 신. 그리스에서는 인기가 없었다.",""],"artemis":["아르테미스","신","사냥과 들짐승의 여신. 숲에서 혼자 지낸다.",""],"athena":["아테나","신","제우스의 머리에서 무장한 채로 태어난 여신. 싸움에서 이기는 방법을 안다.",""],"apollon":["아폴론","신","앞일을 알려주고 음악을 맡은 신. 활도 가장 잘 쏜다.",""],"aphrodite":["아프로디테","신","사랑과 아름다움의 여신. 바다 거품에서 태어났다.",""],"zeus":["제우스","신","신들의 왕. 하늘과 번개를 다스린다.",""],"kerberos":["케르베로스","괴물","머리 셋 달린 저승의 문지기 개.",""],"kekrops":["케크롭스","사람","아테네의 첫 왕. 몸의 반은 사람, 반은 뱀이었다.",""],"typhon":["티폰","괴물","가이아가 마지막으로 낳은, 신들을 통째로 위협한 괴물.",""],"persephone":["페르세포네","신","한 해의 얼마는 저승에, 얼마는 땅 위에 있는 여신.",""],"poseidon":["포세이돈","신","바다의 신. 화가 나면 땅을 흔든다.",""],"hades":["하데스","신","죽은 이들의 나라를 맡은 신. 나쁜 신이 아니다.",""],"hera":["헤라","신","신들의 왕비. 약속을 어긴 남편을 절대 용서하지 않는다.",""],"hermes":["헤르메스","신","신들의 심부름꾼. 가장 빠르고 가장 말을 잘한다.",""],"hestia":["헤스티아","신","집 안 불을 맡은 신. 이야기가 거의 없는 대신 모든 집에 있다.",""],"hephaistos":["헤파이스토스","신","신들의 대장장이. 다리를 절고, 무엇이든 만든다.",""],"deukalion":["데우칼리온","사람","큰 홍수에서 살아남은 남자. 프로메테우스의 아들이다.",""],"pandora":["판도라","사람","신들이 만들어 사람들에게 보낸 첫 여자. 열지 말라는 항아리를 열었다.",""],"pyrrha":["피라","사람","홍수에서 살아남은 여자. 판도라의 딸이다.",""],"gorgophone":["고르고포네","사람","페르세우스의 하나뿐인 딸. 이름이 '고르곤을 죽인 이'라는 뜻이다.",""],"gorgones":["고르곤 세 자매","무리","머리카락이 뱀인 세 자매. 둘은 죽지 않고 하나만 죽는다.",""],"graiai":["그라이아이","무리","눈 하나와 이 하나를 셋이 돌려 쓰는 노파 자매.",""],"glaukos-korinthios":["글라우코스","사람","시시포스의 아들, 벨레로폰의 아버지.",""],"danae":["다나에","사람","청동 방에 갇혔던 아르고스의 공주. 페르세우스의 어머니다.",""],"daidalos":["다이달로스","사람","미로와 날개를 만든 아테네의 발명가.",""],"diktys":["딕티스","사람","바다에서 상자를 건져 올린 세리포스의 어부.",""],"megapenthes":["메가펜테스","사람","프로이토스의 아들. 페르세우스와 나라를 바꾸어 아르고스의 왕이 되었다.",""],"medousa":["메두사","괴물","눈을 마주친 것을 돌로 만드는 괴물. 고르곤 셋 가운데 죽는 몸이었다.",""],"mestor":["메스토르","사람","페르세우스의 아들. 그 손자가 알크메네의 오빠들과 싸운 타포스 사람들의 왕이다.",""],"minos":["미노스","사람","크레타의 왕. 포세이돈의 황소와 미로의 주인이다.",""],"myrtilos":["미르틸로스","사람","주인의 전차 바퀴에서 쐐기를 뺀 마부.",""],"bellerophon":["벨레로폰","영웅","페가수스를 타고 키마이라를 이긴 코린토스의 영웅.",""],"semele":["세멜레","사람","디오니소스의 어머니. 신의 진짜 모습을 보고 견디지 못했다.",""],"sthenelos":["스테넬로스","사람","에우리스테우스의 아버지. 미케네와 티린스를 차지했다.",""],"sisyphos":["시시포스","사람","꾀 많은 코린토스의 왕. 저승에서 바위를 굴린다.",""],"akrisios":["아크리시오스","사람","손자에게 죽는다는 말을 듣고 딸을 갇히게 한 아르고스의 왕.",""],"andromeda":["안드로메다","사람","바다괴물에게 바쳐질 뻔했다가 페르세우스에게 구해진 공주.",""],"alkaios":["알카이오스","사람","페르세우스의 아들. 암피트리온의 아버지다.",""],"europa":["에우로페","사람","황소로 변한 제우스가 바다 건너 크레타로 데려간 공주.",""],"eupalamos":["에우팔라모스","사람","다이달로스의 아버지. 이름이 '솜씨 좋은 손'이라는 뜻이다.",""],"elektryon":["엘렉트리온","사람","알크메네의 아버지. 미케네의 왕이었다.",""],"oinomaos":["오이노마오스","사람","딸의 구혼자들과 전차 경주를 해서 죽인 피사의 왕.",""],"iobates":["이오바테스","사람","벨레로폰에게 키마이라를 시킨 리키아의 왕.",""],"ixion":["익시온","사람","헤라를 탐내다가 영원히 돌아가는 바퀴에 묶인 왕.",""],"kadmos":["카드모스","영웅","누이를 찾아 나섰다가 테베를 세운 페니키아의 왕자.",""],"kassiopeia":["카시오페이아","사람","자기가 바다의 님프들보다 예쁘다고 자랑한 왕비.",""],"ketos":["케토스","괴물","포세이돈이 보낸 바다괴물.",""],"kepheus":["케페우스","사람","안드로메다의 아버지. 딸을 바치라는 말을 들은 왕.",""],"cretan-bull":["크레타의 황소","괴물","포세이돈이 바다에서 보낸 황소. 뒤에 마라톤 들판을 휩쓴다.",""],"chrysaor":["크리사오르","괴물","메두사의 목에서 페가수스와 함께 나온, 황금 칼을 든 이. 게리온의 아버지다.",""],"chimaira":["키마이라","괴물","머리 셋 달린 불 뿜는 괴물. 사자, 염소, 뱀이 한 몸이다.",""],"tantalos":["탄탈로스","사람","신들을 속인 벌로 저승에서 영원히 굶고 목마른 왕.",""],"pasiphae":["파시파에","사람","미노스의 아내. 머리가 황소인 아이를 낳았다.",""],"pegasos":["페가수스","괴물","메두사의 목에서 튀어나온 날개 달린 말.",""],"perdix":["페르딕스","사람","톱과 컴퍼스를 처음 만든 다이달로스의 조카. 자고새가 되었다.",""],"perses":["페르세스","사람","페르세우스가 에티오피아에 두고 온 맏아들. 페르시아 왕들의 조상이라고 한다.",""],"perseus":["페르세우스","영웅","메두사의 목을 베어 온 영웅. 신들에게 도구를 빌려 이겼다.",""],"pelops":["펠롭스","사람","전차 경주로 아내와 나라를 얻은 탄탈로스의 아들.",""],"polydektes":["폴리덱테스","사람","페르세우스를 메두사에게 보낸 세리포스의 왕.",""],"proitos":["프로이토스","사람","아크리시오스의 쌍둥이 형제. 벨레로폰을 리키아로 보냈다.",""],"phrixos":["프릭소스","사람","황금 양을 타고 콜키스까지 날아간 소년.",""],"phineus-aithiopia":["피네우스","사람","안드로메다와 결혼하기로 했던 케페우스의 동생. 잔치에 쳐들어왔다가 돌이 되었다.",""],"harmonia":["하르모니아","신","신들이 모두 와서 결혼을 축하해 준 테베의 첫 왕비.",""],"heleus":["헬레우스","사람","페르세우스의 아들. 뒷날 암피트리온과 함께 타포스 섬을 쳤다.",""],"hippodameia":["히포다메이아","사람","전차 경주의 상으로 걸린 피사의 공주.",""],"geryon":["게리온","괴물","몸 셋이 하나로 붙은 거인. 붉은 소의 주인이다.",""],"glauke":["글라우케","사람","이아손과 결혼하려 한 코린토스의 공주.",""],"nemean-lion":["네메아의 사자","괴물","가죽에 칼도 화살도 들지 않는 네메아의 사자.",""],"nessos":["네소스","괴물","강을 건네주다가 데이아네이라를 붙잡아 간 켄타우로스.",""],"deianeira":["데이아네이라","사람","헤라클레스의 아내. 사랑을 지키려다 남편을 죽게 했다.",""],"ladon":["라돈","괴물","황금 사과 나무를 지키는 머리 백 개의 뱀.",""],"laertes":["라에르테스","사람","오디세우스의 아버지. 늙어서 시골 밭에서 아들을 기다렸다.",""],"laomedon":["라오메돈","사람","약속을 어겨 신들과 헤라클레스를 화나게 한 트로이의 왕.",""],"laios":["라이오스","사람","아들을 낳지 말라는 말을 듣고도 아들을 얻은 테베의 왕.",""],"leda":["레다","사람","백조로 모습을 바꾼 제우스가 다가간 스파르타의 왕비.",""],"lichas":["리카스","사람","데이아네이라의 옷을 헤라클레스에게 가져다 준 심부름꾼.",""],"megara":["메가라","사람","헤라클레스의 첫 아내. 테베의 공주였다.",""],"medeia":["메데이아","사람","약초를 다루는 콜키스의 공주. 이아손을 돕고 모든 것을 걸었다.",""],"meleagros":["멜레아그로스","영웅","칼리돈의 멧돼지를 잡은 사람. 목숨이 나무 막대에 걸려 있었다.",""],"minotauros":["미노타우로스","괴물","머리는 황소, 몸은 사람인 괴물. 미로 속에 갇혀 살았다.",""],"skiron":["스키론","사람","절벽에서 발을 씻게 하고 바다로 차 버린 악당.",""],"sphinx":["스핑크스","괴물","수수께끼를 내고 못 푸는 사람을 잡아간 괴물.",""],"sinis":["시니스","사람","소나무를 구부려 사람을 해친 이스트모스의 악당.",""],"adrastos":["아드라스토스","사람","일곱 장수를 모아 테베로 간 아르고스의 왕. 혼자 살아 돌아왔다.",""],"admete":["아드메테","사람","아마존 여왕의 띠를 갖고 싶어 한 에우리스테우스의 딸.",""],"argonautai":["아르고호 원정대","무리","쉰 개의 노를 나눠 잡은 그리스 최고의 뱃사람들.",""],"ariadne":["아리아드네","사람","테세우스에게 실을 준 크레타의 공주.",""],"amazones":["아마조네스","무리","테르모돈 강가에 살던 여자 전사들의 나라.",""],"augeias":["아우게이아스","사람","외양간 치우기를 시키고 약속을 어긴 엘리스의 왕.",""],"autolykos":["아우톨리코스","사람","세상에서 가장 솜씨 좋은 도둑. 오디세우스의 외할아버지다.",""],"aigeus":["아이게우스","사람","테세우스의 아버지. 검은 돛을 보고 죽은 아테네의 왕.",""],"aison":["아이손","사람","왕자리를 아우에게 빼앗긴 이아손의 아버지.",""],"aietes":["아이에테스","사람","황금 양털을 내주지 않으려 한 콜키스의 왕.",""],"aithra":["아이트라","사람","테세우스의 어머니. 트로이젠의 공주다.",""],"atalante":["아탈란테","영웅","멧돼지를 처음 맞힌 사냥꾼. 발이 누구보다 빨랐다.",""],"atreus":["아트레우스","사람","동생과 왕자리를 다툰 미케네의 왕, 아가멤논의 아버지.",""],"aktaion":["악타이온","사람","사슴이 되어 자기 개들에게 죽은 사냥꾼.",""],"androgeos":["안드로게오스","사람","아테네의 경기에서 모두 이기고 죽은 미노스의 아들.",""],"antaios":["안타이오스","괴물","땅에 닿으면 힘이 세지는 리비아의 거인.",""],"antigone":["안티고네","사람","묻지 말라는 명령을 어기고 오빠를 묻은 딸.",""],"antikleia":["안티클레이아","사람","오디세우스의 어머니. 아들을 기다리다 그리움으로 죽었다.",""],"alkmene":["알크메네","사람","헤라클레스의 어머니. 제우스가 찾아온 미케네의 공주.",""],"amphiaraos":["암피아라오스","사람","질 것을 알면서 테베로 간 점쟁이 장수.",""],"amphitryon":["암피트리온","사람","알크메네의 남편. 헤라클레스를 키운 아버지다.",""],"apsyrtos":["압시르토스","사람","누이를 따라 배에 올랐다가 도망길에서 죽은 콜키스의 왕자.",""],"eurydike":["에우리디케","님프","결혼한 날 뱀에게 물려 죽은 오르페우스의 아내.",""],"eurystheus":["에우리스테우스","사람","헤라클레스에게 열두 가지 일을 시킨 미케네의 왕.",""],"eurytos":["에우리토스","사람","헤라클레스에게 활을 가르친 오이칼리아의 왕.",""],"eurytion":["에우리티온","사람","게리온의 소를 치던 목자.",""],"eteokles":["에테오클레스","사람","왕자리를 내주지 않아 형제와 싸운 테베의 왕.",""],"orthros":["오르트로스","괴물","게리온의 소를 지키던 머리 둘 달린 개.",""],"orpheus":["오르페우스","영웅","노래로 돌과 나무를 움직인 사람. 저승까지 내려갔다.",""],"oineus":["오이네우스","사람","데이아네이라의 아버지. 칼리돈의 왕이다.",""],"oidipous":["오이디푸스","영웅","스핑크스의 수수께끼를 푼 사람. 자기가 누구인지는 몰랐다.",""],"omphale":["옴팔레","사람","헤라클레스를 종으로 산 리디아의 여왕.",""],"ismene":["이스메네","사람","안티고네의 동생. 테베에 남은 딸이다.",""],"iason":["이아손","영웅","황금 양털을 가지러 그리스의 영웅들을 모은 사람.",""],"iokaste":["이오카스테","사람","라이오스의 왕비. 뒤에 자기 아들과 결혼하게 된 테베의 여왕.",""],"iolaos":["이올라오스","영웅","히드라를 이길 때 불을 들고 도운 헤라클레스의 조카.",""],"iole":["이올레","사람","활쏘기 내기의 상이었던 오이칼리아의 공주.",""],"ikaros":["이카로스","사람","밀랍 날개로 너무 높이 날아 바다에 떨어진 소년.",""],"iphikles":["이피클레스","사람","헤라클레스의 쌍둥이 동생. 이올라오스의 아버지다.",""],"iphitos":["이피토스","사람","헤라클레스의 친구였다가 그의 손에 죽은 에우리토스의 아들.",""],"kastor":["카스토르","영웅","말을 다루는 쌍둥이 형. 죽는 몸이었다.",""],"kakos":["카쿠스","괴물","불을 뿜는 도둑. 헤라클레스의 소를 훔쳤다.",""],"kalydonian-boar":["칼리돈의 멧돼지","괴물","아르테미스가 보낸 아주 큰 멧돼지.",""],"kerkyon":["케르키온","사람","씨름으로 사람을 죽인 엘레우시스의 악당.",""],"kentauroi":["켄타우로스들","무리","위는 사람, 아래는 말인 산속의 거친 무리.",""],"kokalos":["코칼로스","사람","다이달로스를 숨겨 준 시켈리아의 왕.",""],"kreon":["크레온","사람","테베를 세 번 맡은 사람. 마지막에 안티고네를 벌한 왕.",""],"talos":["탈로스","괴물","크레타 섬을 하루 세 바퀴 돌며 지킨 청동 사람.",""],"theseus":["테세우스","영웅","미노타우로스를 이기고 아테네의 왕이 된 영웅.",""],"teiresias":["테이레시아스","사람","눈이 보이지 않는 대신 앞일을 아는 테베의 점쟁이.",""],"telamon":["텔라몬","영웅","큰 아이아스의 아버지인 살라미스의 왕.",""],"diomedes-thrakios":["트라케의 디오메데스","사람","사람을 잡아먹는 말을 기른 트라케의 왕.",""],"thyestes":["티에스테스","사람","형 아트레우스와 미케네를 다투다 쫓겨난 동생.",""],"tyndareos":["틴다레오스","사람","헬레네의 구혼자 모두에게 맹세를 받아 낸 스파르타의 왕.",""],"phaidra":["파이드라","사람","테세우스의 아내. 거짓말로 히폴리토스를 죽게 했다.",""],"phaia":["파이아","괴물","크롬미온에 살던 사나운 멧돼지.",""],"periphetes":["페리페테스","사람","쇠몽둥이로 길 가는 사람을 해친 에피다우로스의 악당.",""],"peirithoos":["페이리토오스","영웅","테세우스의 가장 친한 친구. 저승에 갇혀 나오지 못했다.",""],"peleus":["펠레우스","영웅","바다의 님프 테티스와 결혼한 아킬레우스의 아버지.",""],"pelias":["펠리아스","사람","신발 한 짝만 신은 사람을 조심하라는 말을 들은 왕.",""],"pholos":["폴로스","괴물","헤라클레스를 손님으로 맞은 착한 켄타우로스.",""],"polyneikes":["폴리네이케스","사람","쫓겨나 군대를 데리고 자기 도시로 돌아온 형제.",""],"polydeukes":["폴리데우케스","영웅","주먹싸움을 익힌 쌍둥이 동생. 죽지 않는 몸이었다.",""],"prokrustes":["프로크루스테스","사람","침대 크기에 사람을 맞춘 길가의 악당.",""],"phineus":["피네우스","사람","밥을 못 먹게 된 눈먼 점쟁이. 아르고호에게 뱃길을 알려 주었다.",""],"pittheus":["피테우스","사람","트로이젠을 세운 왕. 테세우스의 외할아버지다.",""],"herakles":["헤라클레스","영웅","열두 가지 일을 해낸 가장 힘센 영웅. 죽은 뒤 신이 되었다.",""],"hesione":["헤시오네","사람","바다 괴물에게 바쳐질 뻔했다가 헤라클레스에게 구해진 트로이의 공주.",""],"hydra":["히드라","괴물","머리가 아홉인 레르나 늪의 뱀. 머리를 자르면 둘이 났다.",""],"hippolyte":["히폴리테","사람","아레스의 띠를 가진 아마조네스의 여왕.",""],"hippolytos":["히폴리토스","영웅","테세우스의 아들. 새어머니의 거짓말 때문에 죽었다.",""],"hylas":["힐라스","사람","물을 뜨러 갔다가 님프들에게 붙잡혀 사라진 소년.",""],"hyllos":["힐로스","사람","헤라클레스와 데이아네이라의 큰아들.",""],"nestor":["네스토르","사람","말로 사람들을 다스린 그리스군의 가장 나이 많은 왕.",""],"neoptolemos":["네옵톨레모스","영웅","아버지가 죽은 뒤 트로이에 온 아킬레우스의 아들.",""],"deiphobos":["데이포보스","사람","헥토르가 가장 아낀 동생. 아테나가 그의 모습으로 헥토르를 속였다.",""],"diomedes":["디오메데스","영웅","아프로디테와 아레스를 창으로 찌른 아르고스의 장수.",""],"laokoon":["라오코온","사람","목마를 믿지 말라고 외치다 바다에서 온 뱀에게 죽은 트로이의 사제.",""],"menelaos":["메넬라오스","사람","아내 헬레네를 파리스에게 잃은 스파르타의 왕.",""],"memnon":["멤논","영웅","에티오피아 군대를 이끌고 트로이에 온 새벽의 여신의 아들.",""],"briseis":["브리세이스","사람","아가멤논이 아킬레우스에게서 빼앗아 다툼을 부른 여자.",""],"sarpedon":["사르페돈","영웅","제우스의 아들인데도 트로이 편에서 싸우다 죽은 리키아의 왕.",""],"sinon":["시논","사람","거짓말로 트로이 사람들을 속여 목마를 들여놓게 한 그리스 사람.",""],"agamemnon":["아가멤논","사람","트로이로 간 그리스 군대 전체를 이끈 미케네의 왕.",""],"astyanax":["아스티아낙스","사람","트로이가 무너질 때 살지 못한 헥토르의 어린 아들.",""],"aineias":["아이네이아스","영웅","트로이가 무너질 때 살아 나와 새 나라를 찾아간 트로이의 장수.",""],"aias":["아이아스","영웅","탑 같은 방패를 든, 아킬레우스 다음으로 강한 장수.",""],"achilleus":["아킬레우스","영웅","그리스군에서 가장 강한 영웅. 짧고 이름난 삶을 골랐다.",""],"andromache":["안드로마케","사람","성문 앞에서 남편 헥토르와 마지막으로 인사한 아내.",""],"anchises":["안키세스","사람","아프로디테가 사랑한 트로이의 왕족, 아이네이아스의 아버지.",""],"odysseus":["오디세우스","영웅","목마를 생각해 낸 꾀 많은 이타케의 왕.",""],"aias-oileus":["오일레우스의 아이아스","영웅","큰 아이아스와 이름이 같아 작은 아이아스라 불린 장수.",""],"idomeneus":["이도메네우스","영웅","크레타에서 배 마흔 척을 이끌고 온 왕.",""],"iphigeneia":["이피게네이아","사람","아울리스의 제단에서 아르테미스가 사슴과 바꾸어 데려간 공주.",""],"kassandra":["카산드라","사람","앞일을 다 알았지만 아무도 믿어 주지 않은 트로이의 공주.",""],"kalchas":["칼카스","사람","새를 보고 앞일을 읽은 그리스군의 예언자.",""],"kreousa":["크레우사","사람","트로이가 무너지는 밤에 사라진 아이네이아스의 아내.",""],"chryses":["크리세스","사람","딸을 되찾으러 그리스군 진영에 온 아폴론의 사제.",""],"chryseis":["크리세이스","사람","역병 끝에 아버지에게 돌아간 사제의 딸.",""],"klytaimnestra":["클리타임네스트라","사람","딸을 아울리스로 보내야 했던 아가멤논의 아내.",""],"paris":["파리스","사람","황금 사과를 아프로디테에게 주고 헬레네를 얻은 트로이의 왕자.",""],"patroklos":["파트로클로스","영웅","아킬레우스의 갑옷을 입고 싸우다 죽은 가장 가까운 친구.",""],"palamedes":["팔라메데스","사람","오디세우스의 꾀병을 알아챈 사람.",""],"penelope":["페넬로페","사람","스무 해 동안 남편을 기다린 이타케의 왕비. 꾀로 시간을 벌었다.",""],"penthesileia":["펜테실레이아","영웅","트로이를 도우러 와 아킬레우스와 싸운 아마존의 여왕.",""],"protesilaos":["프로테실라오스","영웅","트로이 땅에 맨 먼저 발을 디뎠다가 맨 먼저 죽은 그리스 사람.",""],"priamos":["프리아모스","사람","아들 쉰 명을 둔 트로이의 늙은 왕.",""],"philoktetes":["필록테테스","영웅","헤라클레스의 활을 들고 렘노스에 홀로 남겨진 궁수.",""],"hekabe":["헤카베","사람","불붙은 나무토막을 낳는 꿈을 꾼 트로이의 왕비.",""],"hektor":["헥토르","영웅","트로이를 지킨 가장 뛰어난 장수, 아킬레우스에게 죽었다.",""],"helene":["헬레네","사람","가장 아름다운 여자. 그 때문에 트로이 전쟁이 일어났다.",""],"helenos":["헬레노스","사람","트로이가 어떻게 무너질지 그리스군에 말해 준 트로이의 예언자.",""],"nausikaa":["나우시카아","사람","바닷가에서 오디세우스를 발견하고 도운 파이아케스의 공주.",""],"nisos":["니소스","사람","밤에 적진을 뚫고 아이네이아스를 부르러 간 트로이 병사.",""],"demodokos":["데모도코스","사람","파이아케스의 눈먼 가객. 그의 트로이 노래에 오디세우스가 울었다.",""],"dido":["디도","사람","바다를 건너와 카르타고를 세운 여왕. 아이네이아스를 사랑했다.",""],"lavinia":["라비니아","사람","라티누스의 외동딸. 이 공주를 두고 싸움이 일어났다.",""],"laistrygones":["라이스트리고네스","무리","사람을 잡아먹는 거인 무리. 오디세우스의 배 열한 척을 부수었다.",""],"latinus":["라티누스","사람","라티움의 늙은 왕. 딸을 낯선 손님에게 주라는 말을 들었다.",""],"lotophagoi":["로토파고이","무리","먹으면 집을 잊게 되는 열매를 먹고 사는 사람들.",""],"maron":["마론","사람","이스마로스에서 아폴론을 모시던 사람. 오디세우스에게 진한 포도주를 주었다.",""],"mezentius":["메젠티우스","사람","신을 무시한 에트루리아의 왕. 투르누스 편에서 싸웠다.",""],"mentor":["멘토르","사람","오디세우스의 오랜 친구. 아테나가 자주 그 모습을 빌렸다.",""],"misenos":["미세노스","사람","나팔을 불어 싸움을 알리던 사람. 쿠마이 바닷가에서 죽었다.",""],"seirenes":["세이레네스","무리","노래로 뱃사람을 끌어당겨 집에 돌아가지 못하게 하는 자매.",""],"skylla":["스킬라","괴물","머리가 여섯인 바위 굴의 괴물. 지나가는 배에서 사람을 잡아간다.",""],"arete":["아레테","사람","파이아케스의 왕비. 오디세우스는 왕보다 먼저 이 왕비에게 부탁했다.",""],"argos-hound":["아르고스","괴물","스무 해를 기다려 주인을 알아본 오디세우스의 개.",""],"amata":["아마타","사람","라티누스의 왕비. 딸을 투르누스에게 주고 싶었다.",""],"askanios":["아스카니오스","사람","아버지의 손을 잡고 트로이를 떠난 아이. 뒷날 알바 롱가를 세운다.",""],"aigisthos":["아이기스토스","사람","아가멤논이 없는 동안 그 자리를 차지하고, 돌아온 아가멤논을 죽인 사람.",""],"aiolos-anemon":["아이올로스","신","바람을 맡은 이. 오디세우스에게 바람을 담은 주머니를 주었다.",""],"akhaimenides":["아카이메니데스","사람","키클롭스의 땅에 버려졌다가 트로이 사람들이 구해 준 그리스 사람.",""],"achates":["아카테스","사람","아이네이아스 곁을 늘 지킨 가장 믿음직한 친구.",""],"anna":["안나","사람","디도의 동생. 언니의 마음을 가장 먼저 들었다.",""],"antinoos":["안티노오스","사람","구혼자들의 우두머리. 오디세우스의 첫 화살에 죽었다.",""],"alkinoos":["알키노오스","사람","낯선 손님에게 잔치를 열고 배를 내어 준 파이아케스의 왕.",""],"evandros":["에반드로스","사람","그리스에서 건너와 로마가 될 언덕에 마을을 세운 늙은 왕.",""],"eurymachos":["에우리마코스","사람","말을 잘하던 구혼자. 안티노오스가 죽자 용서를 빌었다.",""],"euryalos":["에우리알로스","사람","니소스의 어린 친구. 함께 밤길을 나섰다가 죽었다.",""],"eurykleia":["에우리클레이아","사람","오디세우스를 키운 늙은 유모. 발을 씻어 주다 흉터로 알아보았다.",""],"eumaios":["에우마이오스","사람","오디세우스의 돼지치기. 거지 모습의 주인을 먼저 대접했다.",""],"eupeithes":["에우페이테스","사람","안티노오스의 아버지. 아들의 원수를 갚으러 나섰다가 죽었다.",""],"elektra":["엘렉트라","사람","어린 동생 오레스테스를 몰래 빼내어 살린 아가멤논의 딸.",""],"elpenor":["엘페노르","사람","키르케의 집 지붕에서 떨어져 죽은 오디세우스의 동료.",""],"orestes":["오레스테스","영웅","아버지의 원수를 갚고, 그 때문에 에리니에스에게 쫓긴 아가멤논의 아들.",""],"kanens":["카넨스","님프","노래로 바위와 짐승을 움직이던 님프. 남편을 잃고 울다가 사라졌다.",""],"charybdis":["카리브디스","괴물","하루 세 번 바닷물을 들이마시고 뿜어내는 괴물.",""],"kamilla":["카밀라","영웅","볼스키 사람들을 이끈 여전사. 아르테미스가 아꼈다.",""],"kalypso":["칼립소","님프","바다 한가운데 섬에 사는 님프. 오디세우스를 일곱 해 동안 붙잡아 두었다.",""],"sibylla-kymaia":["쿠마이의 시빌레","사람","아폴론의 말을 전하는 쿠마이의 여자. 아이네이아스를 저승으로 이끌었다.",""],"kirke":["키르케","신","사람을 짐승으로 바꾸는 약을 아는 헬리오스의 딸.",""],"telemachos":["텔레마코스","영웅","아버지를 찾아 길을 떠난 오디세우스의 아들.",""],"turnus":["투르누스","영웅","루툴리 사람들의 젊은 왕. 라비니아를 빼앗겼다고 여겨 싸웠다.",""],"faunus":["파우누스","신","라티움의 숲과 들을 지키는 신. 라티누스 왕의 아버지다.",""],"pallas":["팔라스","영웅","에반드로스의 젊은 아들. 첫 싸움에서 투르누스에게 죽었다.",""],"palinouros":["팔리누로스","사람","아이네이아스의 배를 몰던 뱃길잡이. 잠에 빠져 바다에 떨어졌다.",""],"phemios":["페미오스","사람","오디세우스의 집에서 노래하는 사람. 구혼자들이 억지로 노래를 시켰다.",""],"polyphemos":["폴리페모스","괴물","이마에 눈이 하나뿐인 거인. 오디세우스가 그 눈을 못 보게 만들었다.",""],"picus":["피쿠스","사람","키르케가 딱따구리로 바꾸어 버린 라티움의 젊은 왕.",""],"pylades":["필라데스","사람","오레스테스와 함께 자라 어디든 함께 간 친구.",""],"hermione":["헤르미오네","사람","메넬라오스와 헬레네의 하나뿐인 딸.",""],"gorgon-land":["고르곤의 땅","이야기 속의 곳","세상의 서쪽 끝, 밤이 시작되는 곳에 있는 고르곤 세 자매의 집.",""],"laistrygonia":["라이스트리고네스의 땅","이야기 속의 곳","거인 무리가 사는 땅. 오디세우스의 배 열한 척이 여기서 부서졌다.",""],"lotophagoi-land":["로토파고이의 땅","이야기 속의 곳","먹으면 집을 잊는 열매가 자라는 땅.",""],"seirenes-island":["세이레네스의 섬","이야기 속의 곳","노래하는 자매가 앉아 있는 풀밭 섬. 둘레에 뼈가 쌓여 있다.",""],"scheria":["스케리아","이야기 속의 곳","알키노오스 왕이 다스리는 파이아케스 사람들의 나라.",""],"skylla-strait":["스킬라와 카리브디스의 바다","이야기 속의 곳","두 바위 사이 좁은 물길. 한쪽엔 스킬라, 한쪽엔 카리브디스.",""],"styx-river":["스틱스 강","이야기 속의 곳","산 사람의 세계와 죽은 사람의 세계를 가르는 강.",""],"olympus-home":["신들의 집","이야기 속의 곳","올림포스 산 위, 구름 너머에 있다는 신들의 집.",""],"symplegades":["심플레가데스","이야기 속의 곳","서로 부딪쳐 배를 부수던 두 바위. 아르고호가 지나간 뒤 멈추었다.",""],"aiaia":["아이아이아","이야기 속의 곳","키르케가 사는 섬. 새벽이 시작되는 동쪽에 있다고 했다.",""],"aiolia":["아이올리아","이야기 속의 곳","청동 벽으로 둘러싸인, 바다 위에 떠다니는 아이올로스의 섬.",""],"erytheia":["에리테이아","이야기 속의 곳","세상 서쪽 끝 바다 건너에 있던 게리온의 섬.",""],"aithiopia":["에티오피아","이야기 속의 곳","세상의 남쪽 끝에 있다고 여겨진 나라. 안드로메다의 고향이다.",""],"elysion":["엘리시온","이야기 속의 곳","저승 안에 있는 좋은 들판. 신들이 아끼는 사람만 간다.",""],"ogygia":["오기기아","이야기 속의 곳","바다 한가운데 있다는 칼립소의 섬.",""],"o ,"곳","트로이 앞바다의 작은 섬. 그리스 배들이 목마를 두고 여기 숨었다.","튀르키예 보즈자아다 섬"],"themiskyra":["테미스키라","곳","테르모돈 강가에 있던 아마조네스의 도시.","튀르키예 삼순 주 테르메 근처"],"thebes":["테베","곳","카드모스가 암소가 누운 자리에 세운 도시. 오이디푸스의 도시다.","그리스 티바"],"tiber":["테베레 강","곳","아이네이아스의 배가 마침내 들어간 강. 그 강가에 뒷날 로마가 선다.","이탈리아 테베레 강 하구 (로마 서쪽 오스티아)"],"trachis":["트라키스","곳","헤라클레스가 마지막 몇 해를 보낸 오이타 산 아래 도시.","그리스 이라클리아(테르모필레 근처)"],"thrake":["트라키아","곳","그리스 북쪽의 넓은 땅. 오르페우스와 피네우스의 고향이다.","그리스 북동부·불가리아 남부·튀르키예 유럽 쪽에 걸친 트라키아 지방"],"troy":["트로이","곳","10년 동안 그리스군에 둘러싸여 싸운 성.","튀르키예 히사를리크"],"troizen":["트로이젠","곳","테세우스가 태어나 자란 곳. 바위 밑에 검이 있었다.","그리스 트리지나"],"tiryns":["티린스","곳","헤라클레스가 에우리스테우스를 섬기며 살던 성.","그리스 티린스 유적(나플리오 근처)"],"parnassos":["파르나소스 산","곳","큰 홍수 때 데우칼리온의 상자가 닿은 산.","그리스 파르나소스, 높이 2457m. 델포이 바로 위"],"pallene":["팔레네","곳","거인들이 태어나 신들과 싸웠다는 반도.","그리스 할키디키의 카산드라 반도"],"mt-pelion":["펠리온 산","곳","이올코스 뒤에 솟은 산. 케이론이 살던 곳이다.","그리스 테살리아 펠리온 산, 높이 1624m"],"phthia":["프티아","곳","펠레우스와 아킬레우스의 고향. 미르미돈 사람들의 땅이다.","그리스 테살리아 파르살라 부근"],"pisa":["피사","곳","오이노마오스와 펠롭스가 전차 경주를 한 곳.","그리스 올림피아 부근"],"pylos":["필로스","곳","네스토르 왕의 나라. 텔레마코스가 아버지 소식을 찾아 처음 간 곳.","그리스 필로스 근처 호라, 네스토르 궁전 터"]}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var ALL = DATA.qs, G = DATA.g;
  var ROUND = 10;
  var $ = function (id) { return document.getElementById(id); };
  var cats = { figure: true, place: true, thing: true };
  var queue = [], pos = 0, ok = 0, cur = null, answered = false;

  function count(c) { return ALL.filter(function (q) { return q.cat === c; }).length; }
  $('n-figure').textContent = count('figure'); $('n-place').textContent = count('place'); $('n-thing').textContent = count('thing');
  $('n-all').textContent = ALL.length;

  // 한 번 나온 문제는 다 돌 때까지 다시 내지 않는다 — 이 브라우저에만 남는 기록
  function seenGet() { try { return JSON.parse(localStorage.getItem('seen') || '[]'); } catch (e) { return []; } }
  function seenPut(s) { try { localStorage.setItem('seen', JSON.stringify(s)); } catch (e) {} }

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function buildQueue() {
    var pool = ALL.map(function (q, i) { return i; }).filter(function (i) { return cats[ALL[i].cat]; });
    var seen = seenGet();
    var fresh = pool.filter(function (i) { return seen.indexOf(i) < 0; });
    if (fresh.length < ROUND) { seen = seen.filter(function (i) { return pool.indexOf(i) < 0; }); seenPut(seen); fresh = pool; }
    queue = shuffle(fresh).slice(0, ROUND);
    seenPut(seen.concat(queue));
  }

  function show(sec) { ['intro', 'play', 'done'].forEach(function (s) { $(s).hidden = s !== sec; }); $('score').hidden = $('bar').hidden = sec !== 'play'; }

  function render() {
    cur = ALL[queue[pos]]; answered = false;
    $('label').textContent = cur.label || '';
    fill($('q'), cur.qp, cur.q);
    var box = $('choices'); box.innerHTML = '';
    var short = cur.choices.every(function (c) { return c.length <= 12; });
    box.className = 'choices' + (short ? ' short' : '');
    cur.choices.forEach(function (c, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.i = i;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
      b.appendChild(n); b.appendChild(document.createTextNode(c));
      b.addEventListener('click', function () { pickChoice(i, b); });
      box.appendChild(b);
    });
    $('fb').hidden = true; $('fb').className = 'fb'; $('fb').innerHTML = '';
    $('next').disabled = true;
    closePop();
    $('s-pos').textContent = pos + 1; $('s-len').textContent = queue.length; $('s-ok').textContent = ok;
    $('bar-i').style.width = (pos / queue.length * 100) + '%';
    box.firstChild && box.firstChild.focus();
  }

  function pickChoice(i, btn) {
    if (answered) return;
    var fb = $('fb'); fb.hidden = false;
    if (i === cur.a) {
      answered = true; ok++;
      btn.classList.add('ok');
      Array.prototype.forEach.call($('choices').children, function (b) { b.disabled = true; });
      fb.className = 'fb ok';
      fb.innerHTML = '';
      var b = document.createElement('b'); b.textContent = '맞았다! ';
      if (cur.aid) { b.appendChild(term(cur.choices[cur.a], [cur.aid])); } else { b.appendChild(document.createTextNode(cur.choices[cur.a])); }
      fb.appendChild(b);
      if (cur.x) { var x = document.createElement('span'); x.className = 'x'; fill(x, cur.xp, cur.x); fb.appendChild(x); }
      $('next').disabled = false; $('next').focus();
      $('s-ok').textContent = ok;
    } else {
      btn.classList.add('bad'); btn.disabled = true;
      fb.className = 'fb bad';
      fb.innerHTML = '<b>아니야.</b><span>' + esc(cur.choices[i]) + '은(는) 아니다. 다시 골라 보자.</span>';
    }
  }

  function next() {
    if (!answered) return;
    closePop();
    pos++;
    if (pos >= queue.length) { finish(); return; }
    render();
  }

  function finish() {
    show('done');
    $('final').textContent = ok + ' / ' + queue.length;
    $('final-msg').textContent = ok === queue.length ? '다 맞혔다.' : ok >= queue.length * 0.7 ? '잘했다.' : '다음 판엔 더 맞힐 수 있다.';
    var left = ALL.filter(function (q, i) { return cats[q.cat] && seenGet().indexOf(i) < 0; }).length;
    $('final-sub').textContent = '아직 안 나온 문제 ' + left + '개.';
  }

  function start() { pos = 0; ok = 0; buildQueue(); show('play'); render(); }

  // 글 속의 이름 — 누르면 설명 말풍선
  function fill(el, parts, text) {
    el.innerHTML = '';
    if (!parts) { el.textContent = text; return; }
    parts.forEach(function (p) { el.appendChild(typeof p === 'string' ? document.createTextNode(p) : term(p[0], p[1])); });
  }
  function term(text, ids) {
    var t = document.createElement('span'); t.className = 'term'; t.textContent = text; t.tabIndex = 0; t.setAttribute('role', 'button');
    t.addEventListener('click', function (e) { e.stopPropagation(); openPop(t, ids); });
    t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPop(t, ids); } });
    return t;
  }
  var pop = $('pop'), popFor = null;
  function mask(s) {   // 아직 못 맞혔으면 답의 이름을 가린다
    if (answered || !cur || !cur.an) return s;
    cur.an.forEach(function (n) { s = s.split(n).join('○○'); });
    return s;
  }
  function openPop(anchor, ids) {
    if (popFor === anchor && !pop.hidden) { closePop(); return; }
    pop.innerHTML = '';
    ids.forEach(function (id) {
      var g = G[id]; if (!g) return;
      var d = document.createElement('div'); d.className = 'pop-item';
      d.innerHTML = '<div class="pop-h"><b>' + esc(g[0]) + '</b><span>' + esc(g[1]) + '</span></div><p>' + esc(mask(g[2])) + '</p>' + (g[3] ? '<p class="pop-m">지금의 ' + esc(g[3]) + '</p>' : '');
      pop.appendChild(d);
    });
    pop.hidden = false; popFor = anchor;
    if (window.innerWidth >= 560) {
      var r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
      var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
      pop.style.left = left + 'px'; pop.style.top = (r.bottom + 6) + 'px';
      pop.className = 'pop anchored';
    } else { pop.className = 'pop sheet'; pop.style.left = pop.style.top = ''; }
  }
  function closePop() { pop.hidden = true; popFor = null; }
  document.addEventListener('click', function (e) { if (!pop.hidden && !pop.contains(e.target)) closePop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
  window.addEventListener('scroll', function () { if (!pop.hidden && pop.classList.contains('anchored')) closePop(); }, { passive: true });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.cat'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true';
    if (!on && Object.keys(cats).filter(function (k) { return cats[k]; }).length === 1) return;  // 하나는 남긴다
    cats[b.dataset.cat] = on; b.setAttribute('aria-pressed', on);
  });
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('again-cats').addEventListener('click', function () { show('intro'); });
  $('next').addEventListener('click', next);
  document.addEventListener('keydown', function (e) {
    if ($('play').hidden) return;
    if (e.key >= '1' && e.key <= '4') { var b = $('choices').children[+e.key - 1]; if (b && !b.disabled) b.click(); }
    else if (e.key === 'Enter' && answered) { next(); }
  });
})();
</script>
