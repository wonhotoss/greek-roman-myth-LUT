# era 8 — 로마가 세워지다. 알바 롱가, 로마, 사비니의 쿠레스, 아리키아의 숲.
# tiber·lavinium 은 AEN 소유라 여기서 만들지 않고 참조만 한다.

[[place]]
id = "alba-longa"
name_ko = "알바 롱가"
aka = ["알바", "긴 알바"]
kind = "real"
lat = 41.7470
lon = 12.6500
modern = "이탈리아 카스텔 간돌포 부근, 알바노 호수 곁"
oneliner = "아스카니오스가 세운 도시. 로물루스의 할아버지가 다스렸다."
body = """
아이네이아스의 아들 아스카니오스가 알바 산 아래에 세웠다.
언덕 등을 따라 길게 뻗어 있어 '긴 알바'라는 이름이 붙었다.
실비우스 집안의 왕들이 여러 대를 이어 다스렸다.
로물루스와 레무스가 여기서 태어났다.
지금은 로마 남동쪽 알바노 호수 곁의 마을이 그 자리로 여겨진다.
"""
note = "정확한 자리는 다투어진다. 카스텔 간돌포 부근이 가장 널리 받아들여져 그 좌표를 쓴다."
sources = ["livy.rome 1.3", "virgil.aeneid 1.267-271", "ovid.metamorphoses 14.609-610"]

[[place]]
id = "rome"
name_ko = "로마"
name_grc = "Roma"
aka = ["로마 시", "팔라티노 언덕", "팔라티움"]
kind = "real"
lat = 41.8892
lon = 12.4875
modern = "이탈리아 로마 (팔라티노 언덕)"
oneliner = "로물루스가 팔라티노 언덕에 세운 도시. 지금의 로마다."
body = """
티베리스 강가의 언덕들 위에 세워졌다.
로물루스는 자기가 자란 팔라티노 언덕에 먼저 담을 쌓았다.
카피톨리노 언덕에는 성채가 있었다.
사비니 사람들이 함께 살게 되면서 도시가 두 배로 커졌다.
지금도 이탈리아의 수도이고, 팔라티노 언덕에는 옛 궁전 터가 남아 있다.
"""
fun = "로마 사람들은 '도시가 세워진 해부터' 해를 셌다. 리비우스의 책 제목이 바로 '도시가 세워진 때부터'라는 뜻이다."
note = "좌표는 팔라티노 언덕. 로마가 세워지기 전의 이야기(헤라클레스와 카쿠스, era 5)도 이 장소에 붙인다 — body 에서 '로마가 세워지기 오래 전의 그 언덕'으로 부른다."
sources = ["livy.rome 1.7", "livy.rome 1.12-1.13", "virgil.aeneid 8.185-275"]

[[place]]
id = "cures"
name_ko = "쿠레스"
kind = "real"
lat = 42.2000
lon = 12.7250
modern = "이탈리아 파라 인 사비나 부근"
oneliner = "사비니 사람들의 도시. 로마의 두 번째 왕 누마가 살던 곳이다."
body = """
로마 북동쪽 산지에 있던 사비니 사람들의 도시다.
티투스 타티우스가 이 도시의 왕이었다.
두 민족이 하나가 된 뒤 로마 사람들은 스스로를 퀴리테스라고도 불렀다.
그 이름이 쿠레스에서 왔다.
누마도 이 도시에서 로마로 불려 갔다.
"""
sources = ["livy.rome 1.13", "livy.rome 1.18", "ovid.metamorphoses 14.778"]

[[place]]
id = "aricia"
name_ko = "아리키아"
aka = ["아리차", "네미 호수의 숲", "디아나의 숲"]
kind = "real"
lat = 41.7190
lon = 12.7030
modern = "이탈리아 네미 호수 (아리차 부근)"
oneliner = "아르테미스의 숲이 있던 골짜기. 에게리아가 샘이 된 곳이다."
body = """
알바 산 아래 호수 곁 골짜기에 아르테미스의 숲이 있었다.
오레스테스가 먼 곳에서 가져온 아르테미스의 상이 여기 있었다고 한다.
누마가 죽자 에게리아가 이 숲에 숨어 울었다.
아르테미스가 우는 에게리아를 샘으로 만들었다.
히폴리토스도 죽은 뒤 되살아나 이 숲에서 살았다.
"""
fun = "로마에서는 아르테미스를 디아나라고 불렀다. 그래서 이 숲은 디아나의 숲이라고도 한다."
sources = ["ovid.metamorphoses 15.485-551"]
