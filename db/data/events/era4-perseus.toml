# era 4 — 첫 영웅들. 페르세우스의 여행 전체. seq 5~90.
# 이 서사는 arc = "perseus-journey" 로 묶인다. 순서는 arcs.toml 에 있다.
# seq 5 메두사의 저주는 시간축으로는 맨 앞이지만 묶음 안에서는 오비디우스처럼 안드로메다 뒤의 회상이다.

[[event]]
id = "medousa-cursed"
name_ko = "메두사의 머리카락이 뱀이 되다"
era = 4
seq = 5
span = "moment"
place_unknown = true
cast = [
  { figure = "medousa", role = "피해" },
  { figure = "poseidon", role = "상대" },
  { figure = "athena", role = "상대" },
]
oneliner = "가장 고운 머리카락이 벌로 뱀이 되었다."
body = """
메두사는 본디 아름다운 처녀였고, 머리카락이 가장 고왔다.
바다의 신 포세이돈이 아테나의 신전에서 메두사를 억지로 붙잡았다.
아테나는 눈을 돌리고 방패로 얼굴을 가렸다.
그리고 벌을 메두사에게 주어, 그 머리카락을 뱀으로 바꾸었다.
"""
fun = "페르세우스는 이 이야기를 안드로메다와의 결혼 잔치에서 손님들에게 들려주었다. 오비디우스가 그렇게 적었다."
sensitivity = "soften"
record = "포세이돈이 아테나의 신전에서 메두사를 겁탈했다. 아테나는 눈을 돌려 방패로 가렸고, 벌을 포세이돈이 아니라 메두사에게 주어 머리카락을 뱀으로 바꾸었다. 아테나는 그 뱀을 자기 가슴받이에도 달았다(오비디우스 4.794-4.803). 헤시오도스 278-279 는 '검은 머리의 신(포세이돈)이 봄꽃 핀 부드러운 풀밭에서 메두사와 누웠다'고만 한다 — 신전도 벌도 없다."
note = "장소 없음 — 오비디우스는 '미네르바의 신전'이라고만 한다. seq 5: 페르세우스 이야기 전부보다 앞이지만 언제인지는 원전에 없다. 눈을 마주친 것이 돌이 되는 힘이 이때 생겼다는 말은 오비디우스에 없어 쓰지 않았다 — 헤시오도스·아폴로도로스에서 고르곤은 본디 그런 존재다."
sources = ["ovid.metamorphoses 4.790-4.803", "hesiod.theogony 278-279", "apollodorus.library 2.4.3"]

[[event.variants]]
source = "apollodorus.library 2.4.3"
text = "아폴로도로스는 다른 까닭도 적었다. 메두사가 아테나와 아름다움을 겨루려 해서, 아테나 때문에 목이 잘렸다는 것이다."

[[event.variants]]
source = "hesiod.theogony 278-279"
text = "헤시오도스에는 벌 이야기가 없다. 포세이돈이 봄꽃 핀 풀밭에서 메두사를 만났다고만 적었다."

[[event]]
id = "akrisios-oracle"
name_ko = "아크리시오스가 신의 말을 듣다"
era = 4
seq = 10
span = "moment"
place_unknown = true
cast = [
  { figure = "akrisios", role = "주인공" },
  { figure = "danae", role = "피해" },
]
oneliner = "딸의 아들이 너를 죽인다는 대답이 왔다."
body = """
아르고스의 왕 아크리시오스는 아들이 없었다.
어떻게 아들을 얻는지 신에게 물었다.
아들은 얻지 못하고, 딸의 아들이 너를 죽일 것이라는 대답이 왔다.
왕은 딸 다나에를 땅 아래 청동 방에 갇히게 했다.
"""
note = "어디서 물었는지는 원전에 없다 — 아폴로도로스 2.4.1 은 '신탁에 물었다', 히기누스 63 은 '예언이 있었다'고만 한다. place = delphi 로 적혀 있던 것을 2026-10-02 에 지웠다. 히기누스는 청동 방이 아니라 돌로 쌓은 감옥이라 한다."
sources = ["apollodorus.library 2.4.1", "hyginus.fabulae 63"]

[[event]]
id = "perseus-born"
name_ko = "황금 비와 페르세우스의 탄생"
era = 4
seq = 15
span = "moment"
place = "argos"
cast = [
  { figure = "zeus", role = "주인공" },
  { figure = "danae", role = "피해" },
  { figure = "perseus", role = "등장" },
  { figure = "akrisios", role = "상대" },
]
oneliner = "문이 없는 청동 방에 제우스가 황금 비가 되어 들어왔다."
body = """
아크리시오스는 딸을 땅 아래 청동 방에 가두었다.
그런데 제우스가 황금 비로 모습을 바꾸어 지붕 틈으로 흘러 들어왔다.
다나에에게 아들이 태어났다. 페르세우스다.
아크리시오스는 제우스의 아이라는 말을 믿지 않았다.
"""
fun = "제우스가 모습을 바꾼 것 가운데 황소도 백조도 아닌 비는 이때뿐이다."
sensitivity = "soften"
record = "제우스가 황금 비가 되어 지붕을 지나 다나에의 무릎에 쏟아져 내려 동침했다(아폴로도로스 2.4.1, 히기누스 63, 오비디우스 4.610-4.611). 아폴로도로스는 '어떤 이들은 프로이토스가 다나에를 유혹했다고 하며, 형제의 다툼이 거기서 났다'는 이설도 적었다."
caused_by = ["akrisios-oracle"]
note = "제우스 타래(zeus-partners)의 '다나에 → 페르세우스' 단계는 danae-set-adrift 를 가리키고 있었다 — 이 사건으로 바꾸었다."
sources = ["apollodorus.library 2.4.1", "hyginus.fabulae 63", "ovid.metamorphoses 4.610-4.611"]

[[event.variants]]
source = "apollodorus.library 2.4.1"
text = "아버지가 제우스가 아니라 아크리시오스의 동생 프로이토스라는 이야기도 있다고 아폴로도로스는 적었다. 두 형제가 싸운 까닭이 그것이라고 한다."

[[event]]
id = "danae-set-adrift"
name_ko = "다나에와 아기가 바다에 띄워지다"
era = 4
seq = 20
span = "days"
places = ["argos", "seriphos"]
cast = [
  { figure = "danae", role = "피해" },
  { figure = "perseus", role = "피해" },
  { figure = "akrisios", role = "상대" },
  { figure = "zeus", role = "등장" },
  { figure = "diktys", role = "도움" },
]
oneliner = "왕은 딸과 손자를 상자에 넣어 바다에 띄웠고, 어부가 건졌다."
body = """
아크리시오스는 손자가 제우스의 아들이라는 말을 믿지 않았다.
딸과 아기를 나무 상자에 넣어 바다에 띄웠다.
상자는 세리포스 섬까지 떠갔다.
어부 딕티스가 그물로 건져 두 사람을 집에 들였고, 페르세우스는 그 섬에서 자랐다.
"""
sensitivity = "soften"
caused_by = ["perseus-born"]
sources = ["apollodorus.library 2.4.1", "hyginus.fabulae 63"]

[[event.variants]]
source = "hyginus.fabulae 63"
text = "히기누스는 딕티스가 두 사람을 왕 폴리덱테스에게 데려갔고, 왕이 다나에와 결혼해 페르세우스를 아테나의 신전에서 길렀다고 적었다."

[[event]]
id = "polydektes-demands"
name_ko = "왕이 메두사의 목을 요구하다"
era = 4
seq = 30
span = "moment"
place = "seriphos"
cast = [
  { figure = "polydektes", role = "상대" },
  { figure = "perseus", role = "주인공" },
  { figure = "danae", role = "피해" },
]
oneliner = "섬의 왕이 살아 돌아올 수 없는 일을 시켰다."
body = """
섬의 왕 폴리덱테스는 다나에를 억지로 아내로 삼으려 했다.
다 자란 페르세우스가 막고 있어 뜻대로 되지 않았다.
왕은 잔치를 열고 손님마다 선물을 가져오게 했다.
페르세우스에게는 메두사의 목을 가져오라고 했다. 돌아오지 못할 일이었다.
"""
sensitivity = "soften"
caused_by = ["danae-set-adrift"]
sources = ["apollodorus.library 2.4.2"]

[[event]]
id = "graiai-road"
name_ko = "그라이아이에게서 길을 알아내다"
era = 4
seq = 40
span = "days"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "graiai", role = "상대" },
  { figure = "athena", role = "도움" },
  { figure = "hermes", role = "도움" },
]
oneliner = "눈 하나를 돌려 쓰는 세 노파를 찾아가 길을 물었다."
body = """
아테나와 헤르메스가 페르세우스에게 길을 알려 줄 이들을 가르쳐 주었다.
그라이아이 세 자매는 눈알 하나와 이 하나를 번갈아 쓰고 있었다.
페르세우스는 눈이 손에서 손으로 넘어가는 사이에 눈과 이를 잡아챘다.
자매들은 어쩔 수 없이 님프들이 있는 곳을 알려 주었다.
페르세우스는 눈과 이를 돌려주고 님프들에게 갔다.
"""
fun = "님프들에게서 얻은 것이 세 가지다. 날개 달린 신발, 안 보이게 되는 하데스의 투구, 목을 담을 자루 키비시스. 헤르메스는 쇠로 된 낫을 주었다."
caused_by = ["polydektes-demands"]
note = "장소 없음 — 고르곤의 땅으로 가는 길목이다. 아폴로도로스 2.4.2 는 님프들이 있는 곳이라고만 한다. 오비디우스는 그라이아이가 아틀라스 산 아래 산다고 하지만 자매가 둘이라 판본이 다르다."
place_unknown = true
sources = ["apollodorus.library 2.4.2", "ovid.metamorphoses 4.772-4.779"]

[[event.variants]]
source = "ovid.metamorphoses 4.772-4.779"
text = "오비디우스는 자매가 둘이고 눈 하나만 돌려 썼으며, 아틀라스 산 아래 바위 틈에 산다고 적었다. 님프와 세 가지 도구 이야기는 없다."

[[event]]
id = "medusa-slain"
name_ko = "메두사의 목을 베다"
era = 4
seq = 50
span = "moment"
after = ["graiai-road"]
place = "gorgon-land"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "medousa", role = "상대" },
  { figure = "gorgones", role = "상대" },
  { figure = "athena", role = "도움" },
  { figure = "hermes", role = "도움" },
  { figure = "pegasos", role = "등장" },
  { figure = "chrysaor", role = "등장" },
]
oneliner = "눈을 마주치지 않고 이겼다. 목에서 페가수스와 크리사오르가 나왔다."
body = """
페르세우스는 세상의 서쪽 끝에 있는 고르곤의 땅으로 갔다.
들판과 길에 메두사를 본 사람과 짐승이 돌이 되어 서 있었다.
세 자매가 잠든 사이, 아테나가 손을 잡아 주어 방패에 비친 모습만 보면서 메두사의 목을 베었다.
목이 잘리자 그 자리에서 날개 달린 말 페가수스와 황금 칼을 든 크리사오르가 뛰어나왔다.
남은 두 자매가 깨어 쫓아왔지만, 안 보이게 되는 투구를 쓰고 달아났다.
"""
fun = "페르세우스가 이긴 방법은 힘이 아니라 거울이다. 아테나가 돕는 영웅은 늘 이렇게 이긴다."
caused_by = ["graiai-road"]
sources = ["apollodorus.library 2.4.2-2.4.3", "hesiod.theogony 280-283", "ovid.metamorphoses 4.772-4.786"]

[[event]]
id = "atlas-turned-to-mountain"
name_ko = "아틀라스가 산이 되다"
era = 4
seq = 55
span = "moment"
place = "hesperides-garden"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "atlas", role = "피해" },
]
oneliner = "하늘을 받치던 거인이 돌산이 되어 하늘을 받친다."
body = """
메두사의 목을 들고 날던 페르세우스는 저녁이 되자 세상 서쪽 끝 아틀라스의 땅에 내렸다.
아틀라스는 제우스의 아들이 황금 사과를 가져간다는 옛말을 알고 있었다.
그래서 제우스의 아들이라는 페르세우스를 쫓아내려 했다.
힘으로 당할 수 없자 페르세우스는 고개를 돌리고 메두사의 얼굴을 내밀었다.
아틀라스는 산이 되었다. 수염과 머리카락은 숲이, 어깨는 산등성이가 되었다.
"""
fun = "리비아 위를 날 때 메두사의 목에서 떨어진 핏방울이 땅에 닿아 뱀이 되었다. 그래서 그 땅에 뱀이 많다고 오비디우스는 적었다."
caused_by = ["medusa-slain"]
note = "오비디우스 4.621-4.662 에만 있다. 뒷날 헤라클레스가 아틀라스를 만나 하늘을 대신 받치는 것(hesperides-apples, 아폴로도로스 2.5.11)과 어긋난다 — 불확실-목록 E-3. 황금 사과의 옛말은 '파르나소스의 테미스'가 한 말이고, 사과를 지키는 용은 주석이 라돈이라 한다. 장소는 아틀라스의 집 hesperides-garden 으로 두었다."
sources = ["ovid.metamorphoses 4.617-4.662"]

[[event]]
id = "andromeda-rescued"
name_ko = "안드로메다를 구하다"
era = 4
seq = 60
span = "moment"
place = "aithiopia"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "andromeda", role = "피해" },
  { figure = "ketos", role = "상대" },
  { figure = "kassiopeia", role = "등장" },
  { figure = "kepheus", role = "등장" },
  { figure = "poseidon", role = "상대" },
]
oneliner = "바위에 묶인 공주를 보고 바다괴물을 물리쳤다."
after = ["atlas-turned-to-mountain"]
body = """
돌아오는 길에 페르세우스는 바닷가 바위에 묶인 안드로메다를 보았다.
어머니 카시오페이아의 자랑 때문에 포세이돈이 바다괴물을 보낸 것이었다.
페르세우스는 괴물을 물리치면 안드로메다를 아내로 달라고 케페우스에게 약속받았다.
그리고 괴물을 물리치고 안드로메다를 풀어 주었다.
"""
fun = "안드로메다, 페르세우스, 카시오페이아, 케페우스는 모두 별자리가 되었다. 가을 밤하늘에 네 별자리가 나란히 있다."
caused_by = ["medusa-slain"]
sources = ["apollodorus.library 2.4.3", "ovid.metamorphoses 4.663-4.764", "hyginus.fabulae 64"]

[[event]]
id = "phineus-turned-to-stone"
name_ko = "결혼 잔치에 쳐들어온 피네우스"
era = 4
seq = 65
span = "moment"
place = "aithiopia"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "phineus-aithiopia", role = "상대" },
  { figure = "andromeda", role = "등장" },
  { figure = "kepheus", role = "등장" },
]
oneliner = "약속했던 신랑이 잔치에 창을 들고 왔다."
body = """
안드로메다는 본디 케페우스의 동생 피네우스와 결혼하기로 되어 있었다.
괴물이 왔을 때 피네우스는 아무것도 하지 않았다.
그런데 결혼 잔치에 무리를 이끌고 와서 페르세우스를 죽이려 했다.
수가 너무 많자 페르세우스는 "내 편은 얼굴을 돌려라" 하고 메두사의 목을 꺼냈다.
피네우스와 그 무리는 그 자리에서 돌이 되었다.
"""
fun = "오비디우스는 돌이 된 사람이 이백 명이라고 적었다. 피네우스는 살려 달라고 빌다가 그 모습 그대로 돌이 되었다."
caused_by = ["andromeda-rescued"]
sources = ["apollodorus.library 2.4.3", "ovid.metamorphoses 5.1-5.235", "hyginus.fabulae 64"]

[[event.variants]]
source = "hyginus.fabulae 64"
text = "히기누스는 약혼자의 이름을 아게노르라 하고, 아버지 케페우스도 함께 페르세우스를 죽이려 했다가 돌이 되었다고 적었다."

[[event]]
id = "return-to-seriphos"
name_ko = "세리포스로 돌아오다"
era = 4
seq = 70
span = "moment"
after = ["phineus-turned-to-stone"]
place = "seriphos"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "polydektes", role = "상대" },
  { figure = "danae", role = "도움" },
  { figure = "diktys", role = "도움" },
  { figure = "athena", role = "도움" },
]
oneliner = "왕이 시킨 선물을 정말로 가져왔다."
body = """
페르세우스는 메두사의 목을 들고 섬으로 돌아왔다.
왕은 그것을 가져올 줄 몰랐다.
페르세우스가 목을 꺼내 보이자 왕은 돌이 되었다.
페르세우스는 딕티스를 섬의 왕으로 세우고, 목은 아테나에게 주었다.
"""
fun = "아테나는 그 목을 자기 방패 아이기스에 붙였다. 그래서 아테나의 방패에는 메두사의 얼굴이 있다."
caused_by = ["andromeda-rescued"]
sources = ["apollodorus.library 2.4.3"]

[[event]]
id = "akrisios-dies"
name_ko = "신의 말이 그대로 되다"
era = 4
seq = 80
span = "moment"
after = ["return-to-seriphos"]
place = "larissa"
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "akrisios", role = "피해" },
]
oneliner = "피하려고 애쓴 일이 우연히 일어났다."
body = """
아크리시오스는 손자가 돌아온다는 말을 듣고 라리사로 피했다.
페르세우스는 그곳에서 열린 운동 경기에 나가 원반을 던졌다.
원반이 빗나가 구경하던 아크리시오스에게 맞았고, 아크리시오스는 죽었다.
아무도 그럴 마음이 없었는데 신의 말은 그대로 되었다.
"""
fun = "그리스 신화에서 신의 말을 피하려고 한 일은 언제나 그 말이 이루어지는 원인이 된다."
caused_by = ["return-to-seriphos", "akrisios-oracle"]
sources = ["apollodorus.library 2.4.4", "pausanias.greece 2.16.2", "hyginus.fabulae 63"]

[[event.variants]]
source = "pausanias.greece 2.16.2"
text = "파우사니아스는 페르세우스가 할아버지를 보고 싶어 라리사로 찾아갔고, 새로 생긴 원반 던지기를 자랑하다가 사고가 났다고 적었다."

[[event.variants]]
source = "hyginus.fabulae 63"
text = "히기누스는 다르게 적었다. 아크리시오스가 세리포스까지 찾아왔고 페르세우스는 할아버지를 해치지 않겠다고 맹세했다. 그런데 폴리덱테스의 장례 경기에서 바람이 원반을 아크리시오스의 머리로 날렸다."

[[event.variants]]
source = "ovid.metamorphoses 5.236-5.241"
text = "오비디우스는 아예 다르다. 프로이토스가 아르고스를 빼앗았고, 페르세우스가 그를 돌로 만들어 할아버지를 다시 왕으로 세웠다."

[[event]]
id = "mycenae-founded"
name_ko = "페르세우스가 미케네를 세우다"
era = 4
seq = 90
span = "years"
after = ["akrisios-dies"]
places = ["tiryns", "mycenae"]
cast = [
  { figure = "perseus", role = "주인공" },
  { figure = "andromeda", role = "주인공" },
  { figure = "megapenthes", role = "등장" },
]
oneliner = "아르고스를 티린스와 바꾸고 미케네에 성을 쌓았다."
body = """
페르세우스는 자기가 죽게 만든 사람의 나라를 물려받기가 부끄러웠다.
그래서 티린스의 왕 메가펜테스를 찾아가 나라를 바꾸자고 했다.
메가펜테스가 아르고스를, 페르세우스가 티린스를 가졌다.
페르세우스는 미데아와 미케네에 성벽을 쌓았다.
안드로메다와의 사이에 아들 다섯과 딸 하나를 두었고, 그 자손에서 헤라클레스가 나온다.
"""
fun = "미케네라는 이름은 칼집 끝(뮈케스)이 떨어진 자리라서 붙었다고 한다. 목이 말라 버섯(뮈케스)을 뽑았더니 물이 나와서라는 이야기도 있다. 파우사니아스가 둘 다 적었다."
caused_by = ["akrisios-dies"]
note = "티린스의 성벽은 키클롭스가 프로이토스에게 쌓아 준 것(2.2.1). 미케네에서 난 아들 다섯은 알카이오스·스테넬로스·헬레우스·메스토르·엘렉트리온, 딸은 고르고포네. 페르세스는 그리스에 오기 전 케페우스에게 남겨 두었다(2.4.5). 미데아는 장소 항목이 없다."
sources = ["apollodorus.library 2.4.4-2.4.5", "pausanias.greece 2.16.3"]
