오케아노스의 딸이고, 이름은 꾀라는 뜻이다.
제우스가 크로노스를 이기도록 방법을 알려 준 것이 이 신이다.
제우스는 메티스를 삼켰고, 그 뒤 머리가 몹시 아파진다.
그 머리에서 아테나가 나온다.
"""
sensitivity = "soften"
sources = ["hesiod.theogony 886-900", "apollodorus.library 1.2.1", "apollodorus.library 1.3.6"]

