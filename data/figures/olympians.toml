oneliner = "신들의 왕비. 약속을 어긴 남편을 절대 용서하지 않는다."
body = """
제우스의 누나이면서 아내다.
결혼을 맡은 여신이라, 결혼의 약속을 깨는 것을 가장 싫어한다.
제우스가 다른 사람을 만날 때마다 화를 내고, 그 상대와 그 아이를 오래 괄롭힌다.
헤라클레스를 평생 방해한 것도 헤라다.
"""
note = "제우스의 관계는 다수가 sensitivity=soften 대상. 헤라의 분노는 그 결과이므로 이유는 약속을 어겼다로만 쓴다."
sources = ["hesiod.theogony 921-923", "apollodorus.library 2.4.8", "homer.iliad 1.536-570"]

