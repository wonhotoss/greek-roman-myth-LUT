제우스의 형이다.
제비를 뽑아 바다를 맡았다.
키클롭스가 만들어 준 삼지창으로 바위를 치면 샘이 솟고 땅이 흔들린다.
말을 처음 만든 신이라고도 한다.
"""
fun = "아테네를 차지하려고 아테나와 겨루었다가 졌다. 그때 포세이돈이 준 것은 소금물 샘이었다."
sources = ["apollodorus.library 1.2.1", "apollodorus.library 3.14.1", "homer.iliad 15.187-193"]

