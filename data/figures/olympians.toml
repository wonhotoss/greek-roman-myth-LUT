body = """
크로노스와 레아의 막내다.
형과 누나들이 모두 삼켜진 뒤, 크레타에 숨겨져 혼자 살아남았다.
자라서 크로노스를 이기고 티탄들을 타르타로스에 갇히게 했다.
번개를 던지고, 약속을 어긴 사람과 손님을 괄시한 사람에게 벌을 준다.
"""
fun = "제우스는 힘으로만 이긴 것이 아니다. 갇혀 있던 키클롭스와 백 손 거인을 먼저 풀어 편으로 만들었다."
sources = ["hesiod.theogony 453-506", "apollodorus.library 1.2.1", "homer.iliad 15.187-193"]

[[figure]]
id = "hera"
