# era 0 — 태초. 카오스에서 첫 신들이 나오다.
# 계보의 뿌리. 여기 id 들이 바뀌면 전부 깨진다.

[[figure]]
id = "chaos"
name_ko = "카오스"
name_grc = "Chaos"
aka = ["혼돈"]
kind = "primordial"
era = 0
oneliner = "무엇보다 먼저 있었던 텅 빈 것."
body = """
가장 먼저 있었던 것은 카오스다.
땅도 하늘도 없고, 위아래도 없는 빈 곳이었다.
여기서 첫 신들이 하나씩 나왔다.
카오스는 사람 모습으로 그려지지 않는다. 이야기도 하지 않는다.
"""
fun = "'카오스'는 원래 '엉망'이라는 뜻이 아니라 '크게 벌어진 틈'이라는 뜻이었다."
sources = ["hesiod.theogony 116-138"]

[[figure]]
id = "gaia"
name_ko = "가이아"
name_grc = "Gaia"
name_la = "Terra"
aka = ["대지", "게", "테라"]
kind = "primordial"
era = 0
oneliner = "땅 그 자체인 신. 거의 모든 것의 어머니다."
body = """
카오스 다음에 넓은 가슴의 가이아가 나왔다.
가이아는 땅이면서 땅의 신이다.
우라노스, 산, 바다를 낳고 티탄들을 낳았다.
자기 자식이 갇히면 참지 않고 반란을 꾸민다. 신화에서 가이아는 늘 화가 나 있다.
"""
sources = ["hesiod.theogony 116-138", "hesiod.theogony 154-182"]

[[figure]]
id = "tartaros"
name_ko = "타르타로스"
name_grc = "Tartaros"
kind = "primordial"
era = 0
oneliner = "가장 깊은 곳. 신이면서 장소다."
body = """
카오스 다음에 나온 첫 신들 가운데 하나다.
땅 아래 가장 깊은 곳이고, 그 자체로 신이다.
나중에 이곳은 신들의 감옥이 된다.
"""
note = "장소로서는 place tartaros-place. 원전은 둘을 구분하지 않는다."
sources = ["hesiod.theogony 116-138", "hesiod.theogony 720-819"]

[[figure]]
id = "eros-primordial"
name_ko = "에로스"
name_grc = "Eros"
name_la = "Cupido"
aka = ["쿠피도", "큐피드"]
kind = "primordial"
era = 0
oneliner = "서로를 끌어당기게 하는 힘. 첫 신들 가운데 하나다."
body = """
카오스 다음에 나온 가장 아름다운 신이다.
이 신 때문에 신들이 서로를 만나 자식을 낳는다.
에로스가 없으면 계보가 시작되지 않는다.
"""
note = "뒷시대에는 아프로디테의 아들인 활 쏘는 아이로 그려진다. variants 로 별도 항목을 만들 것."
sources = ["hesiod.theogony 116-138"]

[[figure]]
id = "nyx"
name_ko = "닉스"
name_grc = "Nyx"
name_la = "Nox"
aka = ["밤"]
kind = "primordial"
era = 0
parents = ["chaos"]
oneliner = "밤 그 자체인 신. 제우스도 닉스를 건드리지 않는다."
body = """
카오스에서 나왔다.
잠, 죽음, 꿈이 모두 닉스의 자식이다.
힘이 아주 세서, 제우스마저 닉스에게는 함부로 하지 않았다.
"""
sources = ["hesiod.theogony 116-138", "hesiod.theogony 211-232", "homer.iliad 14.256-261"]

[[figure]]
id = "erebos"
name_ko = "에레보스"
name_grc = "Erebos"
aka = ["어둠"]
kind = "primordial"
era = 0
parents = ["chaos"]
spouses = ["nyx"]
oneliner = "어둠 그 자체인 신."
body = """
카오스에서 나온 어둠이다.
닉스와 함께 낮과 밝은 하늘을 낳았다.
어둠에서 밝음이 나온다는 것이 그리스 사람들의 생각이었다.
"""
sources = ["hesiod.theogony 116-138"]

[[figure]]
id = "pontos"
name_ko = "폰토스"
name_grc = "Pontos"
aka = ["바다"]
kind = "primordial"
era = 0
parents = ["gaia"]
oneliner = "바다 그 자체인 신. 바다 괴물들의 조상이다."
body = """
가이아가 혼자 낳았다.
포세이돈보다 훨씬 먼저 있던 바다다.
고르곤, 케토 같은 바다의 괴물들이 이 신의 자손이다.
"""
sources = ["hesiod.theogony 116-138", "hesiod.theogony 233-239"]

[[figure]]
id = "ouranos"
name_ko = "우라노스"
name_grc = "Ouranos"
name_la = "Caelum"
aka = ["하늘", "우라누스"]
kind = "primordial"
era = 0
parents = ["gaia"]
spouses = ["gaia"]
domains = ["하늘"]
oneliner = "하늘 그 자체인 신. 세상의 첫 임금이다."
body = """
가이아가 낳았고, 가이아와 함께 티탄들을 낳았다.
세상을 처음으로 다스린 임금이다.
힘센 자식들이 무서워 땅속에 가두어 버렸다.
그래서 가이아가 화가 나 막내 크로노스를 시켜 우라노스를 쳤고, 우라노스는 왕좌를 잃는다.
"""
sensitivity = "soften"
note = "원전의 거세는 쓰지 않는다(집필-지침.md). '쳐서 왕좌를 빼앗았다'까지."
sources = ["hesiod.theogony 154-182", "apollodorus.library 1.1.1-1.1.4"]

[[figure]]
id = "kyklopes"
name_ko = "키클롭스들"
name_grc = "Kyklopes"
aka = ["퀴클롭스", "사이클롭스", "외눈박이 거인"]
kind = "group"
era = 0
parents = ["gaia", "ouranos"]
oneliner = "이마에 눈이 하나뿐인 세 형제. 대장장이다."
body = """
브론테스, 스테로페스, 아르게스 세 형제다.
이름은 각각 천둥, 번개, 벼락이라는 뜻이다.
우라노스가 땅속에 가두었고, 제우스가 꺼내 주었다.
고맙다며 제우스에게 번개를, 포세이돈에게 삼지창을, 하데스에게 안 보이게 되는 투구를 만들어 주었다.
"""
fun = "오디세우스가 만나는 외눈박이 폴리페모스는 이 형제들과 다른 종족이다."
sources = ["hesiod.theogony 139-146", "apollodorus.library 1.2.1"]

[[figure]]
id = "hekatoncheires"
name_ko = "헤카톤케이레스"
name_grc = "Hekatoncheires"
aka = ["백 손 거인", "브리아레오스"]
kind = "group"
era = 0
parents = ["gaia", "ouranos"]
oneliner = "팔이 백 개, 머리가 쉰 개인 세 거인."
body = """
코토스, 브리아레오스, 기에스 세 형제다.
팔이 백 개라서 한 번에 바위 백 개를 던질 수 있었다.
우라노스와 크로노스가 차례로 이들을 땅속에 가두었다.
제우스가 꺼내 편으로 만든 덕에 티탄과의 전쟁에서 이긴다.
"""
sources = ["hesiod.theogony 147-153", "hesiod.theogony 617-719"]
