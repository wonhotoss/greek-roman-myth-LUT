# era 4 — 첫 영웅들. 페르세우스 이야기에 나오는 인물들.
# 고르곤의 계보를 위해 폰토스 계열(포르키스·케토)도 여기 둔다.

[[figure]]
id = "akrisios"
name_ko = "아크리시오스"
name_grc = "Akrisios"
kind = "human"
era = 4
home = "argos"
oneliner = "손자에게 죽는다는 말을 듣고 딸을 갇히게 한 아르고스의 왕."
body = """
페르세우스의 외할아버지다.
아들이 없어 신에게 물었더니, 아들은 없고 딸의 아들이 너를 죽인다는 대답이 왔다.
그래서 딸 다나에를 청동 방에 갇히게 했다.
그래도 손자가 태어나자 딸과 아기를 상자에 넣어 바다에 띄웠다.
"""
note = "어디서 물었는지는 원전에 없다 — 아폴로도로스 2.4.1 은 '신탁에', 히기누스 63 은 '예언이 있었다'고만 한다. 델포이라고 적었던 것을 2026-10-02 에 지웠다."
sources = ["apollodorus.library 2.4.1", "hyginus.fabulae 63", "pausanias.greece 2.16.2"]

[[figure]]
id = "danae"
name_ko = "다나에"
name_grc = "Danae"
kind = "human"
era = 4
parents = ["akrisios"]
oneliner = "청동 방에 갇혔던 아르고스의 공주. 페르세우스의 어머니다."
body = """
아버지가 앞일이 무서워 딸을 땅 아래 청동 방에 갇히게 했다.
제우스가 황금 비가 되어 지붕 틈으로 들어왔고, 아들 페르세우스가 태어났다.
아버지는 딸과 아기를 나무 상자에 넣어 바다에 띄웠다.
상자는 세리포스 섬에 닿았고, 어부 딕티스가 건져 주었다.
그 섬에서 아들을 키웠다.
"""
sensitivity = "soften"
record = "제우스가 황금 비가 되어 지붕을 지나 다나에의 무릎에 쏟아져 내려 동침했다(아폴로도로스 2.4.1). 히기누스 63 은 폴리덱테스가 다나에와 결혼했다고 한다 — 아폴로도로스의 '억지로 아내로 삼으려 했다'와 다르다."
sources = ["apollodorus.library 2.4.1-2.4.2", "hyginus.fabulae 63", "ovid.metamorphoses 4.610-4.611"]

[[figure]]
id = "perseus"
name_ko = "페르세우스"
name_grc = "Perseus"
kind = "hero"
era = 4
parents = ["zeus", "danae"]
spouses = ["andromeda"]
home = "mycenae"
oneliner = "메두사의 목을 베어 온 영웅. 신들에게 도구를 빌려 이겼다."
body = """
제우스와 다나에의 아들이다.
섬의 왕이 어머니를 괴롭히려고, 페르세우스에게 메두사의 목을 가져오라는 일을 시켰다.
아테나와 헤르메스가 도구를 빌려 주었고, 페르세우스는 메두사를 이겼다.
돌아오는 길에 바위에 묶인 안드로메다를 구해 아내로 맞았다.
할아버지를 원반으로 죽게 한 뒤 아르고스를 내주고 티린스를 받아 미케네에 성을 쌓았다.
"""
fun = "페르세우스는 헤라클레스보다 앞 세대다. 헤라클레스는 아버지 쪽으로도 어머니 쪽으로도 페르세우스의 증손이다."
sources = ["apollodorus.library 2.4.1-2.4.5", "ovid.metamorphoses 4.604-5.249", "hyginus.fabulae 63-64", "pausanias.greece 2.16.2-2.16.3"]

[[figure]]
id = "diktys"
name_ko = "딕티스"
name_grc = "Diktys"
kind = "human"
era = 4
home = "seriphos"
oneliner = "바다에서 상자를 건져 올린 세리포스의 어부."
body = """
그물에 걸린 나무 상자를 열어 다나에와 아기를 꺼내 주었다.
두 사람을 집에 들여 함께 살게 했다.
왕 폴리덱테스의 동생이다.
페르세우스가 돌아온 뒤 이 섬의 왕이 된다.
"""
sources = ["apollodorus.library 2.4.1-2.4.3"]

[[figure]]
id = "polydektes"
name_ko = "폴리덱테스"
name_grc = "Polydektes"
kind = "human"
era = 4
home = "seriphos"
oneliner = "페르세우스를 메두사에게 보낸 세리포스의 왕."
body = """
다나에를 억지로 아내로 삼으려 했다.
다 자란 아들 페르세우스가 막고 있어서 뜻대로 되지 않았다.
그래서 잔치를 열고, 선물로 메두사의 목을 가져오라고 시켰다.
살아 돌아오지 못할 일이라고 생각한 것이다.
"""
sensitivity = "soften"
sources = ["apollodorus.library 2.4.2"]

[[figure]]
id = "graiai"
name_ko = "그라이아이"
name_grc = "Graiai"
aka = ["세 노파", "그라이아"]
kind = "group"
era = 4
parents = ["phorkys", "keto"]
oneliner = "눈 하나와 이 하나를 셋이 돌려 쓰는 노파 자매."
body = """
고르곤의 언니들이다.
눈알 하나와 이 하나를 셋이서 번갈아 쓴다.
님프들이 사는 곳을 아는 것은 이들뿐이었다.
페르세우스가 돌려 쓰는 눈과 이를 잡아채고서야 길을 알려 주었다.
"""
fun = "이름은 에니오, 펨프레도, 데이노다. 태어날 때부터 노파였다고 아폴로도로스는 적었다."
note = "오비디우스 4.772-4.775 는 자매가 둘이고 아틀라스 산 아래에 산다고 한다 — 사건 graiai-road 의 variants 에."
sources = ["hesiod.theogony 270-273", "apollodorus.library 2.4.2", "ovid.metamorphoses 4.772-4.779"]

[[figure]]
id = "phorkys"
name_ko = "포르키스"
name_grc = "Phorkys"
kind = "primordial"
era = 0
parents = ["pontos", "gaia"]
spouses = ["keto"]
oneliner = "바다의 늙은 신. 고르곤의 아버지다."
body = """
폰토스와 가이아의 아들이다.
누이 케토와 함께 바다의 괴물들을 낳았다.
포세이돈보다 오래된 바다의 신이다.
"""
sources = ["hesiod.theogony 233-239", "hesiod.theogony 270-276"]

[[figure]]
id = "keto"
name_ko = "케토"
name_grc = "Keto"
kind = "primordial"
era = 0
parents = ["pontos", "gaia"]
spouses = ["phorkys"]
oneliner = "바다 괴물들의 어머니."
body = """
이름은 바다 괴물이라는 뜻이다.
고르곤 세 자매와 그라이아이 세 자매를 낳았다.
"""
sources = ["hesiod.theogony 233-239", "hesiod.theogony 270-276"]

[[figure]]
id = "gorgones"
name_ko = "고르곤 세 자매"
name_grc = "Gorgones"
aka = ["고르고", "고르곤"]
kind = "group"
era = 4
parents = ["phorkys", "keto"]
home = "gorgon-land"
oneliner = "머리카락이 뱀인 세 자매. 둘은 죽지 않고 하나만 죽는다."
body = """
스테노, 에우리알레, 메두사 세 자매다.
세상의 서쪽 끝에 산다.
앞의 둘은 죽지 않는 몸이고, 메두사만 죽는 몸이었다.
그래서 페르세우스가 노린 것은 메두사다.
"""
sources = ["hesiod.theogony 274-276", "apollodorus.library 2.4.2"]

[[figure]]
id = "medousa"
name_ko = "메두사"
name_grc = "Medousa"
aka = ["메두샤"]
kind = "monster"
era = 4
parents = ["phorkys", "keto"]
home = "gorgon-land"
oneliner = "눈을 마주친 것을 돌로 만드는 괴물. 고르곤 셋 가운데 죽는 몸이었다."
body = """
본디 머리카락이 가장 고운 아름다운 처녀였다고 오비디우스는 적었다.
아테나의 신전에서 포세이돈이 억지로 붙잡았고, 아테나는 메두사의 머리카락을 뱀으로 바꾸었다.
그 뒤로 눈을 마주치면 사람이든 짐승이든 돌이 된다.
세 자매 가운데 유일하게 죽을 수 있는 몸이었다.
페르세우스는 방패에 비친 모습만 보면서 목을 베었다. 목이 잘린 뒤에도 그 눈은 힘이 남아 있었다.
"""
fun = "잘린 목에서 날개 달린 말 페가수스와 황금 칼을 든 크리사오르가 뛰어나왔다. 둘 다 포세이돈의 자식이다."
sensitivity = "soften"
record = "포세이돈이 아테나의 신전에서 메두사를 겁탈했다. 아테나는 눈을 돌려 방패로 가렸고, 벌을 포세이돈이 아니라 메두사에게 주어 머리카락을 뱀으로 바꾸었다(오비디우스 4.798-4.803). 헤시오도스 278-279 는 '검은 머리의 신이 봄꽃 핀 부드러운 풀밭에서 메두사와 누웠다'고만 한다 — 신전도 벌도 없다. 아폴로도로스 2.4.3 은 메두사가 아테나와 아름다움을 겨루려 해서 아테나 때문에 목이 잘렸다는 이설을 적었다."
note = "괴물이 된 까닭은 사건 medousa-cursed 에서. 돌로 만드는 눈이 뱀 머리와 함께 생겼다는 말은 오비디우스에 없다 — 헤시오도스·아폴로도로스는 고르곤이 본디 그런 존재다."
sources = ["hesiod.theogony 274-286", "apollodorus.library 2.4.2-2.4.3", "ovid.metamorphoses 4.790-4.803"]

[[figure]]
id = "pegasos"
name_ko = "페가수스"
name_grc = "Pegasos"
aka = ["페가소스"]
kind = "monster"
era = 4
parents = ["poseidon", "medousa"]
oneliner = "메두사의 목에서 튀어나온 날개 달린 말."
body = """
메두사의 목이 잘리는 순간 그 자리에서 뛰어나왔다.
날개가 있어 하늘을 달린다.
아무도 태우지 않으려 했지만, 뒤에 벨레로폰이 아테나의 도움으로 올라탄다.
"""
sources = ["hesiod.theogony 280-286", "apollodorus.library 2.3.2"]

[[figure]]
id = "chrysaor"
name_ko = "크리사오르"
name_grc = "Chrysaor"
aka = ["크뤼사오르"]
kind = "monster"
era = 4
parents = ["poseidon", "medousa"]
oneliner = "메두사의 목에서 페가수스와 함께 나온, 황금 칼을 든 이. 게리온의 아버지다."
body = """
메두사의 목이 잘릴 때 페가수스와 함께 뛰어나왔다.
태어날 때부터 손에 황금 칼을 들고 있어서 그 이름이 되었다.
오케아노스의 딸 칼리로에와 만나 몸이 셋인 게리온을 낳았다.
그 게리온을 뒷날 헤라클레스가 이긴다.
"""
fun = "페가수스는 오케아노스의 샘(페가이) 곁에서 태어나 그 이름이고, 크리사오르는 황금(크리소스) 칼(아오르)을 들고 나와 그 이름이다. 헤시오도스가 그렇게 풀었다."
note = "칼리로에는 등록부에 없어 이름만 부른다. kind 는 형제 페가수스와 같이 monster 로 두었다. 메두사 → 크리사오르 → 게리온 → 헤라클레스의 열째 일로 이어지는 줄이다."
sources = ["hesiod.theogony 280-294", "apollodorus.library 2.4.2", "apollodorus.library 2.5.10"]

[[figure]]
id = "andromeda"
name_ko = "안드로메다"
name_grc = "Andromeda"
kind = "human"
era = 4
parents = ["kepheus", "kassiopeia"]
spouses = ["perseus"]
home = "aithiopia"
oneliner = "바다괴물에게 바쳐질 뻔했다가 페르세우스에게 구해진 공주."
body = """
어머니가 한 자랑 때문에 나라에 바다괴물이 왔다.
신의 말을 물으니 공주를 바쳐야 한다고 했다.
안드로메다는 바닷가 바위에 묶였다.
지나가던 페르세우스가 괴물을 물리치고 안드로메다를 아내로 맞았다.
결혼 잔치에 본디 약혼자였던 피네우스가 쳐들어왔지만 돌이 되었다.
"""
fun = "안드로메다, 페르세우스, 케페우스, 카시오페이아는 모두 별자리 이름이 되어 지금도 가을 하늘에 나란히 있다."
sources = ["apollodorus.library 2.4.3-2.4.5", "ovid.metamorphoses 4.663-4.764", "hyginus.fabulae 64"]

[[figure]]
id = "kepheus"
name_ko = "케페우스"
name_grc = "Kepheus"
kind = "human"
era = 4
spouses = ["kassiopeia"]
home = "aithiopia"
oneliner = "안드로메다의 아버지. 딸을 바치라는 말을 들은 왕."
body = """
에티오피아라고 불린 나라의 왕이다.
아내의 자랑 때문에 나라가 벌을 받았다.
딸을 바치는 것 말고는 방법이 없다는 말을 듣고 그대로 했다.
페르세우스가 딸을 구하자 아내로 주었다. 손자 페르세스를 맡아 길렀다.
"""
note = "히기누스 64 는 케페우스도 약혼자와 함께 페르세우스를 죽이려 했다가 돌이 되었다고 한다 — 사건 phineus-turned-to-stone 의 variants 에."
sources = ["apollodorus.library 2.4.3-2.4.5"]

[[figure]]
id = "kassiopeia"
name_ko = "카시오페이아"
name_grc = "Kassiopeia"
kind = "human"
era = 4
spouses = ["kepheus"]
home = "aithiopia"
oneliner = "자기가 바다의 님프들보다 예쁘다고 자랑한 왕비."
body = """
안드로메다의 어머니다.
자기 아름다움이 바다의 님프들보다 낫다고 말했다.
포세이돈이 그 말을 듣고 바다괴물을 보냈다.
그 벌을 대신 받은 것이 딸 안드로메다다.
"""
sources = ["apollodorus.library 2.4.3"]

[[figure]]
id = "ketos"
name_ko = "케토스"
name_grc = "Ketos"
aka = ["바다괴물"]
kind = "monster"
era = 4
home = "aithiopia"
oneliner = "포세이돈이 보낸 바다괴물."
body = """
케페우스의 나라 바닷가에 나타나 사람과 짐승을 물어 갔다.
안드로메다를 먹으러 오는 순간 페르세우스가 나타났다.
페르세우스가 메두사의 목을 보여 돌로 만들었다고도 하고, 칼로 이겼다고도 한다.
"""
note = "케토(Keto)와 이름이 비슷하지만 다른 존재. 원전에서 이 괴물은 이름 없이 kētos(바다괴물)로만 불린다."
sources = ["apollodorus.library 2.4.3", "ovid.metamorphoses 4.689-4.734"]

[[figure]]
id = "phineus-aithiopia"
name_ko = "피네우스"
name_grc = "Phineus"
aka = ["안드로메다의 약혼자", "케페우스의 동생"]
kind = "human"
era = 4
home = "aithiopia"
oneliner = "안드로메다와 결혼하기로 했던 케페우스의 동생. 잔치에 쳐들어왔다가 돌이 되었다."
body = """
케페우스의 동생이고, 안드로메다와 결혼하기로 되어 있었다.
괴물이 왔을 때는 나서지 않았다.
페르세우스가 안드로메다를 구하자 결혼 잔치에 무리를 이끌고 쳐들어왔다.
메두사의 얼굴을 보고, 빌던 모습 그대로 돌이 되었다.
"""
note = "아르고호의 눈먼 점쟁이 피네우스(phineus)와 다른 사람이다 — 오비디우스 5권의 주석도 그렇게 적는다. 히기누스 64 는 약혼자를 아게노르라 부른다."
sources = ["apollodorus.library 2.4.3", "ovid.metamorphoses 5.1-5.235", "hyginus.fabulae 64"]

[[figure]]
id = "megapenthes"
name_ko = "메가펜테스"
name_grc = "Megapenthes"
kind = "human"
era = 4
parents = ["proitos"]
home = "argos"
oneliner = "프로이토스의 아들. 페르세우스와 나라를 바꾸어 아르고스의 왕이 되었다."
body = """
티린스의 왕 프로이토스의 아들이다.
페르세우스가 찾아와 나라를 바꾸자고 하자 그렇게 했다.
아르고스를 받아 다스렸고, 티린스는 페르세우스에게 주었다.
"""
sources = ["apollodorus.library 2.4.4", "pausanias.greece 2.16.3"]

[[figure]]
id = "perses"
name_ko = "페르세스"
name_grc = "Perses"
kind = "human"
era = 4
parents = ["perseus", "andromeda"]
home = "aithiopia"
oneliner = "페르세우스가 에티오피아에 두고 온 맏아들. 페르시아 왕들의 조상이라고 한다."
body = """
페르세우스가 그리스로 돌아가기 전에 태어났다.
페르세우스는 그를 할아버지 케페우스에게 맡기고 떠났다.
페르시아의 왕들이 그의 자손이라는 말이 있다.
"""
fun = "옛 그리스 사람들은 페르시아의 왕들을 페르세우스의 자손으로 여겼다. 아폴로도로스가 그렇게 적었다."
sources = ["apollodorus.library 2.4.5"]

[[figure]]
id = "alkaios"
name_ko = "알카이오스"
name_grc = "Alkaios"
kind = "human"
era = 4
parents = ["perseus", "andromeda"]
home = "mycenae"
oneliner = "페르세우스의 아들. 암피트리온의 아버지다."
body = """
페르세우스와 안드로메다의 아들로 미케네에서 태어났다.
펠롭스의 딸 아스티다메이아와 결혼해 암피트리온과 아낙소를 낳았다.
아낙소는 엘렉트리온의 아내가 되어 알크메네를 낳았다.
그래서 헤라클레스는 아버지 쪽으로도 어머니 쪽으로도 페르세우스의 증손이다.
"""
note = "아스티다메이아(이설 둘 더 있음)·아낙소는 등록부에 없어 이름만 부른다. 알크메네의 parents 는 엘렉트리온만 적혀 있다."
sources = ["apollodorus.library 2.4.5"]

[[figure]]
id = "heleus"
name_ko = "헬레우스"
name_grc = "Heleus"
kind = "human"
era = 4
parents = ["perseus", "andromeda"]
home = "mycenae"
oneliner = "페르세우스의 아들. 뒷날 암피트리온과 함께 타포스 섬을 쳤다."
body = """
페르세우스와 안드로메다의 아들로 미케네에서 태어났다.
암피트리온이 알크메네의 오빠들의 원수를 갚으러 갈 때 함께 갔다.
싸움이 끝난 뒤 그 섬들을 케팔로스와 나누어 받았다.
"""
note = "아르골리스의 헬로스에서 왔다고 2.4.7 이 적는다. 케팔로스는 등록부에 없다."
sources = ["apollodorus.library 2.4.5", "apollodorus.library 2.4.7"]

[[figure]]
id = "mestor"
name_ko = "메스토르"
name_grc = "Mestor"
kind = "human"
era = 4
parents = ["perseus", "andromeda"]
home = "mycenae"
oneliner = "페르세우스의 아들. 그 손자가 알크메네의 오빠들과 싸운 타포스 사람들의 왕이다."
body = """
페르세우스와 안드로메다의 아들로 미케네에서 태어났다.
딸 히포토에를 포세이돈이 데려가 타피오스를 낳았다.
타피오스는 타포스 섬에 자리 잡아 텔레보아이 사람들의 조상이 되었다.
그 자손 프테렐라오스의 아들들이 외할아버지의 나라라며 미케네에 와서 엘렉트리온의 아들들과 서로 죽였다.
"""
sensitivity = "soften"
record = "포세이돈이 히포토에를 에키나데스 섬으로 데려가 동침해 타피오스를 낳았다(아폴로도로스 2.4.5)."
note = "히포토에·타피오스·프테렐라오스는 등록부에 없다. amphitryon-to-thebes 의 '오빠들의 원수'가 이 집안이다(2.4.6)."
sources = ["apollodorus.library 2.4.5-2.4.6"]

[[figure]]
id = "gorgophone"
name_ko = "고르고포네"
name_grc = "Gorgophone"
kind = "human"
era = 4
parents = ["perseus", "andromeda"]
home = "mycenae"
oneliner = "페르세우스의 하나뿐인 딸. 이름이 '고르곤을 죽인 이'라는 뜻이다."
body = """
페르세우스와 안드로메다 사이의 하나뿐인 딸이다.
이름은 아버지가 한 일에서 왔다. 고르곤을 죽인 이라는 뜻이다.
페리에레스와 결혼해 틴다레오스, 이카리오스, 아파레우스, 레우키포스를 낳았다.
틴다레오스는 클리타임네스트라의 아버지이고, 헬레네를 기른 아버지다.
"""
fun = "그래서 아가멤논의 아내 클리타임네스트라는 페르세우스의 증손녀다."
note = "페리에레스·이카리오스·아파레우스·레우키포스는 등록부에 없다. 3.10.3 은 스테시코로스를 따른 계보라고 밝힌다. 틴다레오스의 parents 에 고르고포네를 넣었다."
sources = ["apollodorus.library 2.4.5", "apollodorus.library 3.10.3", "apollodorus.library 1.9.5"]
