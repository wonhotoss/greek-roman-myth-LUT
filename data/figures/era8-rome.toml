# era 8 — 로마가 세워지다. 알바 롱가의 왕들, 로물루스와 레무스, 누마, 그리고 로마 고유의 신들.
# 로마 고유 항목은 로마명이 주 표기다(집필-지침). 그리스 신은 기존 id(ares=마르스, hestia=베스타,
# kronos=사투르누스, hera=유노, zeus=유피테르)를 쓰고 body 에서 로마 이름을 한 줄만 준다.
# 헤라클레스·카쿠스(era 5), 피쿠스·카넨스·파우누스(era 7)도 로마 땅의 이야기라 여기 둔다.
# 주 원전: 리비우스 로마사 1권, 오비디우스 변신 이야기 14~15권, 베르길리우스 아이네이스 1·6·7·8권.

# ---------- 알바 롱가의 왕가 ----------

[[figure]]
id = "silvius"
name_ko = "실비우스"
name_la = "Silvius"
aka = ["실비우스 왕", "숲의 아이"]
kind = "human"
era = 8
parents = ["askanios"]
home = "alba-longa"
oneliner = "숲에서 태어난 알바 롱가의 두 번째 왕."
body = """
숲에서 태어나서 실비우스라는 이름을 얻었다.
실비우스는 '숲'이라는 라틴말에서 온 이름이다.
아스카니오스 다음으로 알바 롱가의 왕이 되었다.
그 뒤 알바의 왕들은 모두 이름 뒤에 실비우스를 붙였다.
로물루스의 먼 할아버지다.
"""
note = "리비우스 1.3 은 아스카니오스의 아들이라 하고, 아이네이스 6.763-766 은 아이네이아스가 죽은 뒤 라비니아가 숲에서 낳은 아들이라 한다. 주 계보는 리비우스, 이설은 parents_variant."
sources = ["livy.rome 1.3", "ovid.metamorphoses 14.609-611", "virgil.aeneid 6.760-766"]

[[figure.parents_variant]]
source = "virgil.aeneid 6.760-766"
parents = ["aineias", "lavinia"]
text = "베르길리우스는 실비우스를 아이네이아스가 죽은 뒤 라비니아가 숲에서 낳은 아들이라고 한다. 리비우스는 아스카니오스의 아들이라고 한다."

[[figure]]
id = "procas"
name_ko = "프로카스"
name_la = "Procas"
aka = ["프로카"]
kind = "human"
era = 8
home = "alba-longa"
oneliner = "누미토르와 아물리우스의 아버지. 알바 롱가의 왕이었다."
body = """
실비우스 집안의 왕으로 알바 롱가를 다스렸다.
아들이 둘이었다. 누미토르와 아물리우스다.
죽을 때 맏아들 누미토르에게 나라를 남겼다.
그런데 작은아들이 아버지의 뜻을 따르지 않았다.
"""
sources = ["livy.rome 1.3", "ovid.metamorphoses 14.622", "virgil.aeneid 6.767"]

[[figure]]
id = "numitor"
name_ko = "누미토르"
name_la = "Numitor"
kind = "human"
era = 8
parents = ["procas"]
home = "alba-longa"
oneliner = "동생에게 나라를 빼앗겼다가 손자들 덕에 되찾은 알바의 왕."
body = """
프로카스의 맏아들로 알바 롱가의 왕이 되었다.
동생 아물리우스가 힘으로 그 자리를 빼앗았다.
오랜 뒤 붙잡혀 온 젊은 목동을 보고 손자가 아닐까 생각했다.
로물루스와 레무스가 아물리우스를 죽이자 다시 왕이 되었다.
"""
sources = ["livy.rome 1.3", "livy.rome 1.5-1.6", "ovid.metamorphoses 14.772-774"]

[[figure]]
id = "amulius"
name_ko = "아물리우스"
name_la = "Amulius"
kind = "human"
era = 8
parents = ["procas"]
home = "alba-longa"
oneliner = "형의 자리를 빼앗고 쌍둥이를 강에 버리게 한 왕."
body = """
형 누미토르를 쫓아내고 알바 롱가의 왕이 되었다.
형의 아들들을 죽이고, 형의 딸은 베스타의 처녀로 만들었다.
베스타의 처녀는 결혼할 수 없었다.
그래서 형의 자손이 생기지 않을 것이라고 여겼다.
그런데 쌍둥이가 태어났고, 그 쌍둥이가 자라서 아물리우스를 죽였다.
"""
sensitivity = "soften"
sources = ["livy.rome 1.3-1.5", "ovid.metamorphoses 14.772-774"]

[[figure]]
id = "rhea-silvia"
name_ko = "레아 실비아"
name_la = "Rhea Silvia"
aka = ["일리아", "레아 실비아"]
kind = "human"
era = 8
parents = ["numitor"]
home = "alba-longa"
oneliner = "로물루스와 레무스를 낳은 베스타의 처녀."
body = """
누미토르의 딸이다.
작은아버지 아물리우스가 억지로 베스타의 처녀로 만들었다.
그런데 쌍둥이를 낳았고, 아버지는 아레스라고 말했다.
아물리우스는 레아 실비아를 감옥에 가두었다.
베르길리우스는 이 사람을 일리아라고 부른다.
"""
sensitivity = "soften"
sources = ["livy.rome 1.3-1.4", "virgil.aeneid 1.273-274", "ovid.metamorphoses 14.781"]

# ---------- 로물루스와 레무스 ----------

[[figure]]
id = "romulus"
name_ko = "로물루스"
name_la = "Romulus"
aka = ["퀴리누스", "로물로스"]
kind = "hero"
era = 8
parents = ["ares", "rhea-silvia"]
spouses = ["hersilia"]
home = "rome"
oneliner = "암늑대가 키운 쌍둥이. 로마를 세우고 첫 왕이 되었다."
body = """
태어나자마자 티베리스 강에 버려졌고, 암늑대가 젖을 먹여 살렸다.
목동으로 자라서 할아버지 누미토르의 나라를 되찾아 주었다.
팔라티노 언덕에 로마를 세우고 자기 이름을 붙였다.
다투다가 동생 레무스를 죽였다.
뒷날 폭풍 속에서 사라졌고, 로마 사람들은 퀴리누스라는 신으로 모셨다.
"""
fun = "로마라는 이름이 로물루스에서 왔다. 사람 이름이 먼저고 도시 이름이 나중이다."
sensitivity = "soften"
sources = ["livy.rome 1.4-1.16", "ovid.metamorphoses 14.772-828", "virgil.aeneid 1.274-277"]

[[figure]]
id = "remus"
name_ko = "레무스"
name_la = "Remus"
kind = "hero"
era = 8
parents = ["ares", "rhea-silvia"]
home = "rome"
oneliner = "로물루스의 쌍둥이 형제. 새 도시의 담 앞에서 죽었다."
body = """
로물루스와 함께 버려지고 함께 자랐다.
도둑들에게 잡혀 누미토르 앞에 끌려갔다.
그 덕에 할아버지가 손자들을 알아보았다.
새를 보고 왕을 정할 때 독수리 여섯을 먼저 보았다.
형이 열둘을 보아 다툼이 났고, 레무스는 그 다툼 끝에 죽었다.
"""
fun = "베르길리우스는 뒷날 레무스가 퀴리누스와 함께 법을 줄 것이라 적었다. 죽은 동생과 형이 다시 나란히 서는 그림이다."
sensitivity = "soften"
sources = ["livy.rome 1.4-1.7", "virgil.aeneid 1.292-293"]

[[figure]]
id = "faustulus"
name_ko = "파우스툴루스"
name_la = "Faustulus"
kind = "human"
era = 8
spouses = ["acca-larentia"]
home = "rome"
oneliner = "강가에서 쌍둥이를 발견해 집으로 데려간 왕의 목동."
body = """
아물리우스 왕의 가축을 돌보는 목동이었다.
암늑대가 아기들을 핥고 있는 것을 보고 집으로 데려왔다.
아내 라렌티아와 함께 두 아이를 키웠다.
아이들이 왕의 손자일 거라고 짐작했지만 오래 말하지 않았다.
레무스가 잡혀가자 로물루스에게 모든 것을 말했다.
"""
sources = ["livy.rome 1.4-1.5"]

[[figure]]
id = "acca-larentia"
name_ko = "라렌티아"
name_la = "Larentia"
aka = ["아카 라렌티아", "라우렌티아", "루파"]
kind = "human"
era = 8
spouses = ["faustulus"]
home = "rome"
oneliner = "버려진 쌍둥이를 젖 먹여 키운 목동의 아내."
body = """
파우스툴루스가 데려온 두 아기를 자기 아이처럼 키웠다.
로물루스와 레무스는 이 집에서 목동으로 자랐다.
목동들은 라렌티아를 '암늑대'라는 별명으로 불렀다고도 한다.
그래서 암늑대 이야기가 생겼다고 리비우스는 덧붙였다.
"""
note = "리비우스는 Laurentia 라고만 쓴다. 널리 알려진 '아카 라렌티아'는 다른 원전(파스티 등, 우리 코퍼스에 없음)의 이름이라 aka 에만 둔다. id 는 등록부대로."
sources = ["livy.rome 1.4"]

[[figure]]
id = "hersilia"
name_ko = "헤르실리아"
name_la = "Hersilia"
aka = ["호라", "오라"]
kind = "human"
era = 8
spouses = ["romulus"]
home = "rome"
oneliner = "로물루스의 아내. 남편을 따라 신이 되었다."
body = """
로물루스의 아내다.
여인들을 대신해 그 아버지들을 로마 시민으로 받아 달라고 청했다.
로물루스가 사라진 뒤 울고 있을 때 헤라가 이리스를 보냈다.
퀴리누스의 언덕에서 별이 떨어져 헤르실리아를 하늘로 데려갔다.
그 뒤로 호라라는 이름의 신이 되었다.
"""
sources = ["livy.rome 1.11", "ovid.metamorphoses 14.829-851"]

# ---------- 사비니 ----------

[[figure]]
id = "titus-tatius"
name_ko = "티투스 타티우스"
name_la = "Titus Tatius"
aka = ["타티우스"]
kind = "human"
era = 8
home = "cures"
oneliner = "로마와 싸운 사비니의 왕. 뒤에 로물루스와 함께 다스렸다."
body = """
사비니 사람들의 왕이었다.
로마가 사비니 여인들을 억지로 데려가자 군대를 이끌고 왔다.
타르페이아에게 금을 약속해 성채의 문을 열게 했다.
여인들이 싸움을 멈추자 로물루스와 함께 로마의 왕이 되었다.
몇 해 뒤 라비니움에서 소란 속에 죽었다.
"""
sensitivity = "soften"
sources = ["livy.rome 1.10-1.14", "ovid.metamorphoses 14.775-804"]

[[figure]]
id = "tarpeia"
name_ko = "타르페이아"
name_la = "Tarpeia"
kind = "human"
era = 8
home = "rome"
oneliner = "금을 받으려고 사비니 군대에 성채의 문을 열어 준 처녀."
body = """
아버지 타르페이우스가 로마의 성채를 지키고 있었다.
타티우스가 금을 준다고 하자 사비니 군사들을 성 안에 들였다.
군사들은 약속과 다르게 방패를 던져 타르페이아를 덮었다.
타르페이아는 그 아래에서 죽었다.
"""
fun = "카피톨리노 언덕의 한쪽 바위는 그 뒤로 '타르페이아의 바위'라고 불렸다."
sensitivity = "soften"
sources = ["livy.rome 1.11", "ovid.metamorphoses 14.776-777", "virgil.aeneid 8.347"]

[[figure]]
id = "sabinae"
name_ko = "사비니의 여인들"
name_la = "Sabinae"
aka = ["사비니 여인들", "사비니 여자들", "사비니 처녀들"]
kind = "group"
era = 8
home = "rome"
oneliner = "로마로 억지로 끌려왔다가, 아버지와 남편의 싸움을 멈춘 여인들."
body = """
로마의 축제에 왔을 때 로마 젊은이들이 여인들을 붙잡아 갔다.
여인들의 아버지들이 전쟁을 일으켰다.
두 군대가 언덕 사이 골짜기에서 싸울 때 여인들이 그 사이로 뛰어들었다.
아버지와 남편이 서로 죽이는 것을 볼 수 없다고 했다.
싸움이 멈추고 두 민족이 하나가 되었다.
"""
fun = "로물루스는 로마 사람들을 서른 무리로 나누었다. 무리마다 이 여인들의 이름을 붙였다."
sensitivity = "soften"
sources = ["livy.rome 1.9-1.13", "ovid.metamorphoses 14.775-804", "virgil.aeneid 8.635-641"]

[[figure]]
id = "proculus-iulius"
name_ko = "프로쿨루스 율리우스"
name_la = "Proculus Iulius"
aka = ["율리우스 프로쿨루스", "프로쿨루스"]
kind = "human"
era = 8
home = "rome"
oneliner = "사라진 로물루스가 자기 앞에 나타났다고 말한 사람."
body = """
로물루스가 사라진 뒤 사람들이 슬퍼하고 원로원을 의심했다.
그때 프로쿨루스 율리우스가 앞에 나서서 말했다.
새벽에 로물루스가 하늘에서 내려와 자기에게 말을 했다고 했다.
로마가 세상의 머리가 될 것이니 전쟁의 기술을 익히라는 말이었다.
사람들은 그 말을 믿었고, 왕을 잃은 슬픔이 가라앉았다.
"""
sources = ["livy.rome 1.16"]

# ---------- 누마 ----------

[[figure]]
id = "numa"
name_ko = "누마"
name_la = "Numa Pompilius"
aka = ["누마 폼필리우스", "누마 왕"]
kind = "human"
era = 8
spouses = ["egeria"]
home = "cures"
oneliner = "싸움 대신 신을 섬기는 법을 가르친 로마의 두 번째 왕."
body = """
사비니의 도시 쿠레스에 살았고, 바르고 신을 잘 아는 사람으로 이름났다.
로물루스가 사라진 뒤 로마 사람들이 누마를 왕으로 불러왔다.
야누스의 신전을 세우고, 한 해를 열두 달로 나누었다.
신을 섬기는 사제들을 정하고 베스타의 처녀들을 두었다.
다스린 마흔세 해 동안 한 번도 전쟁을 하지 않았다.
"""
fun = "누마가 다스리는 동안 야누스 신전의 문은 닫혀 있었다. 그 뒤 리비우스 때까지 이 문이 닫힌 것은 두 번뿐이다."
sources = ["livy.rome 1.18-1.21", "ovid.metamorphoses 15.1-4", "ovid.metamorphoses 15.479-484", "virgil.aeneid 6.808-812"]

[[figure]]
id = "egeria"
name_ko = "에게리아"
name_la = "Egeria"
kind = "nymph"
era = 8
spouses = ["numa"]
oneliner = "밤마다 누마를 만나 신들을 섬기는 법을 알려 준 님프."
body = """
누마의 아내다.
누마는 밤마다 숲의 샘에서 에게리아를 만나 신들의 뜻을 배운다고 말했다.
리비우스는 사람들이 왕의 말을 따르게 하려고 꾸민 말이라고 적었다.
누마가 죽자 아리키아의 숲에 숨어 울었다.
아르테미스가 우는 에게리아를 샘으로 바꾸었다.
"""
sources = ["livy.rome 1.19", "livy.rome 1.21", "ovid.metamorphoses 15.482-551"]

# ---------- 로마 고유의 신들 ----------

[[figure]]
id = "ianus"
name_ko = "야누스"
name_la = "Ianus"
aka = ["이아누스", "야누스 신", "Janus"]
kind = "god"
era = 8
domains = ["문", "시작과 끝"]
symbols = ["두 얼굴", "열쇠"]
home = "rome"
oneliner = "앞뒤로 얼굴이 둘 있는 문의 신. 로마에만 있는 신이다."
body = """
얼굴이 둘이어서 앞과 뒤를 한 번에 본다.
문과 시작을 맡은 신이며, 그리스에는 이런 신이 없다.
누마 왕이 세운 야누스 신전은 전쟁 때 문을 열고 평화 때 닫았다.
사비니 군대가 들어오려 할 때 야누스 곁의 샘이 뜨거워져 길을 막았다.
노래하는 님프 카넨스가 야누스의 딸이다.
"""
fun = "베르길리우스는 야누스를 열쇠 다발을 든 문지기로 그렸다. 로마의 한 언덕 야니쿨룸도 야누스에서 온 이름이다."
sources = ["livy.rome 1.19", "ovid.metamorphoses 14.334", "ovid.metamorphoses 14.785-795", "virgil.aeneid 7.180", "virgil.aeneid 7.607-615", "virgil.aeneid 8.357-358"]

[[figure]]
id = "faunus"
name_ko = "파우누스"
name_la = "Faunus"
kind = "god"
era = 7
parents = ["picus"]
domains = ["숲", "들", "앞일을 알려 주는 말"]
oneliner = "라티움의 숲과 들을 지키는 신. 라티누스 왕의 아버지다."
body = """
라티움의 숲과 들을 지키는 신이다.
피쿠스의 아들이고, 라티누스 왕의 아버지다.
어려운 일이 생기면 사람들은 파우누스의 숲에 와서 잠을 잤다.
그러면 꿈으로 앞일을 알려 주는 말을 들었다.
라티누스도 딸 라비니아의 남편을 누구로 할지 이렇게 물었다.
"""
fun = "라티누스에게 온 대답은 '낯선 땅에서 온 사람이 사위가 된다'였다. 그 사람이 아이네이아스다."
sources = ["virgil.aeneid 7.45-49", "virgil.aeneid 7.81-106", "virgil.aeneid 12.766-779"]

[[figure]]
id = "picus"
name_ko = "피쿠스"
name_la = "Picus"
kind = "human"
era = 7
parents = ["kronos"]
spouses = ["kanens"]
oneliner = "키르케가 딱따구리로 바꾸어 버린 라티움의 젊은 왕."
body = """
크로노스(로마에서는 사투르누스)의 아들로 라티움의 왕이었다.
말을 잘 다루었고, 님프들이 모두 좋아할 만큼 잘생겼다.
노래하는 님프 카넨스만을 아내로 사랑했다.
키르케가 사랑을 고백했지만 거절했다.
화가 난 키르케가 피쿠스를 딱따구리로 바꾸었다.
"""
fun = "피쿠스는 라틴말로 딱따구리다. 자주색 옷은 깃털 빛깔이 되고, 금 브로치는 목의 금빛 털이 되었다."
sources = ["ovid.metamorphoses 14.320-396", "virgil.aeneid 7.48-49", "virgil.aeneid 7.187-191"]

[[figure]]
id = "kanens"
name_ko = "카넨스"
name_la = "Canens"
kind = "nymph"
era = 7
parents = ["ianus"]
spouses = ["picus"]
oneliner = "노래로 바위와 짐승을 움직이던 님프. 남편을 잃고 울다가 사라졌다."
body = """
야누스와 베닐리아의 딸로 팔라티노 언덕에서 태어났다.
노래를 하면 숲과 바위가 움직이고, 짐승이 조용해지고, 강이 멈추었다.
그래서 '노래하는 이'라는 뜻의 카넨스라고 불렸다.
남편 피쿠스가 사라지자 엿새 밤낮을 먹지도 자지도 않고 찾아다녔다.
티베리스 강가에서 울다가 몸이 녹아 공기 속으로 사라졌다.
"""
sources = ["ovid.metamorphoses 14.333-434"]

[[figure]]
id = "pomona"
name_ko = "포모나"
name_la = "Pomona"
kind = "nymph"
era = 8
spouses = ["vertumnus"]
oneliner = "과일나무를 돌보는 님프. 정원 담 안에만 있었다."
body = """
라티움의 님프들 가운데 과일나무를 가장 잘 돌보았다.
숲도 강도 아니고 열매가 익는 나무들을 사랑했다.
가지를 치고, 접을 붙이고, 뿌리에 물을 주었다.
남자들이 다가오는 것이 싫어 정원에 담을 치고 살았다.
베르툼누스가 여러 모습으로 바꾸어 찾아왔다.
"""
fun = "포모나라는 이름은 라틴말로 열매(포뭄)에서 왔다."
note = "참고: 처음 읽는 그리스 로마 신화 10권 1장 「베르툼누스와 포모나」"
sources = ["ovid.metamorphoses 14.623-697", "ovid.metamorphoses 14.765-771"]

[[figure]]
id = "vertumnus"
name_ko = "베르툼누스"
name_la = "Vertumnus"
aka = ["베르툼누스 신"]
kind = "god"
era = 8
spouses = ["pomona"]
domains = ["모습 바꾸기", "과일과 정원"]
oneliner = "무엇으로든 모습을 바꿀 수 있는 신. 포모나를 사랑했다."
body = """
모습을 마음대로 바꾸는 신이다.
포모나를 보려고 농부, 군인, 낚시꾼으로 변해 정원에 들어갔다.
마지막에는 할머니로 변해 포모나 옆에 앉아 결혼을 권했다.
젊은 모습으로 돌아왔을 때 포모나도 베르툼누스를 사랑하게 되었다.
"""
fun = "할머니가 된 베르툼누스가 들려준 것이 아낙사레테 이야기다. 사랑을 거절한 아낙사레테는 창가에서 돌이 되었다."
note = "참고: 처음 읽는 그리스 로마 신화 10권 1장 「베르툼누스와 포모나」"
sources = ["ovid.metamorphoses 14.641-771"]

# ---------- 로마 땅의 옛 이야기 (era 5) ----------

[[figure]]
id = "kakos"
name_ko = "카쿠스"
name_grc = "Kakos"
name_la = "Cacus"
kind = "monster"
era = 5
parents = ["hephaistos"]
home = "rome"
oneliner = "불을 뿜는 도둑. 헤라클레스의 소를 훔쳤다."
body = """
티베리스 강가 언덕의 굴에 살았다.
헤파이스토스의 아들로, 입에서 검은 연기와 불을 뿜었다.
로마에서는 헤파이스토스를 불카누스라고 불렀다.
헤라클레스가 잠든 사이 소들의 꼬리를 잡아 뒤로 끌어 굴에 숨겼다.
소들이 우는 소리 때문에 들켜서 헤라클레스에게 죽었다.
"""
note = "리비우스 1.7 은 카쿠스를 괴물이 아니라 힘센 목동이라고 한다. 사건 herakles-and-kakos 의 variants 에 적었다."
sources = ["virgil.aeneid 8.185-267", "livy.rome 1.7"]
