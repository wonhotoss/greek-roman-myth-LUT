sources = ["apollodorus.library 3.13.6-3.13.8", "homer.iliad 1.318-348", "homer.iliad 9.410-416", "homer.iliad 22.131-404", "apollodorus.library E.5.3", "ovid.metamorphoses 12.580-628"]

