oneliner = "큰 아이아스의 아버지인 살라미스의 왕."
body = """
펠레우스의 형제로, 함께 아이기나 섬에서 쫓겨났다.
살라미스로 가서 그곳의 왕이 되었다.
헤라클레스가 트로이로 갈 때 함께 가서 라오메돈을 이겼다.
그 상으로 라오메돈의 딸 헤시오네를 얻었고, 테우크로스가 태어났다.
아들 아이아스는 헤라클레스가 기도해 준 뒤 태어났다.
"""
fun = "기도 뒤에 독수리가 나타나서 아들 이름을 아이아스라고 지었다. 그리스말로 독수리가 아이에토스다."
note = "부모 아이아코스는 등록부에 없어 비운다. 아르고호(THE argo-departs)와 헤라클레스의 트로이 원정(HER herakles-sacks-troy)은 참조만."
sources = ["apollodorus.library 3.12.6-3.12.7"]

[[figure]]
id = "idomeneus"
name_ko = "이도메네우스"
name_grc = "Idomeneus"
kind = "hero"
era = 6
home = "crete"
oneliner = "크레타에서 배 마흔 척을 이끌고 온 왕."
body = """
미노스의 손자로 크레타의 왕이었다.
크레타에서 배 마흔 척을 이끌고 트로이에 왔다.
머리가 반쯤 희었지만 앞장서서 싸웠다.
그리스군이 밀릴 때 트로이 장수들을 여럿 죽였다.
전쟁이 끝나고 무사히 크레타로 돌아갔다.
"""
note = "아버지 데우칼리온(미노스의 아들)은 홍수의 데우칼리온(deukalion)과 다른 사람이다. parents 를 비운다."
sources = ["apollodorus.library E.3.13", "homer.iliad 2.645-652", "homer.iliad 13.210-539", "homer.odyssey 3.191-192"]

[[figure]]
id = "philoktetes"
name_ko = "필록테테스"
name_grc = "Philoktetes"
aka = ["필로크테테스"]
kind = "hero"
era = 6
oneliner = "헤라클레스의 활을 들고 렘노스에 홀로 남겨진 궁수."
body = """
헤라클레스의 활과 화살을 가지고 있었다.
트로이로 가는 길에 물뱀에 물렸고, 상처가 아물지 않았다.
냄새가 심해 오디세우스가 그를 렘노스 섬에 두고 떠났다.
아홉 해 뒤, 그 활이 없으면 트로이를 못 얻는다는 말이 나왔다.
오디세우스와 디오메데스가 데려왔고, 필록테테스가 파리스를 화살로 죽였다.
"""
fun = "헤라클레스는 죽을 때 자기 장작에 불을 붙여 준 포이아스에게 그 활을 주었다. 포이아스가 필록테테스의 아버지다."
sources = ["apollodorus.library 3.10.8", "apollodorus.library E.3.14", "apollodorus.library E.3.27", "apollodorus.library E.5.8", "apollodorus.library 2.7.7", "homer.iliad 2.716-728", "hyginus.fabulae 102"]

[[figure]]
id = "kalchas"
name_ko = "칼카스"
name_grc = "Kalchas"
kind = "human"
era = 6
oneliner = "새를 보고 앞일을 읽은 그리스군의 예언자."
body = """
새가 나는 것을 보고 앞일을 읽는 사람이었다.
아울리스에서 뱀이 참새 아홉 마리를 잡아먹는 것을 보고 말했다.
트로이는 열 해째에 무너진다는 것이었다.
바람이 멎었을 때는 아가멤논의 딸을 바쳐야 한다고 했다.
역병 때도, 전쟁 끝에도 그리스군은 칼카스의 말을 따랐다.
"""
fun = "칼카스는 자기보다 뛰어난 예언자를 만나면 죽는다는 말을 들었다. 전쟁 뒤 몹소스에게 지고 죽었다."
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장 「칼카스의 예언」"
sources = ["apollodorus.library E.3.15", "apollodorus.library E.3.21", "apollodorus.library E.5.8-E.5.9", "homer.iliad 1.68-100", "homer.iliad 2.299-332", "apollodorus.library E.6.2-E.6.4"]

[[figure]]
id = "protesilaos"
name_ko = "프로테실라오스"
name_grc = "Protesilaos"
kind = "hero"
era = 6
oneliner = "트로이 땅에 맨 먼저 발을 디뎠다가 맨 먼저 죽은 그리스 사람."
body = """
필라케에서 배 마흔 척을 이끌고 왔다.
맨 먼저 땅에 내리는 사람이 맨 먼저 죽는다는 말이 있었다.
프로테실라오스가 맨 먼저 배에서 뛰어내렸다.
트로이 사람 여럿을 죽인 뒤 헥토르의 손에 죽었다.
새로 지은 집과 아내를 고향에 두고 온 뒤였다.
"""
fun = "그의 배는 그 뒤로 열 해 동안 트로이 해변에 남았다. 헥토르가 배들에 불을 놓을 때 맨 먼저 불붙은 배가 이 배다."
sources = ["apollodorus.library 3.10.8", "apollodorus.library E.3.14", "apollodorus.library E.3.29-E.3.30", "homer.iliad 2.695-710", "homer.iliad 15.704-706", "hyginus.fabulae 103"]

