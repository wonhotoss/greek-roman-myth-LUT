sources = ["hesiod.theogony 240-264", "hesiod.theogony 1006-1007", "apollodorus.library 3.13.5-3.13.8", "homer.iliad 1.493-530", "homer.iliad 18.369-617", "homer.iliad 24.59-63"]

[[figure]]
