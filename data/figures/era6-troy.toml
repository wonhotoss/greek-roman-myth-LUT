note = "'펠레우스와 테티스의 결혼 잔치에 초대받지 못했다'는 세부는 히기누스 92 — peleus-thetis-wedding 의 variants 에 넣었다. E.3.2 는 사과를 던진 것만 말한다."
sources = ["hesiod.theogony 225-232", "hesiod.works 11-26", "apollodorus.library E.3.2", "homer.iliad 4.440-445", "homer.iliad 11.3-14", "hyginus.fabulae 92"]
