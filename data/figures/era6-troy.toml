# era 6 — 트로이 전쟁. 그 뿌리인 탄탈로스 가문(era 4~5), 트로이 왕가, 레다와 헬레네, 펠레우스와 테티스도 여기 둔다.
# 다른 에이전트 소유라 참조만 하는 id: laertes, antikleia, penelope, ithake, pylos(ODY) · lemnos, kastor, polydeukes, mt-pelion(THE) · herakles, cheiron(HER) · lykia(ATH)
# 히기누스 전문은 2026-09-03 에 들어왔다. 92(파리스의 심판)는 에리스 항목에 더했다.

# ---------- 탄탈로스 가문 ----------

[[figure]]
id = "tantalos"
name_ko = "탄탈로스"
name_grc = "Tantalos"
aka = ["탄탈루스"]
kind = "human"
era = 4
parents = ["zeus"]
oneliner = "신들을 속인 벌로 저승에서 영원히 굶고 목마른 왕."
body = """
제우스의 아들로, 신들과 한 식탁에서 먹을 만큼 가까웠다.
그런데 신들의 비밀을 사람들에게 떠들었다.
신들의 음식 암브로시아를 몰래 훔쳐 사람들에게 나누어 주었다.
신들을 시험하려고 해서는 안 될 끔찍한 음식도 내놓았다.
그 벌로 저승에서 물과 열매를 눈앞에 두고도 먹지 못한다.
"""
fun = "오디세우스가 저승에서 탄탈로스를 직접 보았다. 그 옆에서는 시시포스가 바위를 밀고 있었다."
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 4권 3장 「영원한 굶주림의 벌」. 펠롭스 잔치의 식인 상세는 쓰지 않는다."
sources = ["apollodorus.library E.2.1", "apollodorus.library E.2.3", "homer.odyssey 11.582-592", "hyginus.fabulae 155"]

[[figure]]
id = "pelops"
name_ko = "펠롭스"
name_grc = "Pelops"
kind = "human"
era = 4
parents = ["tantalos"]
spouses = ["hippodameia"]
home = "pisa"
oneliner = "전차 경주로 아내와 나라를 얻은 탄탈로스의 아들."
body = """
아버지의 잔치에서 죽었는데, 신들이 다시 살려 냈다.
살아난 뒤 전보다 더 아름다워져 포세이돈이 아꼈다.
포세이돈은 바다 위를 달려도 축이 젖지 않는 날개 달린 전차를 주었다.
그 전차로 오이노마오스와 경주해 이기고 히포다메이아를 아내로 맞았다.
피사의 왕이 되었고, 다스린 땅 전체를 펠로폰네소스라 불렀다.
"""
fun = "펠롭스의 한쪽 어깨는 상아였다. 다시 살아날 때 신들이 그 자리를 상아로 채웠다고 오비디우스가 적었다."
sensitivity = "soften"
sources = ["apollodorus.library E.2.3-E.2.9", "ovid.metamorphoses 6.401-411", "pausanias.greece 5.10"]

[[figure]]
id = "hippodameia"
name_ko = "히포다메이아"
name_grc = "Hippodameia"
kind = "human"
era = 4
parents = ["oinomaos"]
spouses = ["pelops"]
home = "pisa"
oneliner = "전차 경주의 상으로 걸린 피사의 공주."
body = """
아버지 오이노마오스는 딸에게 구혼하는 사람과 전차 경주를 했다.
져서 잡힌 사람은 죽였고, 그런 사람이 열둘이 넘었다.
히포다메이아는 펠롭스를 보고 마음에 들어 그를 돕기로 했다.
아버지의 마부 미르틸로스를 설득해 펠롭스 편에 서게 했다.
경주가 끝나자 펠롭스의 아내가 되었다.
"""
sources = ["apollodorus.library E.2.4-E.2.8", "pausanias.greece 5.11"]

[[figure]]
id = "oinomaos"
name_ko = "오이노마오스"
name_grc = "Oinomaos"
kind = "human"
era = 4
home = "pisa"
oneliner = "딸의 구혼자들과 전차 경주를 해서 죽인 피사의 왕."
body = """
딸과 결혼한 사람이 자기를 죽인다는 말을 들었다고 한다.
그래서 구혼자에게 딸을 전차에 태우고 달아나게 했다.
자기는 아레스가 준 갑옷과 말로 뒤쫓아, 따라잡으면 죽였다.
마부 미르틸로스가 바퀴의 쐐기를 빼 두어 경주에서 졌다.
전차에서 떨어져 죽으면서 미르틸로스를 저주했다.
"""
sources = ["apollodorus.library E.2.4-E.2.7", "pausanias.greece 5.1"]

[[figure]]
id = "myrtilos"
name_ko = "미르틸로스"
name_grc = "Myrtilos"
kind = "human"
era = 4
parents = ["hermes"]
home = "pisa"
oneliner = "주인의 전차 바퀴에서 쐐기를 뺀 마부."
body = """
헤르메스의 아들로, 오이노마오스의 전차를 몰았다.
히포다메이아의 부탁을 받고 바퀴에 쐐기를 끼우지 않았다.
경주 중에 바퀴가 빠져 오이노마오스가 죽었다.
그 뒤 펠롭스와 길을 가다 히포다메이아에게 못된 짓을 하려 했다.
펠롭스는 그를 바다에 던졌고, 그는 떨어지면서 펠롭스의 집안을 저주했다.
"""
fun = "그가 떨어진 바다를 지금도 미르토스 해라고 부른다."
sensitivity = "soften"
sources = ["apollodorus.library E.2.6-E.2.8", "pausanias.greece 5.10"]

[[figure]]
id = "atreus"
name_ko = "아트레우스"
name_grc = "Atreus"
kind = "human"
era = 5
parents = ["pelops"]
home = "mycenae"
oneliner = "동생과 왕자리를 다툰 미케네의 왕, 아가멤논의 아버지."
body = """
미케네 사람들은 펠롭스의 아들을 왕으로 뽑으라는 신의 말을 들었다.
아트레우스와 동생 티에스테스가 왕자리를 두고 다투었다.
황금 양을 가진 쪽이 왕이 되자고 했는데, 양은 티에스테스 손에 있었다.
제우스가 해를 동쪽으로 지게 해서 아트레우스 편을 들어 주었다.
아트레우스는 왕이 되었고 동생을 쫓아냈다.
"""
fun = "이 집안의 지팡이는 헤르메스가 펠롭스에게 준 것이다. 아트레우스를 거쳐 아가멤논까지 내려갔다."
sensitivity = "soften"
note = "티에스테스의 잔치(E.2.13)는 쓰지 않는다."
sources = ["apollodorus.library E.2.10-E.2.12", "homer.iliad 2.100-108"]

[[figure]]
id = "thyestes"
name_ko = "티에스테스"
name_grc = "Thyestes"
kind = "human"
era = 5
parents = ["pelops"]
oneliner = "형 아트레우스와 미케네를 다투다 쫓겨난 동생."
body = """
형 아트레우스와 미케네의 왕자리를 다투었다.
황금 양을 내보여 왕이 되었지만, 해가 거꾸로 지자 자리를 잃었다.
형은 그를 나라에서 쫓아냈다.
두 형제는 그 뒤로도 서로에게 끔찍한 일을 저질렀다.
뒷날 아들 아이기스토스가 아트레우스를 죽이고 아버지를 왕으로 세웠다.
"""
sensitivity = "soften"
note = "잔치(E.2.13)와 아이기스토스의 출생(E.2.14)은 쓰지 않는다. 아이기스토스는 ODY 소유 인물이라 이름만 부른다."
sources = ["apollodorus.library E.2.10-E.2.14"]

[[figure]]
id = "agamemnon"
name_ko = "아가멤논"
name_grc = "Agamemnon"
kind = "human"
era = 6
parents = ["atreus"]
spouses = ["klytaimnestra"]
home = "mycenae"
oneliner = "트로이로 간 그리스 군대 전체를 이끈 미케네의 왕."
body = """
동생 메넬라오스의 아내 헬레네를 되찾으러 그리스의 왕들을 모았다.
가장 많은 배, 백 척을 이끌고 왔고 군대 전체를 지휘했다.
아울리스에서는 바람을 얻으려고 딸 이피게네이아를 내놓아야 했다.
트로이에서는 아킬레우스와 크게 다투어 군대를 위험에 빠뜨렸다.
전쟁이 끝나고 집에 돌아간 뒤의 이야기는 따로 있다.
"""
fun = "아가멤논은 지팡이 하나로 왕들을 다스렸다. 그 지팡이는 헤파이스토스가 만들어 제우스에게 준 것이다."
sensitivity = "soften"
note = "집에 돌아간 뒤의 죽음은 ODY 가 agamemnon-murdered 로 쓴다."
sources = ["apollodorus.library E.2.16", "apollodorus.library E.3.6", "apollodorus.library E.3.12", "apollodorus.library E.3.21-E.3.22", "homer.iliad 1.101-305", "homer.iliad 2.100-108"]

[[figure]]
id = "menelaos"
name_ko = "메넬라오스"
name_grc = "Menelaos"
kind = "human"
era = 6
parents = ["atreus"]
spouses = ["helene"]
home = "sparta"
oneliner = "아내 헬레네를 파리스에게 잃은 스파르타의 왕."
body = """
헬레네의 구혼자 가운데서 틴다레오스가 고른 사람이다.
헬레네와 결혼하고 스파르타의 왕이 되었다.
파리스가 손님으로 와 있을 때 크레타에 갔다가 아내를 잃었다.
형 아가멤논을 찾아가 그리스 전체를 움직여 달라고 했다.
트로이에서 파리스와 맞붙어 이겼지만, 아프로디테가 파리스를 빼내 갔다.
"""
sources = ["apollodorus.library 3.10.9", "apollodorus.library E.2.16", "apollodorus.library E.3.3", "apollodorus.library E.3.6", "homer.iliad 3.340-382", "apollodorus.library E.5.22"]

[[figure]]
id = "tyndareos"
name_ko = "틴다레오스"
name_grc = "Tyndareos"
kind = "human"
era = 5
spouses = ["leda"]
home = "sparta"
oneliner = "헬레네의 구혼자 모두에게 맹세를 받아 낸 스파르타의 왕."
body = """
레다의 남편이고, 헬레네와 클리타임네스트라를 키웠다.
헬레네에게 그리스의 왕들이 몰려와 구혼했다.
한 사람을 고르면 나머지가 싸울까 걱정했다.
오디세우스의 꾀를 따라 구혼자 모두에게 맹세를 받았다.
신랑이 억울한 일을 당하면 다 함께 돕겠다는 맹세였다.
"""
fun = "이 맹세 때문에 그리스의 왕들이 나중에 모두 트로이로 가야 했다."
sources = ["apollodorus.library 3.10.7-3.10.9", "apollodorus.library E.2.15-E.2.16"]

[[figure]]
id = "leda"
name_ko = "레다"
name_grc = "Leda"
kind = "human"
era = 5
spouses = ["tyndareos"]
home = "sparta"
oneliner = "백조로 모습을 바꾼 제우스가 다가간 스파르타의 왕비."
body = """
틴다레오스의 아내다.
제우스가 백조로 모습을 바꾸어 다가왔다.
그래서 레다의 아이들 가운데 폴리데우케스와 헬레네는 제우스의 자식이다.
카스토르와 클리타임네스트라는 틴다레오스의 자식이다.
헬레네가 네메시스가 낳은 알에서 나왔다는 이야기도 있다.
"""
sensitivity = "soften"
sources = ["apollodorus.library 3.10.7"]

[[figure]]
id = "helene"
name_ko = "헬레네"
name_grc = "Helene"
name_la = "Helena"
aka = ["헬렌", "헬레나", "트로이의 헬레네"]
kind = "human"
era = 6
parents = ["zeus", "leda"]
parents_variant = [
  { source = "apollodorus.library 3.10.7", parents = ["tyndareos", "leda"], text = "헬레네를 틴다레오스의 딸이라고 하는 이야기도 있다." },
]
spouses = ["menelaos", "paris"]
home = "sparta"
oneliner = "가장 아름다운 여자. 그 때문에 트로이 전쟁이 일어났다."
body = """
제우스의 딸이고, 스파르타에서 자랐다.
그리스의 왕들이 모두 구혼했고, 메넬라오스의 아내가 되었다.
아프로디테가 파리스에게 약속한 선물이 헬레네였다.
파리스를 따라 트로이로 갔고, 그 때문에 열 해의 전쟁이 났다.
트로이가 무너진 뒤 메넬라오스가 다시 데려갔다.
"""
fun = "헬레네가 진짜로는 트로이에 가지 않았다는 이야기도 있다. 헤르메스가 헬레네를 이집트에 숨기고, 파리스는 구름으로 만든 헬레네를 데려갔다는 것이다."
sensitivity = "soften"
note = "네메시스의 알 이설(3.10.7)은 네메시스가 등록부에 없어 parents_variant 로 적지 않고 레다의 body 에 한 줄로 남긴다."
sources = ["apollodorus.library 3.10.7-3.10.9", "apollodorus.library E.3.2-E.3.5", "homer.iliad 3.121-244", "homer.odyssey 4.271-289", "apollodorus.library E.5.22"]

[[figure]]
id = "klytaimnestra"
name_ko = "클리타임네스트라"
name_grc = "Klytaimnestra"
aka = ["클뤼타임네스트라", "클리템네스트라"]
kind = "human"
era = 6
parents = ["tyndareos", "leda"]
spouses = ["agamemnon"]
home = "mycenae"
oneliner = "딸을 아울리스로 보내야 했던 아가멤논의 아내."
body = """
헬레네와 한집에서 자란 자매다.
아가멤논과 결혼해 미케네의 왕비가 되었다.
아가멤논은 딸을 아킬레우스와 결혼시키겠다고 속여 아울리스로 불렀다.
클리타임네스트라는 그 말을 믿고 이피게네이아를 보냈다.
남편이 트로이에서 돌아온 뒤의 이야기는 따로 있다.
"""
sensitivity = "soften"
note = "아가멤논을 죽이는 일은 ODY 가 쓴다."
sources = ["apollodorus.library 3.10.7", "apollodorus.library E.2.16", "apollodorus.library E.3.22"]

[[figure]]
id = "iphigeneia"
name_ko = "이피게네이아"
name_grc = "Iphigeneia"
aka = ["이피게니아"]
kind = "human"
era = 6
parents = ["agamemnon", "klytaimnestra"]
home = "mycenae"
oneliner = "아울리스의 제단에서 아르테미스가 사슴과 바꾸어 데려간 공주."
body = """
아가멤논의 딸이다.
그리스 배들이 아울리스에서 바람을 얻지 못했다.
칼카스가 아가멤논의 딸을 아르테미스에게 바쳐야 한다고 했다.
아버지는 결혼시킨다고 속여 딸을 불러 제단 앞에 세웠다.
그 순간 아르테미스가 제단에 사슴을 두고 이피게네이아를 멀리 데려갔다.
"""
fun = "아르테미스가 이피게네이아를 자기 신전지기로 삼았다고도 하고, 죽지 않는 몸으로 만들었다고도 한다."
sensitivity = "soften"
sources = ["apollodorus.library E.3.21-E.3.22", "ovid.metamorphoses 12.24-38"]

# ---------- 트로이 왕가 ----------

[[figure]]
id = "laomedon"
name_ko = "라오메돈"
name_grc = "Laomedon"
kind = "human"
era = 5
home = "troy"
oneliner = "약속을 어겨 신들과 헤라클레스를 화나게 한 트로이의 왕."
body = """
프리아모스의 아버지다.
포세이돈이 성벽을 쌓고 아폴론이 소를 쳤는데, 값을 주지 않았다.
헤라클레스에게도 말을 주기로 하고 주지 않았다.
헤라클레스가 와서 트로이를 무너뜨렸고, 라오메돈은 죽었다.
그 뒤 아들 프리아모스가 왕이 되었다.
"""
note = "헤라클레스의 트로이 원정은 HER 이 herakles-sacks-troy 로 쓴다."
sources = ["apollodorus.library 3.12.3", "apollodorus.library 3.12.5", "homer.iliad 5.638-651", "homer.iliad 21.441-457"]

[[figure]]
id = "priamos"
name_ko = "프리아모스"
name_grc = "Priamos"
aka = ["프리암"]
kind = "human"
