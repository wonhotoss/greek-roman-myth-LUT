펠리온 산에서 신들이 모두 와서 결혼 잔치를 했다.
테티스가 밤마다 아기를 불에 넣는 것을 보고 소리를 질렀다.
테티스가 떠나 버려 아기를 케이론에게 맡겨 키웠다.
"""
fun = "결혼 선물로 케이론은 물푸레나무 창을, 포세이돈은 죽지 않는 말 두 마리를 주었다. 나중에 아킬레우스가 둘 다 썼다."
note = "부모 아이아코스는 등록부에 없어 비운다. 아르고호(THE argo-departs)와 텔라몬 관계는 참조만."
sources = ["apollodorus.library 3.12.6", "apollodorus.library 3.13.5-3.13.6", "homer.iliad 16.140-144", "homer.iliad 24.59-63"]

