# era 1 — 티탄의 시대. 우라노스와 크로노스의 통치.
# 12티탄 + 그 자식 세대(프로메테우스·아틀라스·헬리오스 등).

[[figure]]
id = "kronos"
name_ko = "크로노스"
name_grc = "Kronos"
name_la = "Saturnus"
aka = ["사투르누스", "새턴", "크로누스"]
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["rhea"]
domains = ["시간", "농사"]
home = "olympus-home"
oneliner = "아버지를 밀어내고 임금이 되었다가, 아들에게 같은 일을 당한 티탄."
body = """
티탄 열둘 가운데 막내다.
어머니 가이아를 도와 아버지 우라노스를 밀어내고 임금이 되었다.
자기도 자식에게 자리를 빼앗긴다는 말을 듣고, 태어난 아이를 통째로 삼켰다.
막내 제우스만 레아가 숨겨 살렸고, 그 제우스에게 결국 자리를 빼앗긴다.
"""
fun = "로마에서는 사투르누스라고 불렸고, 이 이름에서 토성(Saturn)과 토요일(Saturday)이 나왔다."
sources = ["hesiod.theogony 453-491", "apollodorus.library 1.1.5-1.2.1"]

[[figure]]
id = "rhea"
name_ko = "레아"
name_grc = "Rhea"
name_la = "Ops"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["kronos"]
oneliner = "삼켜지는 아이를 보다 못해 막내를 숨긴 어머니."
body = """
크로노스의 아내이고 올림포스 여섯 신의 어머니다.
아이가 하나씩 삼켜지는 것을 여섯 번 견뎠다.
막내를 낳을 때는 크레타로 가서 몰래 낳고, 대신 돌을 천에 싸서 크로노스에게 주었다.
크로노스는 그 돌을 삼켰고, 제우스는 살았다.
"""
sources = ["hesiod.theogony 453-491", "apollodorus.library 1.1.5-1.1.7"]

[[figure]]
id = "okeanos"
name_ko = "오케아노스"
name_grc = "Okeanos"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["tethys"]
domains = ["세계를 감는 강"]
home = "okeanos-river"
oneliner = "땅을 감고 흐르는 큰 강의 신. 모든 물의 아버지다."
body = """
땅 바깥을 둥글게 감고 흐르는 강이 이 신이다.
아내 테티스와 함께 세상의 강과 샘을 모두 낳았다.
티탄들 편에 서지 않았기 때문에 타르타로스에 갇히지 않았다.
"""
sources = ["hesiod.theogony 337-370", "apollodorus.library 1.1.3"]

[[figure]]
id = "tethys"
name_ko = "테튀스"
name_grc = "Tethys"
aka = ["테티스"]
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["okeanos"]
oneliner = "강과 샘 삼천 개의 어머니."
body = """
오케아노스의 아내다.
세상의 강 삼천 개와 샘의 님프 삼천 명을 낳았다고 한다.
아킬레우스의 어머니 테티스와는 다른 신이다.
"""
note = "아킬레우스의 어머니 테티스(Thetis)와 다른 신. 한글 표기가 겹치므로 이쪽을 테튀스로 적고 테티스는 aka 로 둔다 — 검색은 둘 다 걸린다."
sources = ["hesiod.theogony 337-370"]

[[figure]]
id = "hyperion"
name_ko = "히페리온"
name_grc = "Hyperion"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["theia"]
oneliner = "해와 달과 새벽의 아버지."
body = """
빛과 관련된 티탄이다.
테이아와 함께 헬리오스(해), 셀레네(달), 에오스(새벽)를 낳았다.
"""
sources = ["hesiod.theogony 371-374"]

[[figure]]
id = "theia"
name_ko = "테이아"
name_grc = "Theia"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["hyperion"]
oneliner = "히페리온의 아내. 해·달·새벽의 어머니."
body = """
빛나는 것들의 어머니다.
헬리오스, 셀레네, 에오스를 낳았다.
"""
sources = ["hesiod.theogony 371-374"]

[[figure]]
id = "iapetos"
name_ko = "이아페토스"
name_grc = "Iapetos"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
oneliner = "프로메테우스와 아틀라스의 아버지."
body = """
티탄 열둘 가운데 하나다.
자식들이 아버지보다 훨씬 유명하다.
프로메테우스, 에피메테우스, 아틀라스가 이 신의 아들이다.
"""
sources = ["hesiod.theogony 507-511", "apollodorus.library 1.2.3"]

[[figure]]
id = "koios"
name_ko = "코이오스"
name_grc = "Koios"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["phoibe"]
oneliner = "레토의 아버지. 아폴론과 아르테미스의 할아버지다."
body = """
티탄 열둘 가운데 하나다.
포이베와 함께 레토를 낳았다.
"""
sources = ["hesiod.theogony 404-410"]

[[figure]]
id = "phoibe"
name_ko = "포이베"
name_grc = "Phoibe"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
spouses = ["koios"]
oneliner = "레토의 어머니."
body = """
코이오스의 아내다.
레토를 낳았고, 그래서 아폴론의 별칭 '포이보스'와 이름이 이어진다.
"""
sources = ["hesiod.theogony 404-410"]

[[figure]]
id = "kreios"
name_ko = "크레이오스"
name_grc = "Krios"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
oneliner = "티탄 열둘 가운데 하나. 남은 이야기가 거의 없다."
body = """
헤시오도스가 이름만 적어 둔 티탄이다.
별과 관련된 자손을 두었다고 한다.
이야기가 남지 않은 신도 신화에는 많다.
"""
sources = ["hesiod.theogony 375-377"]

[[figure]]
id = "themis"
name_ko = "테미스"
name_grc = "Themis"
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
domains = ["옳고 그름", "약속"]
oneliner = "무엇이 옳은지를 아는 티탄. 제우스 옆에 앉는다."
body = """
규칙과 약속을 맡은 여신이다.
티탄이지만 제우스 편에 섰고, 올림포스에 자리를 얻었다.
델포이의 신전도 아폴론보다 먼저 이 여신의 것이었다.
"""
fun = "법원 앞에 눈을 가리고 저울을 든 조각상이 있으면 대개 이 여신이다."
sources = ["hesiod.theogony 135", "hesiod.theogony 901-906", "pausanias.greece 10.5"]

[[figure]]
id = "mnemosyne"
name_ko = "므네모시네"
name_grc = "Mnemosyne"
aka = ["기억"]
kind = "titan"
era = 1
parents = ["gaia", "ouranos"]
domains = ["기억"]
oneliner = "기억 그 자체인 티탄. 무사이 아홉 자매의 어머니다."
body = """
이름을 읽기 어려우면 므·네·모·시·네로 끊어 읽으면 된다.
기억을 맡은 여신이다.
제우스와 함께 노래와 이야기를 맡은 무사이 아홉을 낳았다.
글이 없던 시절, 이야기를 남기는 방법은 기억뿐이었다. 그래서 이 신이 중요했다.
"""
sources = ["hesiod.theogony 53-62", "hesiod.theogony 915-917"]

[[figure]]
id = "prometheus"
name_ko = "프로메테우스"
name_grc = "Prometheus"
kind = "titan"
era = 1
parents = ["iapetos"]
oneliner = "사람에게 불을 가져다준 티탄. 그 벌로 오래 묶여 있었다."
body = """
이름은 '먼저 아는 자'라는 뜻이다.
티탄 편이 아니라 제우스 편에 서서 싸웠다.
그런데 사람을 아껴서, 제우스가 감춘 불을 몰래 훔쳐 사람에게 주었다.
제우스는 프로메테우스를 산에 묶고 독수리가 매일 와서 간을 먹게 했다.
"""
fun = "훗날 헤라클레스가 그 독수리를 쏘아 프로메테우스를 풀어 준다."
sources = ["hesiod.theogony 507-616", "hesiod.works 42-105", "apollodorus.library 1.7.1"]

[[figure]]
id = "epimetheus"
name_ko = "에피메테우스"
name_grc = "Epimetheus"
kind = "titan"
era = 1
parents = ["iapetos"]
spouses = ["pandora"]
oneliner = "'나중에 아는 자'. 형의 경고를 잊고 판도라를 맞아들였다."
body = """
프로메테우스의 동생이다.
이름은 '나중에 아는 자'라는 뜻이다.
형이 "제우스가 주는 선물은 절대 받지 말라"고 했는데, 판도라를 보고 그 말을 잊었다.
그래서 판도라가 사람들 사이로 들어온다.
"""
sources = ["hesiod.works 42-105", "hesiod.theogony 507-514"]

[[figure]]
id = "atlas"
name_ko = "아틀라스"
name_grc = "Atlas"
kind = "titan"
era = 1
parents = ["iapetos"]
home = "hesperides-garden"
oneliner = "하늘을 어깨로 받치고 서 있는 벌을 받은 티탄."
body = """
티탄 편에 서서 제우스와 싸웠다.
져서 받은 벌은 세상의 서쪽 끝에 서서 하늘을 떠받치는 것이었다.
쉬지도 앉지도 못한다.
헤라클레스가 잠깐 대신 받쳐 준 적이 한 번 있다.
"""
fun = "지도책을 '아틀라스'라고 부르는 것이 이 신에서 왔다. 옛 지도책 표지에 이 신이 그려져 있었다."
sources = ["hesiod.theogony 517-520", "apollodorus.library 2.5.11"]

[[figure]]
id = "helios"
name_ko = "헬리오스"
name_grc = "Helios"
name_la = "Sol"
aka = ["솔", "해"]
kind = "titan"
era = 1
parents = ["hyperion", "theia"]
domains = ["해"]
oneliner = "해 그 자체인 신. 하늘을 마차로 건넌다."
body = """
매일 아침 동쪽 오케아노스에서 네 마리 말이 끄는 불 마차를 타고 떠오른다.
저녁에 서쪽 오케아노스로 내려간다.
높은 곳에서 세상을 다 보기 때문에, 무슨 일이 있었는지 물으면 알려 준다.
"""
note = "뒷시대에는 아폴론과 같은 신으로 여겨지지만, 원래는 다른 신이다. 이 구분을 아이에게 준다."
sources = ["hesiod.theogony 371-374", "homer.odyssey 8.270-271", "ovid.metamorphoses 2.1-2.400"]

[[figure]]
id = "selene"
name_ko = "셀레네"
name_grc = "Selene"
name_la = "Luna"
aka = ["루나", "달"]
kind = "titan"
era = 1
parents = ["hyperion", "theia"]
domains = ["달"]
oneliner = "달 그 자체인 신."
body = """
헬리오스의 누이다.
밤에 마차를 타고 하늘을 건넌다.
"""
sources = ["hesiod.theogony 371-374"]

[[figure]]
id = "eos"
name_ko = "에오스"
name_grc = "Eos"
name_la = "Aurora"
aka = ["아우로라", "새벽"]
kind = "titan"
era = 1
parents = ["hyperion", "theia"]
domains = ["새벽"]
oneliner = "새벽 그 자체인 신. 해보다 먼저 나온다."
body = """
헬리오스의 누이다.
아침마다 해보다 먼저 나와 하늘을 붉게 물들인다.
호메로스는 이 신을 '장미빛 손가락의 에오스'라고 불렀다.
"""
sources = ["hesiod.theogony 371-374", "homer.odyssey 2.1"]

[[figure]]
id = "leto"
name_ko = "레토"
name_grc = "Leto"
name_la = "Latona"
kind = "titan"
era = 1
parents = ["koios", "phoibe"]
oneliner = "아폴론과 아르테미스의 어머니. 헤라에게 쫓겨 다녔다."
body = """
제우스의 아이를 갖자 헤라가 화를 냈다.
헤라 때문에 어느 땅도 레토를 받아 주지 않았다.
바다에 떠다니던 델로스 섬만 자리를 내주었고, 거기서 두 아이를 낳았다.
그 뒤 델로스는 떠다니지 않고 자리를 잡았다.
"""
sources = ["apollodorus.library 1.4.1", "hesiod.theogony 918-920"]

[[figure]]
id = "typhon"
name_ko = "티폰"
name_grc = "Typhon"
aka = ["티포에우스", "튀폰"]
kind = "monster"
era = 2
parents = ["gaia", "tartaros"]
oneliner = "가이아가 마지막으로 낳은, 신들을 통째로 위협한 괴물."
body = """
산보다 크고, 어깨에서 뱀 백 마리가 자라나 있었다.
가이아가 티탄과 기간테스의 일을 갚으려고 낳았다.
제우스와 단둘이 싸웠고, 신들은 모두 도망쳤다.
제우스가 번개로 이겨 타르타로스에 던졌다.
"""
fun = "케르베로스, 키마이라, 히드라가 모두 티폰의 자식이라고 한다. 그래서 '괴물의 아버지'라고 불린다."
sources = ["hesiod.theogony 820-880", "apollodorus.library 1.6.3"]
