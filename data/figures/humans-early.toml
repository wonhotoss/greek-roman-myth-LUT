# era 3 — 사람의 시대가 열리다. 프로메테우스, 판도라, 큰 홍수.

[[figure]]
id = "pandora"
name_ko = "판도라"
name_grc = "Pandora"
kind = "human"
era = 3
spouses = ["epimetheus"]
oneliner = "신들이 만들어 사람들에게 보낸 첫 여자. 열지 말라는 항아리를 열었다."
body = """
프로메테우스가 불을 훔친 것을 갚으려고 제우스가 만들게 했다.
헤파이스토스가 흙으로 모양을 만들고, 신들이 하나씩 선물을 얹었다.
이름은 모든 신에게 선물을 받았다는 뜻이다.
열지 말라고 받은 항아리를 열었고, 온갖 나쁜 것이 세상에 퍼졌다.
"""
fun = "판도라가 연 것은 상자가 아니라 큰 항아리다. 그리스 말로 피토스라고 한다. 상자로 잘못 옮겨진 것이 500년쯤 전이다."
sources = ["hesiod.works 42-105", "hesiod.theogony 570-593"]

[[figure]]
id = "deukalion"
name_ko = "데우칼리온"
name_grc = "Deukalion"
kind = "human"
era = 3
parents = ["prometheus"]
spouses = ["pyrrha"]
oneliner = "큰 홍수에서 살아남은 남자. 프로메테우스의 아들이다."
body = """
제우스가 사람들에게 화가 나 온 세상에 비를 내렸다.
프로메테우스가 미리 알려 주어, 데우칼리온은 큰 나무 상자를 만들었다.
아홉 날을 떠다닌 뒤 파르나소스 산에 닿았다.
살아남은 사람은 데우칼리온과 아내 피라 둘뿐이었다.
"""
fun = "홍수에서 배를 만들어 살아남는 이야기는 그리스뿐 아니라 여러 곳에 있다."
sources = ["apollodorus.library 1.7.2", "ovid.metamorphoses 1.253-1.415"]

[[figure]]
id = "pyrrha"
name_ko = "피라"
name_grc = "Pyrrha"
kind = "human"
era = 3
parents = ["epimetheus", "pandora"]
spouses = ["deukalion"]
oneliner = "홍수에서 살아남은 여자. 판도라의 딸이다."
body = """
에피메테우스와 판도라의 딸이다.
데우칼리온과 함께 상자를 타고 살아남았다.
둘만 남은 세상에서 어떻게 해야 하는지 신에게 물었다.
"""
sources = ["apollodorus.library 1.7.2", "ovid.metamorphoses 1.350-1.415"]

[[figure]]
id = "hellen"
name_ko = "헬렌"
name_grc = "Hellen"
kind = "human"
era = 3
parents = ["deukalion", "pyrrha"]
oneliner = "데우칼리온의 아들. 그리스 사람들을 '헬레네스'라고 부르게 한 이름의 주인이다."
body = """
큰 홍수 뒤에 데우칼리온과 피라에게서 태어났다.
그리스 사람들을 자기 이름을 따 헬레네스라고 불렀다.
아들 셋 — 도로스, 크수토스, 아이올로스 — 에게 땅을 나누어 주었다.
도리스인, 이오니아인, 아이올리스인이라는 이름이 그 아들들에게서 나왔다.
"""
fun = "지금도 그리스 사람들은 자기 나라를 '헬라스', 자기들을 '헬레네스'라고 부른다."
note = "트로이의 헬레네(helene)와 다른 사람. 어머니 피라는 아폴로도로스 1.7.2. 아내 오르세이스(님프)는 등록부에 없다."
sources = ["apollodorus.library 1.7.2-1.7.3"]

[[figure]]
id = "aiolos-hellenides"
name_ko = "아이올로스"
name_grc = "Aiolos"
aka = ["헬렌의 아들 아이올로스", "아이올리스인의 조상"]
kind = "human"
era = 3
parents = ["hellen"]
oneliner = "헬렌의 아들. 테살리아를 다스렸고, 시시포스·아타마스·크레테우스·살모네우스의 아버지다."
body = """
아버지 헬렌에게서 테살리아 둘레의 땅을 받아 다스렸다.
그 땅 사람들을 자기 이름을 따 아이올리스인이라고 불렀다.
아들 일곱과 딸 다섯을 두었다.
시시포스, 아타마스, 크레테우스, 살모네우스가 그 아들이라, 벨레로폰·프릭소스·이아손·펠리아스·네스토르가 모두 이 집안에서 나온다.
"""
fun = "오디세우스가 만난 바람의 아이올로스와 이름이 같지만 다른 사람이다. 포세이돈의 아들인 셋째 아이올로스도 있다."
note = "바람의 아이올로스(aiolos-anemon, 호메로스·베르길리우스)와 다른 사람. 히기누스 186·157 의 포세이돈의 아들 아이올로스(멜라니페/안티오페의 아들)는 셋째인데 데이터의 어느 이야기와도 닿지 않아 넣지 않았다. 딸 카나케와 아들 마카레우스의 이야기(에우리피데스의 잃어버린 『아이올로스』)는 오비디우스 9.507 의 한 줄뿐이라 쓰지 않는다. 아내 에나레테와 아들 데이온·마그네스·페리에레스, 딸 다섯은 등록부에 없다."
sources = ["apollodorus.library 1.7.3", "hyginus.fabulae 60-61"]
