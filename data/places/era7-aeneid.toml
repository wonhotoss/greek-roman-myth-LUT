# era 7 — 돌아오는 길. 아이네이아스가 지나간 곳들. 전부 실제로 있는 곳이다.
# 라티누스의 도시 라우렌툼은 정확한 위치가 다투어져 만들지 않았다. 폴리페모스의 땅은 ODY 의 kyklopes-land(mythic)가 따로 있다.

[[place]]
id = "delos"
name_ko = "델로스"
name_grc = "Delos"
aka = ["델로스 섬"]
kind = "real"
lat = 37.3936
lon = 25.2711
modern = "그리스 델로스 섬 (미코노스 옆)"
oneliner = "아폴론이 태어난 작은 섬. 아이네이아스가 여기서 신의 말을 들었다."
body = """
에게 해 한가운데 있는 작은 섬이다.
그리스 사람들은 레토가 여기서 아폴론을 낳았다고 믿었다.
옛날에는 바다 위를 떠다니다가 아폴론이 바닥에 붙였다고 한다.
아이네이아스는 여기서 '옛 어머니의 땅을 찾으라'는 말을 들었다.
"""
fun = "섬이 작아서 지금은 아무도 살지 않고, 유적만 남아 있다."
sources = ["virgil.aeneid 3.73-3.120", "homeric.hymns apollo 14-18", "ovid.metamorphoses 13.631-13.634"]

[[place]]
id = "strophades"
name_ko = "스트로파데스 섬"
name_grc = "Strophades"
aka = ["스트로파데스", "스트로파데스 군도", "스트로파데스 제도"]
kind = "real"
lat = 37.2500
lon = 21.0000
modern = "그리스 스트로파데스 섬 (자킨토스 남쪽, 이오니아 해)"
oneliner = "하르피이아이가 산다고 한 작은 섬. 켈라이노가 저주를 내렸다."
body = """
이오니아 해에 있는 아주 작은 섬 둘이다.
베르길리우스는 하르피이아이가 여기 산다고 썼다.
아이네이아스 일행이 소를 잡아 먹으려다 하르피이아이에게 빼앗겼다.
하르피이아 켈라이노가 바위 위에서 앞일과 저주를 말했다.
"""
fun = "이름은 '돌아선 섬'이라는 뜻이다. 아르고호의 영웅들이 하르피이아이를 쫓다가 여기서 돌아섰다고 한다."
sources = ["virgil.aeneid 3.209-3.269", "apollodorus.library 1.9.21"]

[[place]]
id = "buthrotum"
name_ko = "부트로툼"
name_grc = "Bouthroton"
aka = ["부트로톤", "부트린트", "부트로툼"]
kind = "real"
lat = 39.7461
lon = 20.0206
modern = "알바니아 부트린트"
oneliner = "헬레노스와 안드로마케가 작은 트로이를 다시 세운 곳."
body = """
그리스 서북쪽, 지금의 알바니아 바닷가에 있다.
트로이가 무너진 뒤 헬레노스가 여기 왕이 되어 작은 트로이를 지었다.
성문과 강에도 트로이의 옛 이름을 붙였다.
아이네이아스는 여기서 헬레노스에게 앞으로 갈 길을 물었다.
지금은 옛 성벽과 극장이 남아 있는 유적이다.
"""
sources = ["virgil.aeneid 3.294-3.505"]

[[place]]
id = "aitna"
name_ko = "에트나 산"
name_grc = "Aitne"
aka = ["아이트나", "에트나", "에트나 화산"]
kind = "real"
lat = 37.7510
lon = 14.9934
modern = "이탈리아 시칠리아 에트나 산, 높이 약 3350m"
oneliner = "불을 뿜는 산. 베르길리우스는 키클롭스가 그 아래에 산다고 했다."
body = """
시칠리아 섬 동쪽에 있는, 지금도 불을 뿜는 산이다.
베르길리우스는 거인 엔켈라도스가 이 산 아래 눌려 있다고 썼다.
그가 몸을 뒤척일 때마다 섬이 흔들리고 연기가 난다고 했다.
아이네이아스는 이 산 아래에서 폴리페모스와 다른 키클롭스들을 보았다.
"""
fun = "지금도 몇 해에 한 번씩 불을 뿜는다. 유럽에서 가장 큰 불 뿜는 산이다."
note = "호메로스는 키클롭스의 땅을 어디라고 말하지 않는다. 베르길리우스가 여기라고 했다. ODY 의 kyklopes-land 는 mythic 이다."
sources = ["virgil.aeneid 3.554-3.587", "virgil.aeneid 3.655-3.681", "ovid.metamorphoses 14.160-14.161"]

[[place]]
id = "carthage"
name_ko = "카르타고"
name_grc = "Karchedon"
aka = ["카르케돈", "카르타고 유적", "카르타고"]
kind = "real"
lat = 36.8528
lon = 10.3233
modern = "튀니지 튀니스 근교 카르타고 유적"
oneliner = "디도가 바다를 건너와 세운 새 도시."
body = """
아프리카 북쪽 바닷가에 있다.
디도가 티로스에서 온 사람들과 함께 성벽을 쌓고 있었다.
헤라가 특별히 아끼는 도시여서 헤라의 신전이 한가운데 있었다.
폭풍에 밀린 아이네이아스가 여기 닿았고, 디도가 그를 맞았다.
지금은 로마 시대 유적이 남아 있다.
"""
fun = "베르길리우스는 그들이 소가죽 한 장으로 두를 만큼의 땅을 샀다고 썼다. 그래서 그 언덕을 비르사(소가죽)라고 불렀다."
sources = ["virgil.aeneid 1.12-1.18", "virgil.aeneid 1.338-1.368", "virgil.aeneid 1.418-1.449"]

[[place]]
id = "cumae"
name_ko = "쿠마이"
name_grc = "Kyme"
aka = ["쿠마에", "키메", "쿠마"]
kind = "real"
lat = 40.8486
lon = 14.0547
modern = "이탈리아 나폴리 근교 쿠마 유적"
oneliner = "시빌레의 동굴이 있는 언덕. 아이네이아스가 이탈리아에 내린 곳."
body = """
나폴리 서쪽 바닷가 언덕이다.
그리스 사람들이 바다를 건너와 세운 도시로, 아폴론 신전이 있었다.
시켈리아에서 온 아이네이아스의 배들이 여기 닿았다.
언덕 아래 긴 동굴에 시빌레가 살았다.
지금도 그 동굴이라고 하는 긴 굴이 남아 있다.
"""
sources = ["virgil.aeneid 6.1-6.13", "virgil.aeneid 6.42-6.44", "ovid.metamorphoses 14.101-14.106"]

[[place]]
id = "avernus"
name_ko = "아베르누스 호수"
name_grc = "Aornos"
aka = ["아베르노 호수", "아오르노스", "아베르누스"]
kind = "real"
lat = 40.8383
lon = 14.0750
modern = "이탈리아 포추올리 아베르노 호수"
oneliner = "저승으로 들어가는 문이라고 여긴 실제 호수."
body = """
쿠마이 옆에 있는 둥근 호수다.
물에서 나쁜 냄새가 나서 새가 그 위를 날지 못한다고 믿었다.
그래서 그리스 말로 '새가 없는 곳'이라는 이름이 붙었다.
사람들은 이 호숫가 굴이 저승으로 이어진다고 믿었다.
아이네이아스는 시빌레와 함께 여기서 저승으로 내려갔다.
"""
fun = "지금 가면 그냥 조용한 호수다. 새도 날아다닌다."
sources = ["virgil.aeneid 6.237-6.242", "virgil.aeneid 3.441-3.442", "ovid.metamorphoses 14.105"]

[[place]]
id = "tiber"
name_ko = "테베레 강"
name_grc = "Thymbris"
aka = ["티베리스", "티베르 강", "테베레", "티베리스 강"]
kind = "real"
lat = 41.7417
lon = 12.2333
modern = "이탈리아 테베레 강 하구 (로마 서쪽 오스티아)"
oneliner = "아이네이아스의 배가 마침내 들어간 강. 그 강가에 뒷날 로마가 선다."
body = """
이탈리아 가운데를 흘러 바다로 나가는 누런 강이다.
크레우사의 그림자가 트로이에서 이미 이 강 이름을 말해 주었다.
아이네이아스의 배들은 긴 여행 끝에 이 강어귀로 들어갔다.
강의 신 티베리누스가 꿈에 나타나 에반드로스를 찾아가라고 했다.
강물이 스스로 멈추어 배가 거슬러 오르기 쉽게 해 주었다.
"""
fun = "옛 이름은 알불라였다. 에반드로스는 티브리스 왕이 죽은 뒤 강 이름이 바뀌었다고 했다."
sources = ["virgil.aeneid 2.781-2.782", "virgil.aeneid 7.29-7.36", "virgil.aeneid 8.31-8.65", "virgil.aeneid 8.86-8.96", "virgil.aeneid 8.330-8.332"]
note = "좌표는 하구(오스티아)다. 강의 신 티베리누스는 등록부에 없어 이름만."

[[place]]
id = "lavinium"
name_ko = "라비니움"
name_grc = "Lavinion"
aka = ["라비니움 유적", "프라티카 디 마레"]
kind = "real"
lat = 41.6597
lon = 12.4786
modern = "이탈리아 라치오 프라티카 디 마레"
oneliner = "아이네이아스가 세운 도시. 아내 라비니아의 이름을 붙였다."
body = """
로마 남쪽 바닷가 가까이에 있다.
아이네이아스는 라비니아와 결혼하고 여기 도시를 세웠다.
크레우사의 그림자가 말한 '조용한 나라'가 여기다.
아들 아스카니오스는 서른 해 뒤 여기서 나가 알바 롱가를 세웠다.
지금은 작은 마을이고, 옛 도시 자리는 발굴 중이다.
"""
sources = ["livy.rome 1.1", "virgil.aeneid 1.258-1.271", "virgil.aeneid 2.780-2.784", "virgil.aeneid 12.193-12.194"]

[[place]]
id = "ardea"
name_ko = "아르데아"
name_grc = "Ardea"
aka = ["아르데아 유적"]
kind = "real"
lat = 41.6086
lon = 12.5439
modern = "이탈리아 라치오 아르데아"
oneliner = "투르누스의 도시. 다나에가 세웠다고 한다."
body = """
라티움 남쪽, 바다에서 조금 들어간 언덕 위 도시다.
베르길리우스는 아르고스에서 온 다나에가 이 도시를 세웠다고 썼다.
투르누스가 여기 왕궁에서 자고 있을 때 복수의 여신이 찾아왔다.
투르누스가 죽은 뒤 도시는 불탔다.
오비디우스는 그 재에서 왜가리 한 마리가 날아올랐다고 썼다.
"""
fun = "왜가리는 라틴 말로 아르데아다. 도시 이름이 새 이름이 되었다."
sources = ["virgil.aeneid 7.409-7.413", "ovid.metamorphoses 14.573-14.580"]
note = "다나에(danae)는 기존 figure. 세리포스가 아니라 이탈리아로 흘러왔다는 것은 베르길리우스만의 이야기다."
