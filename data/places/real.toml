# 실제로 있는 곳. 지금 가면 있다. 좌표는 실지도에 찍힌다.

[[place]]
id = "mt-olympus"
name_ko = "올림포스 산"
name_grc = "Olympos"
kind = "real"
lat = 40.0853
lon = 22.3583
modern = "그리스 테살리아, 높이 2917m"
oneliner = "그리스에서 가장 높은 산. 신들이 산다고 여겨진 곳이다."
body = """
그리스 사람들은 이 산 꼭대기 위에 신들의 집이 있다고 생각했다.
산은 실제로 있고 지금도 사람들이 올라간다.
꼭대기는 자주 구름에 덮여 아래에서는 보이지 않는다.
그래서 그 위에 무엇이 있는지 아무도 모른다고 믿었다.
"""
fun = "산 이름이 붙은 곳이 그리스에 여러 개 있다. 신화의 올림포스는 그중 가장 높은 이 산이다."
sources = ["homer.iliad 1.400-410", "pausanias.greece 1.18"]

[[place]]
id = "delphi"
name_ko = "델포이"
name_grc = "Delphoi"
aka = ["델피"]
kind = "real"
lat = 38.4824
lon = 22.5010
modern = "그리스 델피"
oneliner = "아폴론의 신전이 있던 곳. 앞일을 물으러 그리스 전체가 여기로 왔다."
body = """
산비탈에 아폴론의 신전이 있었다.
사람들은 여기 와서 앞일을 물었고, 신의 말을 전하는 여자가 대답을 주었다.
그 대답은 언제나 알아듣기 어려웠다.
그리스 사람들은 이곳을 세상의 중심이라고 불렀다.
"""
fun = "신전 안에 '세상의 배꼽'이라는 둥근 돌이 있었다. 지금도 그 돌이 남아 있다."
sources = ["apollodorus.library 1.4.1", "pausanias.greece 10.5-10.32"]

[[place]]
id = "argos"
name_ko = "아르고스"
name_grc = "Argos"
kind = "real"
lat = 37.6314
lon = 22.7194
modern = "그리스 아르고스"
oneliner = "페르세우스의 할아버지가 왕이었던 도시."
body = """
그리스에서 가장 오래된 도시 가운데 하나다.
아크리시오스 왕이 여기서 다스렸고, 그의 딸이 다나에다.
페르세우스는 여기서 쫓겨났다가 돌아온다.
헤라가 특히 아끼는 도시였다.
"""
sources = ["apollodorus.library 2.2.1-2.4.4"]

[[place]]
id = "seriphos"
name_ko = "세리포스 섬"
name_grc = "Seriphos"
kind = "real"
lat = 37.1500
lon = 24.4833
modern = "그리스 세리포스 섬"
oneliner = "나무 상자에 실려 떠내려온 다나에와 아기 페르세우스가 닿은 섬."
body = """
아테네에서 배로 남쪽으로 가면 나오는 작은 섬이다.
어부 딕티스가 바다에서 상자를 건져 올린 곳이 여기다.
페르세우스는 이 섬에서 자랐다.
섬의 왕 폴리덱테스가 페르세우스를 메두사에게 보낸다.
"""
sources = ["apollodorus.library 2.4.1-2.4.3"]

[[place]]
id = "athens"
name_ko = "아테네"
name_grc = "Athenai"
kind = "real"
lat = 37.9755
lon = 23.7348
modern = "그리스 아테네"
oneliner = "아테나의 이름을 딴 도시."
body = """
아테나와 포세이돈이 이 도시를 누가 가질지 다투었다.
포세이돈은 바닷물이 솟는 샘을 주고, 아테나는 올리브 나무를 주었다.
사람들이 올리브를 고르자 도시는 아테나의 것이 되었다.
도시 이름도 그래서 아테나에서 왔다.
"""
fun = "지금도 아테네 언덕 위에 아테나의 신전 파르테논이 서 있다."
sources = ["apollodorus.library 3.14.1", "pausanias.greece 1.24"]

[[place]]
id = "crete"
name_ko = "크레타"
name_grc = "Krete"
kind = "real"
lat = 35.2980
lon = 25.1630
modern = "그리스 크레타 섬 크노소스"
oneliner = "아기 제우스가 숨겨져 자란 섬. 나중에 미노스 왕의 나라가 된다."
body = """
레아는 크로노스에게 들키지 않으려고 크레타의 굴에서 제우스를 낳았다.
아기는 여기서 님프들의 손에 자랐다.
울음소리를 감추려고 병사들이 방패를 두드렸다고 한다.
훗날 이 섬에는 미노스 왕과 미궁이 생긴다.
"""
sources = ["hesiod.theogony 468-484", "apollodorus.library 1.1.6-1.1.7"]

[[place]]
id = "eleusis"
name_ko = "엘레우시스"
name_grc = "Eleusis"
kind = "real"
lat = 38.0400
lon = 23.5400
modern = "그리스 엘레프시나"
oneliner = "딸을 잃은 데메테르가 앉아 울었다는 곳."
body = """
페르세포네를 찾아 헤매던 데메테르가 지쳐 우물가에 앉은 곳이다.
이 집의 사람들이 데메테르를 돌보아 주었다.
데메테르는 고맙다며 이곳 사람들에게 곡식 기르는 법을 가르쳤다.
해마다 이곳에서 큰 제사가 열렸다.
"""
sources = ["apollodorus.library 1.5.1-1.5.2"]

[[place]]
id = "mycenae"
name_ko = "미케네"
name_grc = "Mykenai"
kind = "real"
lat = 37.7306
lon = 22.7561
modern = "그리스 미키네"
oneliner = "페르세우스가 세웠다고 전해지는 성. 뒷날 트로이로 떠난 왕들의 나라."
body = """
페르세우스가 아르고스를 떠나 이 성을 세웠다고 한다.
돌을 크게 쌓은 성벽과 사자가 새겨진 문이 지금도 남아 있다.
트로이로 군대를 이끌고 간 아가멤논이 이 성의 왕이다.
"""
fun = "성벽의 돌이 너무 커서, 그리스 사람들은 사람이 아니라 키클롭스가 쌓았다고 믿었다."
sources = ["apollodorus.library 2.4.4", "pausanias.greece 2.15-2.16"]

[[place]]
id = "troy"
name_ko = "트로이"
name_grc = "Troia"
aka = ["일리온", "일리오스"]
kind = "real"
lat = 39.9576
lon = 26.2387
modern = "튀르키예 히사를리크"
oneliner = "10년 동안 그리스군에 둘러싸여 싸운 성."
body = """
바다 건너 동쪽에 있던 부유한 성이다.
파리스가 헬레네를 데려간 뒤 그리스 왕들이 배를 타고 여기까지 왔다.
성은 10년을 버텼고, 마지막에 나무 말 때문에 무너졌다.
오랫동안 이야기 속 도시라고 여겨졌지만, 1870년대에 실제로 발굴되었다.
"""
sources = ["homer.iliad 2.816-877"]

[[place]]
id = "larissa"
name_ko = "라리사"
name_grc = "Larissa"
kind = "real"
lat = 39.6390
lon = 22.4191
modern = "그리스 라리사"
oneliner = "아크리시오스가 손자를 피해 갔던 도시."
body = """
그리스 북쪽 테살리아의 도시다.
아크리시오스는 손자가 온다는 말을 듣고 여기까지 피했다.
그런데 페르세우스가 이 도시의 운동 경기에 나갔다.
피한 곳에서 피하려던 일이 일어났다.
"""
sources = ["apollodorus.library 2.4.4"]

[[place]]
id = "parnassos"
name_ko = "파르나소스 산"
name_grc = "Parnassos"
aka = ["파르나수스"]
kind = "real"
lat = 38.5350
lon = 22.6240
modern = "그리스 파르나소스, 높이 2457m. 델포이 바로 위"
oneliner = "큰 홍수 때 데우칼리온의 상자가 닿은 산."
body = """
델포이 바로 위에 솟은 높은 산이다.
큰 홍수가 세상을 덮었을 때 데우칼리온과 피라의 상자가 이 산에 닿았다.
물이 빠진 뒤 두 사람은 여기서 내려와 다시 사람을 만들었다.
지금도 겨울에는 눈이 덮이고, 사람들이 스키를 타러 온다.
"""
sources = ["apollodorus.library 1.7.2", "ovid.metamorphoses 1.313-1.347"]

[[place]]
id = "pallene"
name_ko = "팔레네"
name_grc = "Pallene"
aka = ["카산드라 반도", "플레그라이"]
kind = "real"
lat = 39.9800
lon = 23.5000
modern = "그리스 할키디키의 카산드라 반도"
oneliner = "거인들이 태어나 신들과 싸웠다는 반도."
body = """
그리스 북쪽 바다로 세 손가락처럼 뻗은 반도 가운데 하나다.
아폴로도로스는 거인들이 플레그라이에서 났다고도 하고 팔레네에서 났다고도 적었다.
두 이름은 같은 곳을 가리킨다고 보는 사람이 많다.
신들과 거인들이 싸운 자리라고 옛사람들은 여겼다.
"""
fun = "'플레그라이'는 '불타는 땅'이라는 뜻이다. 옛사람들은 이 땅이 싸움으로 타 버렸다고 생각했다."
note = "장소에 이설이 있는 첫 사례. 원전이 두 이름을 나란히 주므로 항목 하나로 두고 aka 와 body 에서 둘 다 밝힌다."
sources = ["apollodorus.library 1.6.1"]
