# era 7 — 돌아오는 길. 오디세이아의 장소들 (ODY).
# 실제로 있는 곳 둘(이타케·필로스)과, 호메로스는 어디라고 말하지 않는데 뒷시대가 실제 위치를 갖다 붙인 곳 열.
# 뒤쪽은 mythic 으로 두고 note 에 후대 동일시와 실좌표를 주지 않는 까닭을 적었다.
# cx/cy 는 cosmos.toml 과 겹치지 않게 서쪽 끝(cx 0.05)·동쪽 끝(cx 0.95)에 cy 0.26~0.52 로 나눠 놓았다(땅 띠 0.20~0.62 안).

[[place]]
id = "ithake"
name_ko = "이타케"
name_grc = "Ithake"
aka = ["이타카", "이타키", "이타카 섬"]
kind = "real"
lat = 38.4000
lon = 20.6833
modern = "그리스 이타키 섬"
oneliner = "오디세우스의 집이 있는 바위 많은 작은 섬."
body = """
그리스 서쪽 바다에 있는 작은 섬이다.
바위가 많아 말을 기르지 못하지만, 사람을 잘 키우는 땅이라고 오디세우스는 말했다.
오디세우스는 트로이로 떠난 뒤 스무 해 만에 이 섬으로 돌아왔다.
파이아케스의 배가 잠든 오디세우스를 포르키스 항구에 내려 주었다.
"""
fun = "지금도 이타키라는 이름 그대로 사람이 산다. 오디세우스의 집이 어디였는지는 아직 아무도 확실히 모른다."
sources = ["homer.odyssey 9.21-28", "homer.odyssey 4.605-608", "homer.odyssey 13.96-112"]

[[place]]
id = "pylos"
name_ko = "필로스"
name_grc = "Pylos"
aka = ["퓔로스", "네스토르의 필로스"]
kind = "real"
lat = 37.0275
lon = 21.6947
modern = "그리스 필로스 근처 호라, 네스토르 궁전 터"
oneliner = "네스토르 왕의 나라. 텔레마코스가 아버지 소식을 찾아 처음 간 곳."
body = """
그리스 남서쪽 바닷가에 있는 네스토르의 나라다.
텔레마코스가 배를 타고 와서 아버지 소식을 물었다.
네스토르는 아들과 수레를 내어 텔레마코스를 스파르타까지 보내 주었다.
파우사니아스는 여기서 네스토르의 집과 무덤을 보았다고 적었다.
"""
fun = "1939년 이 근처에서 큰 궁전 터가 발굴되었다. 사람들은 지금 그곳을 '네스토르의 궁전'이라고 부른다."
sources = ["homer.odyssey 3.1-497", "homer.odyssey 15.182-221", "pausanias.greece 4.36"]

# ---------- 서쪽 끝 (cx 0.05) ----------

[[place]]
id = "ogygia"
name_ko = "오기기아"
name_grc = "Ogygia"
aka = ["오기기아 섬", "칼립소의 섬"]
kind = "mythic"
layer = "sea"
cx = 0.05
cy = 0.26
oneliner = "바다 한가운데 있다는 칼립소의 섬."
body = """
칼립소가 혼자 사는 섬이다.
호메로스는 다른 땅에서 아주 먼 바다 한가운데 있다고만 했다.
오디세우스는 부서진 배 조각을 타고 아홉 날을 떠다녀 여기 닿았다.
그리고 일곱 해를 여기서 보냈다.
"""
note = "호메로스가 위치를 말하지 않는다. 뒷시대는 몰타 옆 고조 섬 등으로 봤지만 근거가 약해 실좌표를 주지 않는다."
sources = ["homer.odyssey 1.48-59", "homer.odyssey 5.55-75", "homer.odyssey 12.447-453", "apollodorus.library E.7.23-E.7.24"]

[[place]]
id = "kyklopes-land"
name_ko = "키클로페스의 땅"
aka = ["외눈 거인들의 땅", "폴리페모스의 땅", "키클롭스의 땅"]
kind = "mythic"
layer = "edge"
cx = 0.05
cy = 0.31
oneliner = "법도 모임도 없이 동굴에 사는 외눈 거인들의 땅."
body = """
외눈 거인 키클로페스가 산꼭대기 동굴에 흩어져 사는 땅이다.
씨를 뿌리지 않아도 곡식과 포도가 저절로 자랐다.
법도 없고 함께 모이는 일도 없이 저마다 제 식구만 다스렸다.
앞바다의 작은 섬에는 사람 대신 산양만 살았다.
폴리페모스의 동굴이 바닷가에 있었다.
"""
fun = "태초에 우라노스가 낳은 세 키클롭스와는 다른 무리다. 이름만 같다."
note = "뒷시대는 시칠리아 에트나 산 아래로 봤다(오비디우스 13~14권도 그렇다). 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 9.105-192", "apollodorus.library E.7.4"]

[[place]]
id = "aiolia"
name_ko = "아이올리아"
name_grc = "Aiolia"
aka = ["아이올로스의 섬", "바람의 섬"]
kind = "mythic"
layer = "sea"
cx = 0.05
cy = 0.35
oneliner = "청동 벽으로 둘러싸인, 바다 위에 떠다니는 아이올로스의 섬."
body = """
바다 위에 떠다니는 섬이다.
둘레를 부서지지 않는 청동 벽이 감싸고, 그 아래는 미끈한 바위 절벽이다.
아이올로스가 열두 자식과 잔치를 벌이며 살았다.
오디세우스는 여기서 바람 주머니를 받아 떠났다가 다시 떠밀려 왔다.
"""
note = "뒷시대는 시칠리아 북쪽의 리파리(에올리에) 섬들이라 했고 지금도 그 이름을 쓴다. 호메로스는 떠다니는 섬이라 하므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 10.1-12", "homer.odyssey 10.46-76", "apollodorus.library E.7.10"]

[[place]]
id = "laistrygonia"
name_ko = "라이스트리고네스의 땅"
aka = ["텔레필로스", "라이스트리곤의 땅"]
kind = "mythic"
layer = "edge"
cx = 0.05
cy = 0.46
oneliner = "거인 무리가 사는 땅. 오디세우스의 배 열한 척이 여기서 부서졌다."
body = """
높은 성 텔레필로스가 있는 땅이다.
밤이 아주 짧아, 양치기가 들어오면서 소치기가 나가며 인사했다.
좁은 항구는 양쪽이 절벽이고 물이 늘 잔잔했다.
동료들은 배를 다 그 안에 넣었지만 오디세우스는 밖에 대어 두었다.
그래서 오디세우스의 배 한 척만 살아 나왔다.
"""
note = "뒷시대는 시칠리아나 이탈리아 남부 포르미아라 했다. 밤이 짧다는 말 때문에 먼 북쪽으로 보는 이들도 있다. 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 10.80-132", "apollodorus.library E.7.12"]

# ---------- 동쪽 끝 (cx 0.95) ----------

[[place]]
id = "lotophagoi-land"
name_ko = "로토파고이의 땅"
aka = ["연꽃 먹는 사람들의 땅", "로토스의 땅"]
kind = "mythic"
layer = "edge"
cx = 0.95
cy = 0.26
oneliner = "먹으면 집을 잊는 열매가 자라는 땅."
body = """
말레아 곶에서 거센 바람에 아홉 날을 밀려간 끝에 닿은 땅이다.
여기 사람들은 꽃 열매를 먹고 살았고 낯선 사람을 해치지 않았다.
그 열매를 먹은 오디세우스의 동료들은 돌아가기를 잊었다.
"""
note = "뒷시대는 북아프리카 리비아 해안이나 제르바 섬으로 봤다. 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 9.80-104", "apollodorus.library E.7.3"]

[[place]]
id = "aiaia"
name_ko = "아이아이아"
name_grc = "Aiaia"
aka = ["아이아이에", "키르케의 섬"]
kind = "mythic"
layer = "sea"
cx = 0.95
cy = 0.31
oneliner = "키르케가 사는 섬. 새벽이 시작되는 동쪽에 있다고 했다."
body = """
키르케의 돌집이 숲 한가운데 있는 섬이다.
호메로스는 새벽의 여신이 사는 곳, 해가 뜨는 쪽에 있다고 했다.
오디세우스와 동료들은 여기서 한 해를 머물렀다.
죽은 사람들의 땅에 갔다가 다시 이 섬으로 돌아와 엘페노르를 묻었다.
"""
note = "뒷시대(로마)는 이탈리아 서쪽 해안의 몬테 치르체오(키르케의 산)라고 했다. 호메로스는 동쪽이라 하므로 맞지 않아 실좌표를 주지 않는다."
sources = ["homer.odyssey 10.133-139", "homer.odyssey 12.1-15", "apollodorus.library E.7.14"]

[[place]]
id = "seirenes-island"
name_ko = "세이레네스의 섬"
aka = ["세이렌의 섬", "사이렌의 섬"]
kind = "mythic"
layer = "sea"
cx = 0.95
cy = 0.36
oneliner = "노래하는 자매가 앉아 있는 풀밭 섬. 둘레에 뼈가 쌓여 있다."
body = """
세이레네스가 꽃이 핀 풀밭에 앉아 노래하는 섬이다.
둘레에는 노래를 듣고 죽은 사람들의 뼈가 쌓여 있었다.
배가 가까이 오면 바람이 뚝 멈추고 바다가 잔잔해졌다.
그래서 동료들은 노를 저어 지나가야 했다.
"""
note = "뒷시대는 나폴리 남쪽 시레누사이(리 갈리) 섬들이라 했다. 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 12.39-54", "homer.odyssey 12.165-200"]

[[place]]
id = "skylla-strait"
name_ko = "스킬라와 카리브디스의 바다"
aka = ["스킬라의 바위", "카리브디스의 소용돌이", "두 바위 사이"]
kind = "mythic"
layer = "sea"
cx = 0.95
cy = 0.41
oneliner = "두 바위 사이 좁은 물길. 한쪽엔 스킬라, 한쪽엔 카리브디스."
body = """
두 바위가 마주 선 좁은 물길이다.
높은 바위 굴에는 스킬라가, 낮은 바위 아래에는 카리브디스가 있다.
두 바위 사이는 활을 한 번 쏘아 닿을 거리밖에 안 된다.
어느 쪽으로 붙어도 사람을 잃게 된다.
오디세우스는 이곳을 두 번 지났다.
"""
note = "뒷시대는 이탈리아와 시칠리아 사이 메시나 해협이라 했다. 그곳에 실제 소용돌이가 있다. 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 12.73-110", "homer.odyssey 12.234-259", "homer.odyssey 12.426-446", "apollodorus.library E.7.20-E.7.21"]

[[place]]
id = "thrinakia"
name_ko = "트리나키아"
name_grc = "Thrinakia"
aka = ["헬리오스의 섬", "트리나크리아"]
kind = "mythic"
layer = "sea"
cx = 0.95
cy = 0.46
oneliner = "헬리오스의 소와 양이 풀을 뜯는 섬."
body = """
해의 신 헬리오스의 소 일곱 무리와 양 일곱 무리가 사는 섬이다.
헬리오스의 두 딸 파에투사와 람페티에가 짐승들을 지켰다.
그 짐승은 새끼를 낳지도 죽지도 않았다.
오디세우스의 배는 한 달 동안 남풍에 붙잡혀 여기서 떠나지 못했다.
"""
note = "뒷시대는 세 모서리의 섬이라는 뜻의 트리나크리아, 곧 시칠리아라고 했다. 호메로스는 어디라고 하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 12.127-141", "homer.odyssey 12.260-402", "apollodorus.library E.7.22"]

[[place]]
id = "scheria"
name_ko = "스케리아"
name_grc = "Scheria"
aka = ["파이아케스의 땅", "파이아키아", "파이아케스 왕국"]
kind = "mythic"
layer = "sea"
cx = 0.95
cy = 0.52
oneliner = "알키노오스 왕이 다스리는 파이아케스 사람들의 나라."
body = """
파이아케스 사람들이 사는 땅이다.
옛 왕 나우시토오스가 키클로페스에게서 멀리 떠나 이곳에 백성을 옮겨 왔다.
다른 사람들과 멀리 떨어져 있어 낯선 사람이 오는 일이 거의 없었다.
이곳 배는 사공 없이 생각만으로 어디든 갔다.
오디세우스를 데려다 준 배는 돌아오는 길에 포세이돈이 돌로 만들었다.
"""
note = "뒷시대는 코르푸(케르키라) 섬이라고 했다. 호메로스는 어디라고 말하지 않으므로 실좌표를 주지 않는다."
sources = ["homer.odyssey 6.1-12", "homer.odyssey 8.555-563", "homer.odyssey 13.159-187", "apollodorus.library E.7.25"]
