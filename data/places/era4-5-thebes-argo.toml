# era 4~5 — 테베와 아르고호 이야기의 장소. 실제로 있는 곳 8, 이야기 속의 곳 1(심플레가데스).
# 집필: THE(테베·아르고호). 아폴로도로스가 뼈대, 파우사니아스·오비디우스가 살.

[[place]]
id = "thebes"
name_ko = "테베"
name_grc = "Thebai"
aka = ["테바이", "카드메이아", "일곱 문의 테베"]
kind = "real"
lat = 38.3192
lon = 23.3178
modern = "그리스 티바"
oneliner = "카드모스가 암소가 누운 자리에 세운 도시. 오이디푸스의 도시다."
body = """
카드모스가 델포이의 말대로 암소를 따라와 세웠다.
성 안쪽 언덕은 카드모스의 이름을 따 카드메이아라고 불렀다.
성문이 일곱이어서 '일곱 문의 테베'라고도 한다.
스핑크스, 오이디푸스, 안티고네의 이야기가 모두 여기서 벌어진다.
"""
fun = "테베 사람들은 하르모니아와 세멜레의 신방 자리를 오래도록 보여 주었다. 세멜레의 방에는 남자가 들어갈 수 없었다."
note = "참고: 처음 읽는 그리스 로마 신화 9권 2장·부록."
sources = ["apollodorus.library 3.4.1-3.4.2", "apollodorus.library 3.6.6", "pausanias.greece 9.5", "pausanias.greece 9.12"]

[[place]]
id = "iolkos"
name_ko = "이올코스"
name_grc = "Iolkos"
aka = ["이올코스 항", "이올쿠스"]
kind = "real"
lat = 39.3667
lon = 22.9500
modern = "그리스 볼로스"
oneliner = "아르고호가 떠나고 돌아온 항구. 펠리아스의 나라다."
body = """
테살리아 바닷가의 도시로, 크레테우스가 세웠다.
펠리아스가 왕이었고 이아손이 여기서 자랐다.
아르고호는 이 앞바다에서 떠났다.
넉 달 뒤 황금 양털을 싣고 여기로 돌아왔다.
"""
note = "참고: 처음 읽는 그리스 로마 신화 9권 3장."
sources = ["apollodorus.library 1.9.11", "apollodorus.library 1.9.16", "apollodorus.library 1.9.26-1.9.27", "hesiod.theogony 992-1002"]

[[place]]
id = "kolchis"
name_ko = "콜키스"
name_grc = "Kolchis"
aka = ["콜히스", "아이아"]
kind = "real"
lat = 42.2679
lon = 42.6946
modern = "조지아 서부, 리오니 강 유역(쿠타이시 부근)"
oneliner = "황금 양털이 걸려 있던 동쪽 끝의 나라. 아이에테스의 나라다."
body = """
흑해의 동쪽 끝, 파시스 강이 흐르는 땅이다.
프릭소스가 황금 양을 타고 날아와 닿은 곳이다.
아이에테스가 양털을 아레스의 숲 참나무에 걸어 두었다.
아르고호는 심플레가데스를 지나 이 강까지 왔다.
"""
fun = "그리스 사람들에게 콜키스는 해가 뜨는 쪽 끝이었다. 왕 아이에테스는 해의 신 헬리오스의 아들이다."
note = "아폴로도로스 1.9.23 은 파시스 강(지금의 리오니 강)이 콜키스 땅에 있다고 한다. 도시 하나가 아니라 나라여서 강 유역 안쪽을 좌표로 잡았다. 참고: 처음 읽는 그리스 로마 신화 9권 3장 「콜키스의 황금 양털」."
sources = ["apollodorus.library 1.9.1", "apollodorus.library 1.9.23", "hesiod.theogony 956-962"]

[[place]]
id = "lemnos"
name_ko = "렘노스 섬"
name_grc = "Lemnos"
aka = ["림노스"]
kind = "real"
lat = 39.8775
lon = 25.0619
modern = "그리스 림노스 섬"
oneliner = "아르고호가 처음 닿은 섬. 그때는 여자들만 살고 있었다."
body = """
에게해 북쪽의 섬이다.
아르고호 원정대가 이올코스를 떠나 처음 배를 댄 곳이다.
그때 섬에는 남자가 없고 여왕 힙시필레가 다스리고 있었다.
원정대는 여기서 한동안 머물다 떠났다.
"""
sensitivity = "soften"
sources = ["apollodorus.library 1.9.17"]

[[place]]
id = "symplegades"
name_ko = "심플레가데스"
name_grc = "Symplegades"
aka = ["부딪치는 바위", "키아네아이"]
kind = "mythic"
layer = "edge"
cx = 0.94
cy = 0.36
oneliner = "서로 부딪쳐 배를 부수던 두 바위. 아르고호가 지나간 뒤 멈추었다."
body = """
바다 한가운데 큰 바위 둘이 바람에 밀려 서로 부딪쳤다.
안개가 짙고 소리가 커서 새도 지나가지 못했다.
아르고호는 비둘기를 먼저 날려 보고, 바위가 벌어진 틈으로 지났다.
배가 한 번 지나가면 멈추기로 되어 있었다.
그 뒤로는 움직이지 않는다.
"""
fun = "호메로스가 오디세우스에게 들려준 '떠도는 바위'도 아르고호만 지나갔다고 한다."
note = "후대는 보스포로스 해협 입구의 바위(키아네아이)와 같은 곳으로 보았다. 실제 위치를 주면 아이에게 거짓이 되므로 mythic/edge 로 둔다. 호메로스 12.59-72 의 '떠도는 바위(플랑크타이)'와 같은지도 다투어진다."
sources = ["apollodorus.library 1.9.22", "homer.odyssey 12.59-72"]

[[place]]
id = "mt-pelion"
name_ko = "펠리온 산"
name_grc = "Pelion"
kind = "real"
lat = 39.4400
lon = 23.0500
modern = "그리스 테살리아 펠리온 산, 높이 1624m"
oneliner = "이올코스 뒤에 솟은 산. 케이론이 살던 곳이다."
body = """
이올코스 바로 뒤에 솟은, 숲이 짙은 산이다.
켄타우로스 케이론이 이 산에 살았다.
아르고호는 '파가사이의 배'라고 불렸다. 파가사이는 이 산 아래 바닷가다.
메데이아는 하늘을 날아 코린토스로 갈 때 이 산 위를 지났다.
"""
note = "케이론(HER cheiron)은 body 에서 이름만 부른다."
sources = ["ovid.metamorphoses 7.1-2", "ovid.metamorphoses 7.350-352"]

[[place]]
id = "thrake"
name_ko = "트라키아"
name_grc = "Thrake"
aka = ["트라케", "트라키아 지방"]
kind = "real"
lat = 41.5000
lon = 25.5000
modern = "그리스 북동부·불가리아 남부·튀르키예 유럽 쪽에 걸친 트라키아 지방"
oneliner = "그리스 북쪽의 넓은 땅. 오르페우스와 피네우스의 고향이다."
body = """
그리스 북쪽, 에게해와 흑해 사이에 있는 넓은 지방이다.
카드모스가 누이를 찾다가 어머니와 함께 한동안 머물렀다.
눈먼 피네우스가 이 땅의 바닷가에 살았다.
오르페우스가 여기서 노래했고, 에우리디케를 잃은 뒤 이 산들로 돌아왔다.
"""
note = "도시가 아니라 지방이라 가운데쯤을 좌표로 잡았다."
sources = ["apollodorus.library 3.1.1", "apollodorus.library 1.9.21", "ovid.metamorphoses 10.1-85"]

[[place]]
id = "mt-kithairon"
name_ko = "키타이론 산"
name_grc = "Kithairon"
aka = ["키테론 산"]
kind = "real"
lat = 38.1833
lon = 23.2500
modern = "그리스 보이오티아 키타이론 산(엘라타스), 높이 1409m"
oneliner = "테베 남쪽의 산. 악타이온이 죽고 아기 오이디푸스가 버려진 곳이다."
body = """
테베 남쪽에 길게 누운 산이다.
악타이온이 사슴이 되어 자기 개들에게 죽은 곳이다.
라이오스의 하인이 아기 오이디푸스를 이 산에 버렸다.
코린토스 왕의 소치기들이 아기를 찾아냈다.
"""
sensitivity = "soften"
sources = ["apollodorus.library 3.4.4", "apollodorus.library 3.5.7"]

[[place]]
id = "kios"
name_ko = "미시아의 키오스"
name_grc = "Kios"
aka = ["키오스(미시아)", "키우스"]
kind = "real"
lat = 40.4300
lon = 29.1567
modern = "튀르키예 겜리크"
oneliner = "힐라스가 사라지고 헤라클레스가 남겨진 미시아 바닷가."
body = """
바다 건너 미시아 땅의 바닷가다. 섬 키오스와는 다른 곳이다.
아르고호가 여기 배를 댔을 때 힐라스가 물을 뜨러 갔다가 사라졌다.
헤라클레스와 폴리페모스가 힐라스를 찾는 사이 배가 떠났다.
남겨진 폴리페모스가 여기에 키오스라는 도시를 세웠다.
"""
note = "이 폴리페모스는 아르고호 원정대의 폴리페모스(엘라토스의 아들)로, 오디세이아의 외눈 거인(ODY polyphemos)과 다른 사람이다. 그래서 cast 에 넣지 않고 이름만 부른다."
sources = ["apollodorus.library 1.9.18-1.9.19"]
