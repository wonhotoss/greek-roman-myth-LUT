[[arc]]
id = "road-to-troy"
name_ko = "트로이로 가는 길"
era = 5
oneliner = "결혼 잔치의 사과 하나가 천 척의 배를 띄우기까지."
body = """
사람과 님프의 결혼 잔치에서 시작한다.
세 여신이 사과를 다투고, 파리스가 아프로디테를 고른다.
그 상으로 받은 헬레네 때문에 그리스의 왕들이 옛 맹세대로 모인다.
아울리스에서 배가 뜨고, 아홉 해를 트로이 앞에서 싸운다.
"""
events = [
  "leda-swan",
  "peleus-thetis-wedding",
  "achilleus-childhood",
  "paris-born",
  "kassandra-apollon",
  "helene-suitors",
  "paris-judgment",
  "helene-taken",
  "greeks-muster",
  "achilleus-skyros",
  "aulis-omen",
  "iphigeneia-aulis",
  "tenedos-philoktetes",
  "troy-landing-nine-years",
]
note = "참고: 처음 읽는 그리스 로마 신화 11권 「파리스의 선택」 1~2장, 2권 4장 「예언자 카산드라」"
sources = ["apollodorus.library 3.10.7-3.10.9", "apollodorus.library 3.12.5", "apollodorus.library 3.13.5-3.13.8", "apollodorus.library E.3.1-E.3.35"]

[[arc]]
id = "wrath-of-achilleus"
name_ko = "아킬레우스의 분노"
era = 6
oneliner = "열째 해의 몇 주. 한 사람의 화가 전쟁 전체를 흔든다."
body = """
아가멤논이 아킬레우스의 브리세이스를 빼앗는다.
아킬레우스는 싸움에서 손을 떼고, 그리스군은 배까지 밀린다.
파트로클로스가 친구의 갑옷을 입고 나가 죽는다.
아킬레우스가 돌아와 헥토르를 죽이고, 늙은 프리아모스가 아들을 찾아온다.
호메로스의 일리아스가 바로 이 이야기다.
"""
events = [
  "chryses-plague",
  "achilleus-agamemnon-quarrel",
  "thetis-pleads-zeus",
