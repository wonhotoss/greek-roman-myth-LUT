# 묶음 서사. 여러 사건이 하나의 이야기로 읽히는 단위.
# events 는 이야기 순서. era/seq 정렬과 다를 수 있다(회상·삽입).

[[arc]]
id = "creation"
name_ko = "세상이 만들어지고 왕이 세 번 바뀌다"
era = 0
oneliner = "카오스에서 시작해 제우스가 자리를 잡기까지."
body = """
같은 일이 세 번 반복된다.
아버지가 자식을 무서워해 가두거나 삼키고, 그 자식이 아버지를 밀어낸다.
우라노스에서 크로노스로, 크로노스에서 제우스로.
제우스는 이 되풀이를 끊으려고 메티스의 아이를 자기 머리에서 낳는다.
"""
events = [
  "beginning",
  "ouranos-imprisons",
  "kronos-takes-throne",
  "kronos-swallows",
  "zeus-hidden",
  "zeus-frees-siblings",
  "titanomachy",
  "division-of-world",
  "athena-born",
]
sources = ["hesiod.theogony 116-900", "apollodorus.library 1.1.1-1.3.6"]

[[arc]]
id = "olympus-defended"
name_ko = "올림포스를 지키다"
era = 2
oneliner = "가이아가 두 번 더 도전하고, 두 번 다 진다."
body = """
티탄들이 갇힌 뒤에도 가이아는 포기하지 않았다.
먼저 거인 무리를 낳아 올림포스로 보냈다.
그 뒤에는 티폰이라는 가장 큰 괴물을 낳았다.
둘 다 졌고, 그 뒤로 올림포스는 흔들리지 않는다.
"""
events = ["gigantomachy", "typhonomachy"]
sources = ["apollodorus.library 1.6.1-1.6.3"]

[[arc]]
id = "prometheus-fire"
name_ko = "프로메테우스와 사람의 시작"
era = 3
oneliner = "불 하나 때문에 사람에게 기술과 걱정이 함께 왔다."
body = """
프로메테우스가 불을 훔쳐 사람에게 준다.
제우스는 판도라를 만들어 갚는다.
프로메테우스는 산에 묶여 오래 벌을 받는다.
사람은 불로 무엇이든 만들 수 있게 되었지만, 걱정도 함께 얻었다.
"""
events = ["fire-stolen", "pandora-jar", "prometheus-punished"]
sources = ["hesiod.works 42-105", "hesiod.theogony 507-616"]

[[arc]]
id = "seasons"
name_ko = "계절이 생기다"
era = 2
oneliner = "딸이 저승과 땅 위를 오가면서 겨울과 봄이 생겼다."
body = """
페르세포네가 저승으로 끌려가고, 데메테르가 세상을 멈춘다.
완전히 돌아올 수도, 완전히 남을 수도 없게 된다.
그 왕복이 해마다 되풀이되는 것이 계절이다.
"""
events = ["persephone-taken"]
sources = ["apollodorus.library 1.5.1-1.5.3"]

[[arc]]
id = "perseus-journey"
name_ko = "페르세우스의 여행"
era = 4
oneliner = "피하려 한 말이 그대로 이루어지는 이야기."
body = """
아크리시오스가 델포이에서 들은 말 하나로 시작한다.
그 말을 피하려고 한 모든 일이 오히려 그 말을 이루는 쪽으로 이어진다.
페르세우스는 힘이 아니라 빌린 도구와 거울로 이긴다.
마지막에 원반 하나가 빗나가면서 처음의 말이 이루어진다.
"""
events = [
  "akrisios-oracle",
  "danae-set-adrift",
  "polydektes-demands",
  "graiai-road",
  "medusa-slain",
  "andromeda-rescued",
  "return-to-seriphos",
  "akrisios-dies",
  "mycenae-founded",
]
sources = ["apollodorus.library 2.4.1-2.4.5"]

# ---- AEN ----
# era 7 — 아이네이스. AEN 의 묶음서사 둘. data/arcs.toml 에 합칠 것.

[[arc]]
id = "aineias-voyage"
name_ko = "아이네이아스의 바다 여행"
era = 7
oneliner = "불타는 트로이에서 저승까지, 새 땅을 찾아 떠도는 이야기."
body = """
아이네이아스는 아버지를 업고 트로이를 떠난다.
신의 말을 잘못 알아듣고, 괴물을 만나고, 아버지를 잃는다.
헤라의 폭풍이 그를 카르타고로 밀고, 거기서 디도를 만나고 또 떠난다.
마지막에 시빌레와 저승에 내려가 앞날의 로마를 본다.
"""
events = [
  "anchises-star-sign",
  "aineias-leaves-troy",
  "thrake-polydoros",
  "delos-oracle",
  "crete-plague",
  "strophades-harpies",
  "buthrotum-helenos",
  "kyklops-akhaimenides",
  "anchises-dies",
  "hera-storm",
  "carthage-dido-meets",
  "dido-falls-in-love",
  "aineias-leaves-carthage",
  "dido-dies",
  "palinouros-falls",
  "sibylla-golden-bough",
  "aineias-underworld",
]
sources = ["virgil.aeneid 1.1-6.901", "apollodorus.library E.5.21", "ovid.metamorphoses 13.623-14.153"]
note = "참고: 처음 읽는 그리스 로마 신화 15권 「트로이의 마지막 불꽃」 1~4장. 이야기 순서는 아이네이아스가 겪은 순서(2·3권 → 1권 → 4~6권)로 두었다."

[[arc]]
id = "aineias-latium"
name_ko = "라티움의 싸움과 라비니움"
era = 7
oneliner = "약속된 땅에 닿았지만 싸움을 한 번 더 치러야 했다."
body = """
아이네이아스는 마침내 테베레 강에 닿고, 라티누스는 딸을 주겠다고 한다.
헤라가 복수의 여신을 보내 투르누스를 일으키고, 긴 싸움이 벌어진다.
팔라스와 카밀라가 죽고, 마지막에 투르누스가 죽는다.
아이네이아스는 라비니움을 세우고, 죽은 뒤 신으로 모셔진다.
"""
events = [
  "latium-arrival",
  "hera-rouses-turnus",
  "evandros-pallas",
  "nisos-euryalos",
  "pallas-dies",
  "kamilla-dies",
  "turnus-dies",
  "lavinium-founded",
  "aineias-becomes-god",
]
sources = ["virgil.aeneid 7.1-12.952", "livy.rome 1.1-1.2", "ovid.metamorphoses 14.581-14.608"]
note = "처음 읽는 그리스 로마 신화에는 없는 부분(책은 6권에서 끝난다). era 8 의 alba-longa-founded 로 이어진다."

# ---- ATH ----
# ATH — 아테네·크레타 묶음서사. data/arcs.toml 에 합칠 것.
# 시시포스·익시온은 묶음 없이 둔다.

[[arc]]
id = "europa-minos"
name_ko = "에우로페에서 미로까지"
era = 4
oneliner = "황소 하나로 시작해 황소 머리 아이와 미로로 끝나는 이야기."
body = """
제우스가 흰 황소가 되어 에우로페를 크레타로 데려간다.
그 아들 미노스는 바다에서 황소를 불러 왕이 된다.
그 황소를 바치지 않아 포세이돈이 벌을 내린다.
파시파에가 머리가 황소인 아이를 낳는다.
다이달로스가 그 아이를 가둘 미로를 짓는다.
"""
events = [
  "europa-carried-to-crete",
  "minos-becomes-king",
  "poseidon-bull-pasiphae",
  "minotauros-born-labyrinth",
]
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 6권 4장 「슬픈 운명의 미노타우로스」"
sources = ["apollodorus.library 3.1.1-3.1.4", "apollodorus.library 3.15.8", "ovid.metamorphoses 2.833-2.875", "ovid.metamorphoses 8.152-8.168"]

[[arc]]
id = "theseus-journey"
name_ko = "테세우스의 길"
era = 5
oneliner = "바위 밑의 검에서 저승의 의자까지."
body = """
아이게우스가 트로이젠에 검을 숨기고 간 데서 시작한다.
자란 테세우스가 걸어서 아테네로 가며 길의 악당들을 없앤다.
크레타의 미로에서 미노타우로스를 이긴다.
돛을 바꾸는 것을 잊어 아버지를 잃는다.
왕이 된 뒤 친구 페이리토오스와 저승까지 내려간다.
"""
events = [
  "aigeus-troizen",
  "androgeos-dies-tribute",
  "theseus-lifts-rock",
  "theseus-road-isthmus",
  "theseus-road-attica",
  "medeia-plot-marathon-bull",
  "aigeus-recognizes-theseus",
  "black-sail-departure",
  "minotauros-slain",
  "ariadne-naxos",
  "aigeus-dies",
  "theseus-becomes-king",
  "centaur-wedding",
  "phaidra-hippolytos",
  "theseus-hades",
]
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 9권 4장 「크레타를 구한 테세우스」, 6권 4장 「괴물을 물리친 테세우스」"
sources = ["apollodorus.library 3.15.6-3.16.2", "apollodorus.library E.1.1-E.1.24", "ovid.metamorphoses 7.404-7.452", "ovid.metamorphoses 8.169-8.182", "pausanias.greece 1.22.5", "pausanias.greece 1.27.7-1.27.10"]

[[arc]]
id = "daidalos-ikaros"
name_ko = "다이달로스와 이카로스"
era = 5
oneliner = "미로를 지은 사람이 하늘로 달아나고, 아들을 잃는다."
body = """
테세우스를 도운 값으로 다이달로스는 자기가 지은 미로에 갇힌다.
날개를 만들어 아들과 함께 날아가지만, 이카로스는 너무 높이 오른다.
다이달로스는 시켈리아까지 가서 숨는다.
뒤쫓아 온 미노스는 그곳에서 죽는다.
"""
events = [
  "daidalos-ikaros-wings",
  "daidalos-sikelia",
]
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 10권 4장 「천재 발명가 다이달로스」. 미로를 지은 사건은 europa-minos 에 든다(한 사건은 한 묶음)."
sources = ["apollodorus.library E.1.12-E.1.15", "ovid.metamorphoses 8.183-8.235", "pausanias.greece 7.4.6"]

[[arc]]
id = "bellerophon-flight"
name_ko = "벨레로폰과 페가수스"
era = 4
oneliner = "날개 달린 말을 타고 이긴 영웅이 마지막에는 홀로 남는다."
body = """
아테나가 페가수스를 길들여 벨레로폰에게 준다.
거짓말과 편지 한 장이 그를 리키아의 왕 앞에 세운다.
왕이 시킨 일을 모두 해내고 키마이라도 이긴다.
그러나 뒤에 신들의 미움을 받아 들판을 혼자 떠돈다.
"""
events = [
  "pegasos-tamed",
  "proitos-sends-bellerophon",
  "iobates-tasks",
  "chimaira-slain",
  "bellerophon-end",
]
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 9권 1장 「벨레로폰」"
sources = ["apollodorus.library 2.3.1-2.3.2", "homer.iliad 6.152-6.202", "pausanias.greece 2.4.1", "hesiod.theogony 319-325"]

# ---- HER ----
# era 5 — 헤라클레스 묶음서사 셋 (HER). data/arcs.toml 에 합칠 것.
# 한 사건은 한 묶음에만 든다.

[[arc]]
id = "herakles-early"
name_ko = "헤라클레스의 탄생과 헤라의 미움"
era = 5
oneliner = "태어나기 전부터 미움을 받은 아이가 델포이에서 일을 받기까지."
body = """
제우스가 알크메네를 찾아온 밤에서 시작한다.
헤라는 아기가 태어나기도 전에 왕 자리를 빼앗고, 요람에 뱀을 보낸다.
자라서 테베를 지킨 헤라클레스는 헤라가 보낸 광기에 아이들을 잃는다.
델포이의 말은 에우리스테우스를 섬기며 열 가지 일을 하라는 것이었다.
"""
events = [
  "amphitryon-to-thebes",
  "zeus-visits-alkmene",
  "hera-delays-birth",
  "herakles-born",
  "herakles-cradle-snakes",
  "herakles-taught",
  "herakles-weds-megara",
  "herakles-madness",
  "herakles-delphi-oracle",
]
note = "참고: 처음 읽는 그리스 로마 신화 2권 1장, 8권 1장"
sources = ["apollodorus.library 2.4.5-2.4.12", "homer.iliad 19.95-133"]

[[arc]]
id = "herakles-labors"
name_ko = "헤라클레스의 열두 가지 일"
era = 5
oneliner = "사자에서 저승의 개까지, 갈수록 멀고 갈수록 큰 일."
body = """
처음에는 미케네 근처의 괴물이었다.
일이 하나씩 끝날수록 헤라클레스는 더 멀리 간다.
크레타, 트라케, 흑해, 세상의 서쪽 끝, 마지막에는 저승까지.
에우리스테우스가 둘을 세어 주지 않아 열 가지가 열두 가지가 되었다.
가는 길에 프로메테우스를 풀어 주고 테세우스를 저승에서 데려온다.
"""
events = [
  "nemean-lion-slain",
  "lernaean-hydra-slain",
  "keryneian-hind",
  "pholos-and-kentauroi",
  "erymanthian-boar",
  "augeias-stables",
  "stymphalian-birds",
  "cretan-bull-captured",
  "diomedes-mares",
  "hippolyte-belt",
  "hesione-rescued",
  "geryon-cattle",
  "antaios-wrestled",
  "prometheus-freed",
  "hesperides-apples",
  "kerberos-fetched",
]
note = "참고: 처음 읽는 그리스 로마 신화 8권 2장"
sources = ["apollodorus.library 2.5.1-2.5.12", "hesiod.theogony 287-332", "hesiod.theogony 521-534"]

[[arc]]
id = "herakles-last"
name_ko = "헤라클레스의 마지막과 신이 되다"
era = 5
oneliner = "히드라의 독이 돌아와 헤라클레스를 태우고, 불 속에서 신이 된다."
body = """
활쏘기 내기 하나에서 모든 것이 이어진다.
이올레를 얻지 못한 일이 이피토스의 죽음과 종살이로 이어진다.
데이아네이라를 얻은 일이 네소스의 피로 이어진다.
그 피에는 오래전 헤라클레스가 화살에 바른 히드라의 독이 있었다.
마지막에 델포이의 말대로 죽지 않는 몸이 된다.
"""
events = [
  "eurytos-archery-contest",
  "iphitos-killed",
  "omphale-service",
  "herakles-sacks-troy",
  "olympic-games-founded",
  "deianeira-won",
  "nessos-slain",
  "oichalia-taken",
  "poisoned-robe",
  "herakles-pyre",
  "herakles-apotheosis",
]
note = "참고: 처음 읽는 그리스 로마 신화 8권 3장·4장"
sources = ["apollodorus.library 2.6.1-2.7.7", "ovid.metamorphoses 9.1-272"]

# ---- ODY ----
# era 7 — 돌아오는 길. ODY 의 묶음서사 넷. data/arcs.toml 에 합칠 것.
# 한 사건은 한 묶음에만 들어 있다.

[[arc]]
id = "oresteia"
name_ko = "아가멤논의 죽음과 오레스테스"
era = 7
oneliner = "돌아온 왕이 죽고, 아들이 원수를 갚고, 그 아들이 재판을 받는다."
body = """
트로이에서 돌아온 아가멤논을 아내와 아이기스토스가 죽인다.
어린 아들 오레스테스는 누이 손에 몰래 빠져나가 먼 나라에서 자란다.
여덟 해 뒤 돌아와 원수를 갚지만, 어머니도 죽인다.
에리니에스가 쫓아오고, 아테네의 재판에서 표가 같아 풀려난다.
마지막에 죽은 줄 알았던 누이 이피게네이아를 먼 나라에서 만난다.
"""
events = [
  "agamemnon-murdered",
  "orestes-sent-away",
  "orestes-revenge",
  "orestes-trial",
  "orestes-tauris",
]
sources = ["apollodorus.library E.6.23-E.6.28", "homer.odyssey 3.253-312", "pausanias.greece 1.28"]

[[arc]]
id = "odysseus-wanderings"
name_ko = "오디세우스의 떠돌이"
era = 7
oneliner = "배 열두 척으로 떠나 혼자 뗏목을 타고 닿기까지 열 해."
body = """
트로이를 떠난 오디세우스는 집까지 열 해가 걸린다.
거인과 마법사와 괴물을 지날 때마다 동료가 줄어든다.
폴리페모스의 눈 하나 때문에 포세이돈이 끝까지 오디세우스를 막는다.
마지막에는 혼자 칼립소의 섬에서 일곱 해를 보낸다.
아테나가 신들을 움직여 겨우 뗏목 하나로 파이아케스의 땅에 닿는다.
"""
events = [
  "kikones-maron",
  "lotophagoi-visit",
  "polyphemos-cave",
  "polyphemos-escape",
  "aiolos-winds",
  "laistrygones-attack",
  "kirke-pigs",
  "kirke-year",
  "land-of-the-dead",
  "seirenes-song",
  "skylla-charybdis",
  "thrinakia-cattle",
  "ship-destroyed",
  "kalypso-years",
  "gods-council-hermes",
  "raft-and-storm",
  "nausikaa-meets",
  "alkinoos-feast",
]
sources = ["homer.odyssey 5.1-13.92", "apollodorus.library E.7.1-E.7.25"]

[[arc]]
id = "telemachos-journey"
name_ko = "텔레마코스의 여정"
era = 7
oneliner = "아버지를 기다리던 아들이 아버지를 찾아 나선다."
body = """
오디세우스가 없는 스무 해 동안 이타케에는 구혼자들이 몰려온다.
페넬로페는 베짜기 꾀로 세 해를 버틴다.
아테나가 텔레마코스를 찾아와 아버지 소식을 찾으러 가라고 한다.
필로스의 네스토르와 스파르타의 메넬라오스가 옛 이야기를 들려준다.
아버지가 살아 있다는 말만 듣고 텔레마코스는 구혼자들의 덫을 피해 돌아온다.
"""
events = [
  "penelope-web-trick",
  "athena-visits-telemachos",
  "telemachos-at-pylos",
  "telemachos-at-sparta",
  "telemachos-returns",
]
sources = ["homer.odyssey 1.96-4.847", "homer.odyssey 15.1-557"]

[[arc]]
id = "odysseus-homecoming"
name_ko = "오디세우스의 귀환"
era = 7
oneliner = "거지가 되어 자기 집에 들어간 왕이 활 하나로 집을 되찾는다."
body = """
아테나가 오디세우스를 늙은 거지로 바꾼다.
돼지치기, 아들, 개, 유모가 차례로 오디세우스를 만난다.
구혼자들은 아무도 거지를 알아보지 못한다.
활 시합에서 오디세우스가 활을 잡고, 구혼자들은 모두 죽는다.
페넬로페는 침대 이야기로 남편을 시험하고, 아테나가 마지막 싸움을 멈춘다.
"""
events = [
  "odysseus-lands-ithake",
  "eumaios-hut",
  "father-and-son-meet",
  "argos-recognizes",
  "eurykleia-scar",
  "bow-contest",
  "suitors-slain",
  "penelope-tests-bed",
  "odysseus-returns-home",
]
sources = ["homer.odyssey 13.93-24.548", "apollodorus.library E.7.26-E.7.33"]

# ---- ROM ----
# era 8 — 로마가 세워지다. ROM 의 묶음서사 셋. data/arcs.toml 에 합칠 것.
# 베르툼누스와 포모나, 피쿠스와 카넨스, 헤라클레스와 카쿠스는 묶음 없이 둔다.

[[arc]]
id = "alba-to-rome"
name_ko = "알바 롱가에서 로마까지"
era = 8
oneliner = "쫓겨난 왕의 손자들이 강에 버려지고, 살아나서 도시를 세운다."
body = """
아스카니오스가 세운 알바 롱가에 왕들이 여러 대 이어진다.
아물리우스가 형의 자리를 빼앗고 형의 딸의 아기들을 강에 버린다.
암늑대와 목동이 아기들을 살리고, 쌍둥이는 자라서 나라를 되찾는다.
그리고 자기들이 자란 언덕에 새 도시를 세우다가 형제가 갈라진다.
남은 로물루스의 이름이 도시의 이름이 된다.
"""
events = [
  "alba-longa-founded",
  "alban-kings",
  "amulius-seizes-throne",
  "twins-born",
  "twins-exposed",
  "remus-captured",
  "amulius-slain",
  "augury-of-brothers",
  "remus-dies",
  "rome-founded",
]
sensitivity = "soften"
sources = ["livy.rome 1.3-1.7", "ovid.metamorphoses 14.609-775", "virgil.aeneid 1.267-277"]

[[arc]]
id = "romulus-reign"
name_ko = "로물루스가 다스리다"
era = 8
oneliner = "사람을 모으고, 이웃과 싸우고, 하나가 되고, 신이 된다."
body = """
사람이 모자라 피난처를 열고, 아내가 없어 사비니 여인들을 데려온다.
싸움이 나고, 성채가 넘어가고, 야누스의 샘이 끓는다.
여인들이 두 군대 사이에 뛰어들어 싸움을 멈춘다.
두 민족이 하나가 되어 두 왕이 함께 다스린다.
로물루스는 폭풍 속에 사라져 신이 되고, 아내도 뒤따른다.
"""
events = [
  "asylum-and-senate",
  "sabine-women-taken",
  "caenina-wars",
  "tarpeia-betrays",
  "ianus-hot-spring",
  "battle-in-the-valley",
  "sabine-women-stop-war",
  "tatius-dies",
  "romulus-vanishes",
  "hersilia-becomes-hora",
]
sensitivity = "soften"
sources = ["livy.rome 1.8-1.16", "ovid.metamorphoses 14.775-851"]

[[arc]]
id = "numa-peace"
name_ko = "누마의 평화"
era = 8
oneliner = "싸움으로 세워진 도시를 두 번째 왕이 신과 법으로 다스린다."
body = """
로물루스가 사라진 뒤 로마는 사비니의 어진 사람 누마를 왕으로 부른다.
누마는 야누스 신전을 세우고 그 문을 닫는다.
달력을 고치고, 사제와 베스타의 처녀들을 둔다.
밤마다 님프 에게리아를 만나 신들의 뜻을 배운다고 말한다.
마흔세 해 뒤 누마가 죽자 에게리아는 울다가 샘이 된다.
"""
events = [
  "numa-chosen",
  "ianus-temple-and-calendar",
  "vestal-virgins",
  "numa-and-egeria",
  "egeria-fountain",
]
sources = ["livy.rome 1.17-1.21", "ovid.metamorphoses 15.1-8", "ovid.metamorphoses 15.479-551"]

# ---- THE ----
# THE(테베·아르고호)의 묶음 서사 8. data/arcs.toml 에 그대로 옮겨 붙이면 된다.
# 한 사건은 한 묶음에만 든다 — 아래 8개에 내 사건 39개 가운데 38개가 들어간다.
# arc id 는 figure id 와도 겹칠 수 없어 oidipous-fate·kalydon-hunt 로 두었다.
# 들어가지 않은 것: teiresias-blinded (어느 이야기에도 딸려 있지 않은 낱 사건).

[[arc]]
id = "kadmos-thebes"
name_ko = "카드모스가 테베를 세우다"
era = 4
oneliner = "누이를 찾으라는 심부름이 새 도시가 되었다."
body = """
카드모스는 누이를 찾으러 나섰다가 결국 찾지 못한다.
델포이는 누이를 잊고 암소를 따라가라고 한다.
용을 죽이고 그 이빨을 심어 얻은 사람들과 함께 성을 세운다.
찾으러 간 것은 잃고, 찾지 않은 것을 얻는 이야기다.
"""
events = [
  "kadmos-seeks-europa",
  "kadmos-follows-cow",
  "dragon-teeth-sown",
  "thebes-founded",
  "aktaion-dies",
]
sources = ["apollodorus.library 3.1.1", "apollodorus.library 3.4.1-3.4.4", "ovid.metamorphoses 3.1-252"]

[[arc]]
id = "oidipous-fate"
name_ko = "저주받은 왕자 오이디푸스"
era = 5
oneliner = "피하려고 한 모든 일이 그 말을 이루는 쪽으로 이어진다."
body = """
라이오스는 아들을 낳지 말라는 말을 듣고, 아들이 태어나자 버린다.
버려진 아들은 자기 부모가 누구인지 모르는 채 자란다.
그래서 델포이의 말을 피하려고 떠난 길이 아버지에게로 이어진다.
페르세우스 이야기와 같은 모양이다. 피하려는 행동이 그 말을 이루는 원인이 된다.
"""
events = [
  "laios-warned",
  "oidipous-asks-delphi",
  "laios-killed",
  "sphinx-riddle",
  "oidipous-becomes-king",
  "thebes-plague-truth",
  "oidipous-exiled",
]
sources = ["apollodorus.library 3.5.7-3.5.9", "homer.odyssey 11.271-280"]

[[arc]]
id = "thebes-war"
name_ko = "테베 공방전과 안티고네"
era = 5
oneliner = "아버지의 저주가 두 아들에게 그대로 이루어진다."
body = """
오이디푸스는 쫓겨날 때 아들들을 저주했다.
두 아들은 한 해씩 번갈아 다스리기로 하고, 그 약속을 깬다.
일곱 장수가 일곱 문 앞에 서고, 형제는 서로를 죽인다.
남은 것은 묻는 문제 하나다. 안티고네는 묻지 말라는 명령을 어긴다.
"""
events = [
  "brothers-quarrel",
  "seven-against-thebes",
  "brothers-kill-each-other",
  "antigone-buries-polyneikes",
]
sources = ["apollodorus.library 3.6.1-3.7.1", "pausanias.greece 9.25"]

[[arc]]
id = "argo-voyage"
name_ko = "아르고호 원정대"
era = 5
oneliner = "혼자 이기는 영웅이 아니라, 사람을 모아 이기는 영웅의 이야기."
body = """
프릭소스가 황금 양을 타고 콜키스로 간 것이 이 이야기의 시작이다.
펠리아스는 이아손이 돌아오지 못할 일을 시킨다.
이아손은 배를 짓고 그리스에서 가장 뛰어난 사람들을 모은다.
막힌 곳마다 푸는 사람이 다르다. 하르피이아이는 북풍의 아들들이, 바위는 비둘기가, 용은 메데이아가 푼다.
"""
events = [
  "phrixos-golden-ram",
  "pelias-one-sandal",
  "argo-built",
  "argo-departs",
  "lemnos-women",
  "hylas-lost",
  "phineus-harpies",
  "symplegades-dove",
  "aietes-tasks",
  "medeia-helps",
  "golden-fleece-taken",
  "apsyrtos-and-flight",
  "orpheus-outsings-seirenes",
  "talos-of-crete",
]
sources = ["apollodorus.library 1.9.1", "apollodorus.library 1.9.16-1.9.26", "ovid.metamorphoses 7.1-158"]

[[arc]]
id = "medeia-revenge"
name_ko = "메데이아"
era = 5
oneliner = "모든 것을 걸고 도운 사람이 배신당한 뒤의 이야기."
body = """
메데이아는 이아손을 돕기 위해 아버지와 나라를 버렸다.
이올코스에서는 이아손의 원수를 갚아 주고, 그 때문에 둘 다 쫓겨난다.
코린토스에서 이아손이 다른 사람과 결혼하려 하자 그대로 갚는다.
그리고 아무 벌도 받지 않고 하늘로 떠난다. 신화에서 드문 결말이다.
"""
events = [
  "argo-returns",
  "medeia-in-corinth",
  "medeia-leaves-for-athens",
]
sources = ["apollodorus.library 1.9.27-1.9.28", "ovid.metamorphoses 7.159-401", "pausanias.greece 2.3"]

[[arc]]
id = "orpheus-eurydike"
name_ko = "지하 세계로 간 오르페우스"
era = 5
oneliner = "저승을 노래로 이기고, 마지막 한 걸음에서 진다."
body = """
오르페우스는 결혼한 날에 아내를 잃는다.
노래로 저승의 왕까지 움직여, 아무도 받지 못한 허락을 받는다.
조건은 집에 닿기 전에 뒤를 돌아보지 않는 것이었다.
땅 위가 거의 보일 때 돌아본다. 이 이야기에서 그를 막은 것은 신이 아니다.
"""
events = [
  "eurydike-dies",
  "orpheus-in-underworld",
]
sources = ["apollodorus.library 1.3.2", "ovid.metamorphoses 10.1-85", "pausanias.greece 9.30"]

[[arc]]
id = "kalydon-hunt"
name_ko = "칼리돈의 멧돼지"
era = 5
oneliner = "멧돼지보다 그 가죽이 더 많은 사람을 데려갔다."
body = """
제사에서 한 신을 빼놓은 일 때문에 나라가 망가진다.
그리스에서 가장 뛰어난 사냥꾼들이 다 모여 멧돼지를 잡는다.
그런데 가죽을 누가 갖느냐를 두고 다툼이 난다.
거기서 사람이 더 죽는다.
어머니가 감춰 둔 나무 막대 하나가 마지막을 정한다.
"""
events = [
  "kalydon-boar-hunt",
  "meleagros-dies",
]
sources = ["apollodorus.library 1.8.2-1.8.3", "ovid.metamorphoses 8.260-546", "homer.iliad 9.529-599"]

[[arc]]
id = "dioskouroi"
name_ko = "쌍둥이자리가 된 형제"
era = 5
oneliner = "하나는 죽는 몸, 하나는 죽지 않는 몸이었다."
body = """
카스토르와 폴리데우케스는 늘 함께 다녔다.
아르고호를 탔고, 칼리돈의 멧돼지 사냥에도 갔다.
소를 두고 다투다 형이 죽는다.
동생은 혼자 죽지 않는 몸으로 남기를 마다했다.
그래서 둘은 하루씩 번갈아 산다.
"""
events = [
  "dioskouroi-alternate",
]
sources = ["apollodorus.library 3.11.2", "homer.odyssey 11.298-304", "homeric.hymns dioscuri 1-19"]

