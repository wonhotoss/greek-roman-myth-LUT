# 한 사건은 한 묶음에만 든다. events 는 이야기 순서.

[[arc]]
id = "tantalos-house"
name_ko = "탄탈로스의 집안"
era = 4
oneliner = "신들을 속인 왕에서 시작해 형제가 왕자리를 다투기까지."
body = """
탄탈로스가 신들을 속이고 저승에서 끝나지 않는 벌을 받는다.
아들 펠롭스는 전차 경주로 아내와 나라를 얻지만, 마부의 저주를 산다.
펠롭스의 두 아들은 미케네를 두고 다툰다.
이 집안에서 아가멤논과 메넬라오스가 나온다.
"""
events = [
  "tantalos-feast",
  "tantalos-punished",
