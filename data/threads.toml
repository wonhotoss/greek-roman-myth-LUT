# 이야기 타래. 여러 묶음(arc)을 가로질러 한 줄로 읽는 것.
# 묶음과 다른 점 둘 —
#   1. 한 사건이 여러 타래에 들 수 있다(묶음은 하나만).
#   2. steps 의 순서는 이야기 순서가 아니라 **시간축 순서**다. 빌드가 t0 로 검사하고,
#      적힌 순서가 시간축과 다르면 죽는다. 앞뒤를 원전이 말하지 않는 짝은 빌드가 표시한다(unsure).
# label 은 그 단계를 한 줄로 부르는 이름. 없으면 사건 이름만 보인다.
# 근거는 데이터-모델.md §7.

[[thread]]
id = "gaia-three-kings"
name_ko = "가이아와 세 임금"
aka = ["가이아의 싸움", "우라노스 크로노스 제우스"]
oneliner = "땅의 어머니가 우라노스, 크로노스, 제우스와 차례로 맞섰다."
body = """
가이아는 땅이고, 거의 모든 신의 어머니다.
임금이 세 번 바뀌는 동안 가이아의 자식들은 세 번 갇혔다.
우라노스에게는 크로노스를, 크로노스에게는 제우스를 내세웠다.
제우스가 티탄들을 가두자 이번에는 거인들과 티폰을 낳아 보냈다.
세 임금은 모두 가이아의 아들이거나 손자였다.
"""
fun = "제우스가 이긴 것은 가이아의 말을 따랐기 때문이다. 그 가이아가 나중에는 제우스와 맞선다."
steps = [
  { event = "ouranos-imprisons", label = "우라노스가 가두고, 가이아가 참지 못하다" },
  { event = "kronos-takes-throne", label = "가이아가 크로노스를 내세우다" },
  { event = "kronos-swallows", label = "이번에는 크로노스가 삼키다" },
  { event = "zeus-hidden", label = "가이아가 제우스를 숨기다" },
  { event = "zeus-frees-siblings", label = "형과 누나가 돌아오다" },
  { event = "titanomachy", label = "가이아의 말대로 갇힌 이들을 풀어 주다" },
  { event = "athena-born", label = "가이아가 제우스에게 메티스를 삼키라 하다" },
  { event = "gigantomachy", label = "가이아가 거인들을 보내다" },
  { event = "typhonomachy", label = "가이아의 마지막 자식 티폰" },
]
note = "타래의 첫 시안 둘 가운데 하나(2026-09-22). 헤시오도스에서 가이아는 제우스의 적이 아니다 — 티폰을 낳았다고만 한다(820). 거인들과 티폰을 '티탄의 복수'로 잇는 것은 아폴로도로스 1.6.1-1.6.3 이고, 묶음 olympus-defended 가 이미 그쪽을 따른다."
sources = ["hesiod.theogony 154-210", "hesiod.theogony 453-506", "hesiod.theogony 617-735", "hesiod.theogony 820-880", "hesiod.theogony 886-900", "apollodorus.library 1.1.1-1.2.1", "apollodorus.library 1.6.1-1.6.3"]

[[thread]]
id = "zeus-partners"
name_ko = "제우스가 만난 이들과 그 아이들"
aka = ["제우스의 자식들", "제우스의 아내들"]
oneliner = "제우스는 신도 사람도 만났고, 그 아이들이 신과 영웅이 되었다."
body = """
제우스의 아내는 헤라다.
그런데 제우스는 헤라 말고도 여러 신과 사람을 만났다.
자주 황소, 백조, 남의 남편으로 모습을 바꾸었다.
그 아이들이 아테나, 아폴론, 헤르메스, 페르세우스, 헤라클레스다.
헤라는 그 상대와 아이들을 오래 괴롭혔다.
"""
fun = "일리아스에는 제우스가 헤라에게 자기가 만난 이들을 줄줄이 늘어놓는 장면이 있다. 헤라를 달래려고 한 말이었다."
sensitivity = "soften"
steps = [
  { event = "athena-born", label = "메티스 → 아테나" },
  { event = "leto-twins-born", label = "레토 → 아르테미스와 아폴론" },
  { event = "hermes-born", label = "마이아 → 헤르메스" },
  { event = "persephone-taken", label = "데메테르 → 페르세포네" },
  { event = "danae-set-adrift", label = "다나에 → 페르세우스" },
  { event = "europa-carried-to-crete", label = "에우로페 → 미노스" },
  { event = "semele-dionysos-born", label = "세멜레 → 디오니소스" },
  { event = "zeus-visits-alkmene", label = "알크메네를 찾아가다" },
  { event = "herakles-born", label = "알크메네 → 헤라클레스" },
  { event = "leda-swan", label = "레다 → 헬레네와 폴리데우케스" },
]
note = "타래의 첫 시안 둘 가운데 하나(2026-09-22). 순서는 시간축이 정한다 — 헤시오도스 886-944 는 목록이지 순서가 아니다. 넣지 않은 것: 아이기나(sisyphos-punished 에 이름만 나온다), 테미스·에우리노메·므네모시네(자식이 항목에 없다), 이오·칼리스토·안티오페·가니메데스·엘렉트라·타이게테(항목이 없다), 헤라와의 결혼(사건이 없다), 탄탈로스·사르페돈(어머니가 항목에 없다). 아폴로도로스 1.3.1 은 페르세포네를 스틱스의 딸이라고도 한다."
sources = ["hesiod.theogony 886-944", "apollodorus.library 1.3.1", "homer.iliad 14.313-328"]

[[thread]]
id = "apollon-kassandra"
name_ko = "아폴론과 카산드라, 아무도 믿지 않은 말"
aka = ["카산드라의 예언", "카산드라"]
oneliner = "앞일을 다 보았지만 아무도 믿지 않았고, 트로이는 그대로 무너졌다."
body = """
아폴론이 카산드라에게 앞일을 보는 법을 가르쳤다.
믿어 준 말은 한 번, 낯선 목동을 오빠 파리스라고 알아본 때였다.
아폴론을 거절한 뒤로는 아무도 그 말을 믿지 않았다.
목마 안에 군사가 있다고 말했지만 트로이 사람들은 듣지 않았다.
믿어 준 말은 트로이를 무너뜨릴 사람을 들였고, 믿지 않은 말은 트로이를 구할 수 있었다.
"""
fun = "오빠 헬레노스도 앞일을 보았다. 그 말은 그리스군이 믿었고, 트로이를 무너뜨리는 조건이 되었다."
steps = [
  { event = "kassandra-apollon", label = "아폴론이 가르치다" },
  { event = "paris-returns", label = "한 번은 믿었다: 파리스를 알아보다" },
  { event = "kassandra-unbelieved", label = "거절하고, 믿음을 잃다" },
  { event = "helene-taken", label = "그 파리스가 헬레네를 데려오다" },
  { event = "horse-into-troy", label = "안에 군사가 있다고 했지만" },
  { event = "troy-falls", label = "그 말이 맞았다" },
  { event = "agamemnon-murdered", label = "카산드라의 마지막" },
  { event = "crete-plague", label = "안키세스가 카산드라의 말을 떠올리다" },
]
note = "2026-09-24. 믿어 준 말과 믿지 않은 말이 둘 다 트로이 함락의 원인이 된다 — paris-returns → helene-taken, kassandra-unbelieved → horse-into-troy 두 인과 사슬이 troy-falls 에서 만난다. 파리스의 귀환과 저주 사이의 앞뒤는 원전이 말하지 않는다(unsure). 아가멤논의 죽음과 크레타 사이도 그렇다(아가멤논의 귀환과 아이네이아스의 항해는 나란하다). 헬레노스의 말은 helenos-conditions(E.5.9-E.5.13)."
sources = ["apollodorus.library 3.12.5", "apollodorus.library E.3.2", "apollodorus.library E.5.9-E.5.13", "apollodorus.library E.5.17", "apollodorus.library E.6.23", "virgil.aeneid 2.246-247", "virgil.aeneid 3.182-187", "hyginus.fabulae 91", "hyginus.fabulae 93", "hyginus.fabulae 108", "homer.odyssey 11.421-423"]
