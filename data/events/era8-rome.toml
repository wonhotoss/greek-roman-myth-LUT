[[event]]
id = "vestal-virgins"
name_ko = "누마가 사제들과 베스타의 처녀들을 두다"
era = 8
seq = 230
span = "years"
place = "rome"
cast = [
  { figure = "numa", role = "주인공" },
  { figure = "hestia", role = "등장" },
  { figure = "ares", role = "등장" },
  { figure = "zeus", role = "등장" },
]
oneliner = "신마다 섬기는 사람을 정하고, 베스타의 불을 지키는 처녀들을 두었다."
body = """
누마는 제우스, 아레스, 퀴리누스를 섬기는 사제를 따로 두었다.
사제는 신에게 제사를 드리는 일을 맡은 사람이다.
헤스티아(로마에서는 베스타)를 섬기는 처녀들도 뽑았다.
이 일은 알바 롱가에서 온 것이다.
처녀들은 결혼하지 않고 신전의 불을 지켰다.
"""
fun = "아레스(로마에서는 마르스)를 위해 열두 명의 살리이를 두었다. 하늘에서 떨어진 방패를 들고 춤추며 도시를 돌았다."
caused_by = ["numa-chosen"]
sources = ["livy.rome 1.20", "virgil.aeneid 1.292"]

[[event]]
id = "numa-and-egeria"
name_ko = "누마가 밤마다 에게리아를 만나다"
era = 8
seq = 240
span = "years"
place = "rome"
cast = [
  { figure = "numa", role = "주인공" },
  { figure = "egeria", role = "도움" },
]
oneliner = "왕은 숲의 샘에서 님프를 만나 신들의 뜻을 배운다고 했다."
body = """
누마는 밤마다 여신 에게리아를 만난다고 말했다.
에게리아가 알려 준 대로 제사를 정하고 사제를 세운다고 했다.
어두운 굴에서 샘이 흘러나오는 숲이 있었다.
누마는 자주 혼자 그곳에 가서 아내 에게리아를 만났다고 했다.
리비우스는 사람들이 신을 두려워하게 하려고 누마가 꾸민 일이라고 적었다.
"""
fun = "누마는 그 숲을 무사(뮤즈) 여신들에게 바쳤다. 에게리아를 만난 곳이기 때문이다."
caused_by = ["numa-chosen"]
sources = ["livy.rome 1.19", "livy.rome 1.21", "ovid.metamorphoses 15.482-484"]

[[event]]
id = "egeria-fountain"
name_ko = "에게리아의 눈물이 샘이 되다"
era = 8
seq = 250
span = "days"
after = ["numa-and-egeria", "ianus-temple-and-calendar", "vestal-virgins"]
place = "aricia"
cast = [
  { figure = "egeria", role = "주인공" },
  { figure = "numa", role = "피해" },
  { figure = "hippolytos", role = "도움" },
  { figure = "artemis", role = "도움" },
]
oneliner = "누마가 죽자 님프는 숲에서 울다가 물이 되었다."
body = """
누마는 마흔세 해를 다스리고 늙어서 죽었다.
로마 사람들 모두가 슬퍼했다.
에게리아는 도시를 떠나 아리키아 골짜기 아르테미스의 숲에 숨어 울었다.
그 숲에 살던 히폴리토스가 자기 이야기로 달랬지만 소용없었다.
아르테미스가 우는 에게리아를 시원한 샘으로 바꾸었다.
"""
fun = "히폴리토스는 죽은 뒤 아르테미스가 되살려 이 숲에 숨겨 두었다. 이름도 비르비우스로 바꾸었다. 로마에서는 아르테미스를 디아나라고 불렀다."
sources = ["ovid.metamorphoses 15.479-551", "livy.rome 1.21"]
