era = 6
seq = 110
span = "days"
places = ["troy", "olympus-home"]
cast = [
  { figure = "thetis", role = "주인공" },
  { figure = "achilleus", role = "도움" },
  { figure = "zeus", role = "상대" },
  { figure = "hera", role = "상대" },
]
oneliner = "테티스가 제우스에게 트로이군을 이기게 해 달라고 부탁했다."
