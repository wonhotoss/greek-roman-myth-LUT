# era 6 — 트로이 전쟁 전체. 뿌리인 탄탈로스 가문(era 4 seq 300~399)과 전쟁 전의 일(era 5 seq 1100~1199)도 여기 둔다.
# 묶음: tantalos-house / road-to-troy / wrath-of-achilleus / fall-of-troy (스크래치 arcs/TRO.toml)
# 다른 에이전트 소유라 참조만 하는 id: lemnos, kastor, polydeukes, mt-pelion(THE) · ithake, penelope(ODY) · cheiron, herakles-sacks-troy(HER)
# 히기누스 전문은 2026-09-03 에 들어왔다(sources/hyginus-fabulae-grant.txt). 82·92·93·96·98·107·108 은 그날 대조해 variants·sources 에 넣었다.

# ---------- era 4 : 탄탈로스 가문 ----------

[[event]]
id = "tantalos-feast"
name_ko = "탄탈로스가 신들을 속이다"
era = 4
seq = 300
span = "moment"
cast = [
  { figure = "tantalos", role = "주인공" },
  { figure = "pelops", role = "피해" },
  { figure = "zeus", role = "상대" },
  { figure = "poseidon", role = "도움" },
]
oneliner = "탄탈로스가 신들을 시험하려고 끔찍한 음식을 내놓았다."
body = """
탄탈로스는 신들과 한 식탁에 앉을 만큼 가까웠다.
그런데 신들의 비밀을 떠들고 암브로시아를 훔쳐 냈다.
잔치를 열어 신들을 시험하려고 해서는 안 될 끔찍한 음식을 내놓았다.
그 잔치에서 아들 펠롭스가 죽었는데, 신들이 다시 살려 냈다.
살아난 펠롭스는 더 아름다워져 포세이돈이 아꼈다.
"""
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 4권 3장 「영원한 굶주림의 벌」. 식인 상세는 쓰지 않는다. 장소는 원전에 없다."
place_unknown = true
sources = ["apollodorus.library E.2.1", "apollodorus.library E.2.3", "ovid.metamorphoses 6.401-411"]

[[event]]
id = "tantalos-punished"
name_ko = "탄탈로스가 저승에서 벌을 받다"
era = 4
seq = 310
span = "age"
open = true
place = "hades-realm"
cast = [
  { figure = "tantalos", role = "피해" },
  { figure = "zeus", role = "상대" },
]
oneliner = "탄탈로스는 저승에서 물과 열매를 눈앞에 두고 영원히 굶는다."
body = """
신들은 탄탈로스를 저승으로 보냈다.
턱까지 물이 차는 못에 서 있는데, 마시려 하면 물이 말랐다.
머리 위에 열매가 열렸는데, 손을 뻗으면 바람이 가지를 올려 버렸다.
머리 위에는 큰 돌이 매달려 언제 떨어질지 몰랐다.
이 벌은 끝나지 않는다.
"""
fun = "오디세우스가 저승에 갔을 때 이 모습을 보았다. 시시포스가 바위를 밀어 올리는 것도 그 옆에서 보았다."
caused_by = ["tantalos-feast"]
variants = [
  { source = "hyginus.fabulae 82", text = "히기누스는 탄탈로스가 신들의 잔치에서 들은 비밀을 사람들에게 말해서 벌을 받았다고 한다." },
]
note = "참고: 처음 읽는 그리스 로마 신화 4권 3장 「영원한 굶주림의 벌」. 벌의 까닭이 다른 히기누스 82 는 variants 에 넣었다."
sources = ["apollodorus.library E.2.1", "homer.odyssey 11.582-592"]

[[event]]
id = "pelops-chariot-race"
name_ko = "펠롭스와 히포다메이아의 전차 경주"
era = 4
seq = 320
span = "days"
place = "pisa"
cast = [
  { figure = "pelops", role = "주인공" },
  { figure = "hippodameia", role = "도움" },
  { figure = "oinomaos", role = "상대" },
  { figure = "myrtilos", role = "도움" },
  { figure = "poseidon", role = "도움" },
]
oneliner = "펠롭스가 바퀴 쐐기를 뺀 전차와 경주해 이겼다."
body = """
피사의 왕 오이노마오스는 딸의 구혼자와 전차 경주를 해서 지면 죽였다.
펠롭스가 포세이돈이 준 전차를 타고 구혼하러 왔다.
히포다메이아는 펠롭스가 마음에 들어 마부 미르틸로스를 설득했다.
미르틸로스는 왕의 전차 바퀴에 쐐기를 끼우지 않았다.
경주 중에 바퀴가 빠져 왕이 죽었고, 펠롭스가 히포다메이아를 얻었다.
"""
fun = "펠롭스는 나중에 미르틸로스를 바다에 던졌다. 미르틸로스는 떨어지면서 펠롭스의 집안을 저주했다."
variants = [
  { source = "apollodorus.library E.2.7", text = "오이노마오스가 전차에서 떨어져 죽은 것이 아니라 펠롭스의 손에 죽었다는 이야기도 있다." },
]
caused_by = ["tantalos-feast"]
sources = ["apollodorus.library E.2.4-E.2.9", "pausanias.greece 5.10"]

# ---------- era 5 : 전쟁의 뿌리 ----------

[[event]]
id = "atreus-thyestes-feud"
name_ko = "아트레우스와 티에스테스가 왕자리를 다투다"
era = 5
seq = 1100
span = "season"
place = "mycenae"
cast = [
  { figure = "atreus", role = "주인공" },
  { figure = "thyestes", role = "상대" },
  { figure = "zeus", role = "도움" },
  { figure = "hermes", role = "도움" },
]
oneliner = "형제가 미케네의 왕자리를 다투었고, 해가 거꾸로 졌다."
body = """
미케네 사람들이 펠롭스의 아들을 왕으로 삼으라는 신의 말을 들었다.
불려 온 티에스테스는 황금 양을 가진 쪽이 왕이 되자고 했다.
아트레우스가 좋다고 했는데, 양은 몰래 티에스테스의 손에 가 있었다.
제우스는 해가 거꾸로 지면 아트레우스가 왕이 되자고 하라고 했다.
해가 동쪽으로 졌고, 아트레우스는 왕이 되어 동생을 쫓아냈다.
"""
sensitivity = "soften"
note = "그 뒤의 잔치(E.2.13)와 아이기스토스의 출생(E.2.14)은 쓰지 않는다."
sources = ["apollodorus.library E.2.10-E.2.12"]

[[event]]
id = "leda-swan"
name_ko = "레다와 백조, 헬레네가 태어나다"
era = 5
seq = 1110
span = "moment"
place = "sparta"
cast = [
  { figure = "zeus", role = "주인공" },
  { figure = "leda", role = "피해" },
  { figure = "tyndareos", role = "등장" },
  { figure = "helene", role = "등장" },
  { figure = "klytaimnestra", role = "등장" },
  { figure = "polydeukes", role = "등장" },
  { figure = "kastor", role = "등장" },
]
oneliner = "제우스가 백조가 되어 레다에게 다가갔고, 헬레네가 태어났다."
body = """
제우스가 백조로 모습을 바꾸어 스파르타의 왕비 레다에게 다가갔다.
레다는 아이 넷을 낳았다.
폴리데우케스와 헬레네는 제우스의 아이였다.
카스토르와 클리타임네스트라는 틴다레오스의 아이였다.
네 아이는 스파르타에서 함께 자랐다.
"""
variants = [
  { source = "apollodorus.library 3.10.7", text = "헬레네는 제우스와 네메시스의 딸이라는 이야기도 있다. 네메시스가 낳은 알을 목동이 레다에게 가져왔고, 그 알에서 헬레네가 나왔다." },
]
sensitivity = "soften"
sources = ["apollodorus.library 3.10.7"]

[[event]]
id = "peleus-thetis-wedding"
name_ko = "펠레우스와 테티스의 결혼 잔치"
era = 5
seq = 1120
span = "days"
place = "mt-pelion"
cast = [
  { figure = "peleus", role = "주인공" },
  { figure = "thetis", role = "주인공" },
  { figure = "zeus", role = "등장" },
  { figure = "poseidon", role = "도움" },
  { figure = "themis", role = "등장" },
  { figure = "cheiron", role = "도움" },
  { figure = "hera", role = "등장" },
  { figure = "apollon", role = "등장" },
]
oneliner = "신들이 모두 와서 사람 펠레우스와 님프 테티스의 결혼을 축하했다."
body = """
제우스와 포세이돈이 테티스를 두고 다투었다.
그런데 테티스가 낳을 아들이 아버지보다 강해진다는 테미스의 말이 있었다.
두 신은 물러났고, 제우스는 테티스를 사람 펠레우스와 결혼하게 했다.
펠레우스는 케이론이 알려 준 대로 모습을 바꾸는 테티스를 놓지 않았다.
펠리온 산에서 신들이 모두 와 잔치를 하고 노래를 불렀다.
"""
fun = "결혼 선물로 케이론은 물푸레나무 창을, 포세이돈은 죽지 않는 말 두 마리를 주었다. 아킬레우스가 트로이에서 그 창과 말을 썼다."
variants = [
  { source = "apollodorus.library 3.13.5", text = "테티스가 헤라의 손에 자라서 제우스를 거절했고, 화가 난 제우스가 그녀를 사람과 결혼시켰다는 이야기도 있다." },
  { source = "hyginus.fabulae 92", text = "히기누스는 제우스가 다툼의 여신 에리스만 잔치에 부르지 않았고, 에리스가 문 밖에서 사과를 던져 넣었다고 한다." },
]
note = "참고: 처음 읽는 그리스 로마 신화 11권 1장 「황금 사과의 주인」. '에리스만 초대받지 못했다'는 히기누스 92 로 variants 에 넣었다. 사과는 paris-judgment 에서 E.3.2 대로 쓴다."
sources = ["apollodorus.library 3.13.5", "homer.iliad 24.59-63", "homer.iliad 18.84-85", "homer.iliad 16.140-144"]

[[event]]
id = "achilleus-childhood"
name_ko = "테티스가 아기를 불에 넣다"
era = 5
seq = 1130
span = "years"
places = ["phthia", "mt-pelion"]
cast = [
  { figure = "thetis", role = "주인공" },
  { figure = "peleus", role = "주인공" },
  { figure = "achilleus", role = "피해" },
  { figure = "cheiron", role = "도움" },
]
oneliner = "테티스가 아기를 죽지 않는 몸으로 만들려 했고, 케이론이 아이를 키웠다."
body = """
테티스는 아기를 죽지 않는 몸으로 만들고 싶었다.
밤마다 아기를 불에 넣고, 낮에는 암브로시아를 발라 주었다.
펠레우스가 소리를 지르자 테티스는 아기를 두고 바다로 돌아갔다.
펠레우스는 아기를 케이론에게 맡겼다.
케이론이 아킬레우스라는 이름을 지어 주었다.
"""
fun = "케이론은 아이에게 사자와 멧돼지의 속살과 곰의 골수를 먹였다."
caused_by = ["peleus-thetis-wedding"]
after = ["peleus-thetis-wedding"]
sources = ["apollodorus.library 3.13.6"]

[[event]]
id = "paris-born"
name_ko = "파리스가 태어나 이데 산에 버려지다"
era = 5
seq = 1140
span = "years"
places = ["troy", "mt-ida-troad"]
cast = [
  { figure = "hekabe", role = "주인공" },
  { figure = "priamos", role = "주인공" },
  { figure = "paris", role = "피해" },
]
oneliner = "헤카베가 불 꿈을 꾸었고, 태어난 아기는 이데 산에 버려졌다."
body = """
헤카베는 둘째를 가졌을 때 불붙은 나무토막을 낳는 꿈을 꾸었다.
꿈을 푸는 사람이 이 아이가 나라를 망하게 한다고 했다.
프리아모스는 아기가 태어나자 종에게 주어 이데 산에 버리게 했다.
곰이 닷새 동안 아기에게 젖을 주었다.
종 아겔라오스가 아기를 데려와 아들로 키우며 파리스라 불렀다.
"""
fun = "자라서 도둑을 잘 막아 '지키는 사람'이라는 뜻의 알렉산드로스라는 이름도 얻었다. 얼마 뒤 부모를 찾았다."
after = ["herakles-sacks-troy"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 1장 「파리스의 탄생」. 프리아모스는 헤라클레스가 트로이를 무너뜨린 뒤 왕이 되었다(3.12.5) — HER 의 herakles-sacks-troy 를 after 로 잡는다."
sources = ["apollodorus.library 3.12.5"]

[[event]]
id = "kassandra-apollon"
name_ko = "아폴론이 카산드라에게 앞일을 보는 힘을 주다"
era = 5
seq = 1150
span = "moment"
place = "troy"
cast = [
  { figure = "kassandra", role = "주인공" },
  { figure = "apollon", role = "상대" },
]
oneliner = "아폴론이 카산드라에게 앞일을 보는 힘을 주고, 믿음을 빼앗았다."
body = """
아폴론이 프리아모스의 딸 카산드라를 좋아했다.
마음을 얻으려고 앞일을 보는 법을 가르쳐 주겠다고 했다.
카산드라는 다 배우고 나서 아폴론을 거절했다.
아폴론은 그 힘에서 사람을 설득하는 힘을 빼앗았다.
그 뒤로 카산드라가 하는 말은 다 맞았지만 아무도 믿지 않았다.
"""
variants = [
  { source = "hyginus.fabulae 93", text = "히기누스는 카산드라가 아폴론의 신전에서 잠들었다가 다가온 아폴론을 거절했고, 그래서 아폴론이 사람들이 그 말을 믿지 않게 했다고 한다." },
]
note = "참고: 처음 읽는 그리스 로마 신화 2권 4장 「예언자 카산드라」. 히기누스 93 은 까닭이 달라 variants 에 넣었다."
sources = ["apollodorus.library 3.12.5", "virgil.aeneid 2.246-247"]

[[event]]
id = "helene-suitors"
name_ko = "헬레네의 구혼자들과 틴다레오스의 맹세"
era = 5
seq = 1160
span = "season"
place = "sparta"
cast = [
  { figure = "tyndareos", role = "주인공" },
  { figure = "helene", role = "등장" },
  { figure = "odysseus", role = "도움" },
  { figure = "menelaos", role = "주인공" },
  { figure = "agamemnon", role = "등장" },
  { figure = "klytaimnestra", role = "등장" },
  { figure = "penelope", role = "등장" },
  { figure = "diomedes", role = "등장" },
  { figure = "aias", role = "등장" },
  { figure = "patroklos", role = "등장" },
  { figure = "philoktetes", role = "등장" },
  { figure = "protesilaos", role = "등장" },
]
oneliner = "그리스의 왕들이 헬레네에게 구혼했고, 모두 맹세를 했다."
body = """
헬레네가 자라자 왕들이 몰려왔고, 틴다레오스는 다툼이 날까 걱정했다.
오디세우스가 꾀를 내어 구혼자 모두에게 맹세를 받게 했다.
신랑이 억울한 일을 당하면 다 함께 돕겠다는 맹세였다.
틴다레오스는 메넬라오스를 골랐고, 오디세우스는 페넬로페를 얻었다.
아가멤논은 헬레네의 자매 클리타임네스트라와 결혼했다.
"""
fun = "구혼자 명단에는 오디세우스, 디오메데스, 아이아스, 파트로클로스, 필록테테스도 있었다. 뒷날 트로이로 가는 사람들이 다 있다."
caused_by = ["leda-swan"]
sources = ["apollodorus.library 3.10.8-3.10.9", "apollodorus.library E.2.16"]

# ---------- era 6 : 트로이로 가는 길 ----------

[[event]]
id = "paris-judgment"
name_ko = "파리스의 심판"
era = 6
seq = 10
span = "moment"
place = "mt-ida-troad"
cast = [
  { figure = "paris", role = "주인공" },
  { figure = "aphrodite", role = "도움" },
  { figure = "hera", role = "상대" },
  { figure = "athena", role = "상대" },
  { figure = "hermes", role = "도움" },
  { figure = "zeus", role = "등장" },
  { figure = "eris", role = "등장" },
]
oneliner = "파리스가 세 여신 가운데 아프로디테를 가장 아름답다고 했다."
body = """
에리스가 가장 아름다운 여신에게 주는 상이라며 사과를 던졌다.
헤라, 아테나, 아프로디테가 서로 자기 것이라고 다투었다.
제우스는 헤르메스에게 세 여신을 이데 산의 파리스에게 데려가라고 했다.
헤라는 온 세상의 왕자리를, 아테나는 싸움에서 이기는 힘을 약속했다.
아프로디테는 헬레네를 약속했고, 파리스는 아프로디테를 골랐다.
"""
fun = "헤라와 아테나는 이 일을 잊지 않았다. 열 해 동안 트로이를 미워한 이유가 이것이다."
caused_by = ["peleus-thetis-wedding"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 1장 「황금 사과의 주인」. 히기누스 92 도 같은 이야기라 sources 에 더했다(세 여신의 약속까지 같다)."
sources = ["apollodorus.library E.3.2", "homer.iliad 24.25-30", "hyginus.fabulae 92"]

[[event]]
id = "helene-taken"
name_ko = "파리스가 헬레네를 데려가다"
era = 6
seq = 20
span = "days"
places = ["sparta", "troy"]
cast = [
  { figure = "paris", role = "주인공" },
  { figure = "helene", role = "피해" },
  { figure = "menelaos", role = "피해" },
  { figure = "aphrodite", role = "도움" },
  { figure = "hera", role = "상대" },
]
oneliner = "파리스가 스파르타의 손님으로 와서 헬레네를 데리고 떠났다."
body = """
파리스는 배를 지어 스파르타로 갔다.
메넬라오스는 아홉 날 동안 손님으로 잘 대접했다.
열째 날 메넬라오스가 할아버지의 장례로 크레타에 갔다.
파리스는 그 사이에 헬레네를 데리고 밤에 배를 타고 떠났다.
헤라가 큰 바람을 보내 배를 멀리 돌게 했지만, 결국 트로이에 닿았다.
"""
variants = [
  { source = "apollodorus.library E.3.5", text = "헤르메스가 헬레네를 이집트에 숨기고, 파리스는 구름으로 만든 헬레네를 트로이에 데려갔다는 이야기도 있다." },
]
sensitivity = "soften"
caused_by = ["paris-judgment"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 1장 「파리스와 헬레네」"
sources = ["apollodorus.library E.3.3-E.3.5", "homer.iliad 3.443-446"]

[[event]]
id = "greeks-muster"
name_ko = "그리스의 왕들이 모이고, 오디세우스가 미친 척하다"
era = 6
seq = 30
span = "season"
places = ["mycenae", "ithake"]
cast = [
  { figure = "menelaos", role = "주인공" },
  { figure = "agamemnon", role = "주인공" },
  { figure = "odysseus", role = "등장" },
  { figure = "palamedes", role = "도움" },
  { figure = "penelope", role = "등장" },
  { figure = "nestor", role = "등장" },
  { figure = "diomedes", role = "등장" },
  { figure = "aias", role = "등장" },
  { figure = "idomeneus", role = "등장" },
]
oneliner = "메넬라오스가 형을 찾아가고, 왕들이 맹세대로 모였다."
body = """
메넬라오스는 미케네의 아가멤논을 찾아가 군대를 모아 달라고 했다.
아가멤논은 왕들에게 사람을 보내 옛 맹세를 떠올리게 했다.
많은 왕이 나섰지만 오디세우스는 가고 싶지 않아 미친 척했다.
팔라메데스가 아기 텔레마코스에게 칼을 들자 오디세우스가 놀라 막았다.
거짓이 드러났고, 오디세우스도 전쟁에 가게 되었다.
"""
fun = "아폴로도로스는 배가 천십삼 척, 지휘관이 마흔셋이라고 적었다. 아가멤논이 백 척으로 가장 많았다."
caused_by = ["helene-taken", "helene-suitors"]
after = ["helene-taken"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장 「그리스의 군사들」. 텔레마코스는 ODY 소유(era 7) 인물이라 이름만 부른다."
sources = ["apollodorus.library E.3.6-E.3.7", "apollodorus.library E.3.11-E.3.14"]

[[event]]
id = "achilleus-skyros"
name_ko = "스키로스에 숨은 아킬레우스"
era = 6
seq = 40
span = "days"
place = "skyros"
cast = [
  { figure = "achilleus", role = "주인공" },
  { figure = "thetis", role = "도움" },
  { figure = "odysseus", role = "상대" },
  { figure = "kalchas", role = "등장" },
  { figure = "neoptolemos", role = "등장" },
]
oneliner = "테티스가 숨긴 아킬레우스를 오디세우스가 나팔 소리로 찾아냈다."
body = """
칼카스가 아킬레우스가 없으면 트로이를 얻지 못한다고 했다.
테티스는 아들이 전쟁에 가면 죽는다는 것을 알았다.
그래서 여자 옷을 입혀 스키로스의 리코메데스 왕에게 맡겼다.
그곳에서 왕의 딸과 사이에 아들 네옵톨레모스가 태어났다.
오디세우스가 찾아와 나팔 소리로 아킬레우스를 찾아냈다.
"""
fun = "아폴로도로스는 아킬레우스가 열다섯 살에 함대를 이끌었다고 적었다."
caused_by = ["greeks-muster"]
after = ["achilleus-childhood"]
variants = [
  { source = "hyginus.fabulae 96", text = "히기누스는 소녀들이 아킬레우스를 피라라고 불렀다고 한다. 머리가 붉은 빛이어서다." },
]
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장. 히기누스 96 도 같은 이야기(나팔 소리)라 sources 에 더하고, 피라라는 이름은 variants 에 넣었다. 리코메데스·데이다메이아는 등록부에 없어 이름만."
sources = ["apollodorus.library 3.13.8", "apollodorus.library E.3.16", "pausanias.greece 1.22", "hyginus.fabulae 96"]

[[event]]
id = "aulis-omen"
name_ko = "아울리스의 뱀과 칼카스의 말"
era = 6
seq = 50
span = "days"
place = "aulis"
cast = [
  { figure = "kalchas", role = "주인공" },
  { figure = "agamemnon", role = "등장" },
  { figure = "odysseus", role = "등장" },
  { figure = "achilleus", role = "등장" },
  { figure = "zeus", role = "도움" },
  { figure = "apollon", role = "등장" },
]
oneliner = "아울리스에서 뱀이 참새 아홉 마리를 삼켰고, 칼카스가 열 해를 말했다."
body = """
그리스의 배들이 아울리스에 모였다.
아폴론에게 제사를 드리는데 제단 옆에서 뱀이 나왔다.
뱀은 둥지의 새끼 여덟 마리와 어미까지 아홉을 삼키고 돌이 되었다.
칼카스는 이것이 제우스가 보낸 표시라고 했다.
트로이는 아홉 해를 버티고 열 해째에 무너진다는 뜻이었다.
"""
fun = "아홉 해째에 군사들이 집에 가고 싶어 하자 오디세우스가 이 일을 다시 말해 붙잡았다."
caused_by = ["greeks-muster"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장 「칼카스의 예언」"
sources = ["apollodorus.library E.3.15", "homer.iliad 2.299-332"]

[[event]]
id = "iphigeneia-aulis"
name_ko = "아울리스의 이피게네이아"
era = 6
seq = 60
span = "moment"
place = "aulis"
cast = [
  { figure = "agamemnon", role = "주인공" },
  { figure = "iphigeneia", role = "피해" },
  { figure = "artemis", role = "상대" },
  { figure = "kalchas", role = "도움" },
  { figure = "klytaimnestra", role = "피해" },
  { figure = "odysseus", role = "도움" },
  { figure = "achilleus", role = "등장" },
]
oneliner = "바람이 멎었고, 제단의 이피게네이아 자리에 사슴이 놓였다."
body = """
바람이 멎어 배가 못 떴고, 칼카스는 아르테미스가 화났다고 했다.
아가멤논이 사슴을 잡고 아르테미스보다 잘 쏜다고 자랑했기 때문이다.
칼카스는 아가멤논의 가장 예쁜 딸을 바쳐야 한다고 했다.
아가멤논은 딸을 아킬레우스와 결혼시킨다고 속여 불러왔다.
제단 앞에서 아르테미스가 딸을 멀리 데려가고 그 자리에 사슴을 두었다.
"""
variants = [
  { source = "apollodorus.library E.3.22", text = "아르테미스가 이피게네이아를 죽지 않는 몸으로 만들었다는 이야기도 있다." },
  { source = "apollodorus.library E.3.21", text = "아르테미스가 화난 또 하나의 까닭은 아트레우스가 황금 양을 바치지 않은 것이라고도 한다." },
]
sensitivity = "soften"
caused_by = ["aulis-omen"]
after = ["aulis-omen"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장. E.3.22 의 사슴 판본을 주 서술로. 히기누스 98 도 같은 이야기(사슴 판본, 아킬레우스와의 결혼 거짓말)라 sources 에 더했다. 미시아 회항과 8년(E.3.17-3.20)은 책에 없어 생략."
sources = ["apollodorus.library E.3.21-E.3.22", "ovid.metamorphoses 12.24-38", "hyginus.fabulae 98"]

[[event]]
id = "tenedos-philoktetes"
name_ko = "테네도스, 그리고 렘노스에 남겨진 필록테테스"
era = 6
seq = 70
span = "days"
places = ["tenedos", "lemnos"]
cast = [
  { figure = "philoktetes", role = "피해" },
  { figure = "achilleus", role = "주인공" },
  { figure = "thetis", role = "도움" },
  { figure = "odysseus", role = "등장" },
  { figure = "agamemnon", role = "등장" },
  { figure = "apollon", role = "등장" },
]
oneliner = "테네도스에서 필록테테스가 뱀에 물렸고, 렘노스에 홀로 남겨졌다."
body = """
배들이 아울리스를 떠나 트로이 앞바다의 테네도스에 들렀다.
테네스가 돌을 던져 막자, 아킬레우스가 테티스의 말림에도 그를 죽였다.
아폴론에게 제사를 드릴 때 물뱀이 필록테테스를 물었다.
상처가 낫지 않고 냄새가 심했다.
오디세우스가 그를 헤라클레스의 활과 함께 렘노스에 두고 떠났다.
"""
fun = "필록테테스는 렘노스에서 그 활로 새를 잡아 먹으며 아홉 해를 홀로 살았다."
after = ["iphigeneia-aulis"]
sources = ["apollodorus.library E.3.23", "apollodorus.library E.3.26-E.3.27", "homer.iliad 2.716-728", "hyginus.fabulae 102"]

[[event]]
