아킬레우스는 소식을 듣고 땅에 엎드려 울었다.
테티스가 헤파이스토스에게 가서 새 갑옷을 만들어 달라고 했다.
헤파이스토스는 하룻밤에 방패, 갑옷, 투구, 정강이받이를 만들었다.
"""
fun = "방패에는 땅과 하늘과 바다, 해와 달과 별, 그리고 두 도시 사람들의 삶이 다 새겨져 있었다."
caused_by = ["patroklos-dies"]
after = ["patroklos-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 3장. 아가멤논과의 화해(19권)는 hektor-dies 에 한 줄."
sources = ["homer.iliad 17.122-125", "homer.iliad 17.715-761", "homer.iliad 18.1-147", "homer.iliad 18.369-617", "apollodorus.library E.4.7"]

[[event]]
id = "hektor-dies"
name_ko = "헥토르의 죽음"
era = 6
seq = 220
span = "moment"
place = "troy"
cast = [
  { figure = "achilleus", role = "주인공" },
  { figure = "hektor", role = "피해" },
  { figure = "athena", role = "도움" },
  { figure = "apollon", role = "도움" },
  { figure = "deiphobos", role = "등장" },
  { figure = "priamos", role = "등장" },
  { figure = "hekabe", role = "등장" },
  { figure = "andromache", role = "등장" },
  { figure = "agamemnon", role = "등장" },
  { figure = "briseis", role = "등장" },
]
oneliner = "아킬레우스가 성문 앞에서 헥토르를 죽였다."
body = """
아킬레우스는 아가멤논과 화해하고 다시 싸움에 나갔다.
트로이군을 강까지 몰아 많이 죽였고, 강의 신까지 그에게 덤벼들었다.
헥토르만 성문 밖에 남았고, 부모가 성벽에서 들어오라고 외쳤다.
아테나가 데이포보스의 모습으로 나타나 달아나던 헥토르를 멈추게 했다.
아킬레우스는 창으로 헥토르를 죽이고, 시신을 돌려주지 않고 끌고 갔다.
"""
fun = "헥토르는 성을 세 바퀴 돌며 달아났다. 신들이 올림포스에서 그 모습을 내려다보았다."
sensitivity = "soften"
caused_by = ["new-armour", "patroklos-dies"]
after = ["new-armour"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 3장 「분노의 전투」. 시신 훼손은 '돌려주지 않았다'까지."
sources = ["homer.iliad 19.1-275", "homer.iliad 21.211-384", "homer.iliad 22.25-92", "homer.iliad 22.131-404", "apollodorus.library E.4.7"]

[[event]]
id = "priamos-ransoms-hektor"
name_ko = "프리아모스가 아들을 찾아오다"
era = 6
seq = 230
span = "days"
place = "troy"
cast = [
  { figure = "priamos", role = "주인공" },
  { figure = "achilleus", role = "상대" },
  { figure = "hermes", role = "도움" },
  { figure = "zeus", role = "도움" },
  { figure = "thetis", role = "도움" },
  { figure = "hekabe", role = "등장" },
  { figure = "andromache", role = "등장" },
  { figure = "helene", role = "등장" },
  { figure = "patroklos", role = "등장" },
]
oneliner = "프리아모스가 홀로 아킬레우스를 찾아가 아들의 시신을 돌려받았다."
body = """
장례를 치른 뒤에도 아킬레우스는 헥토르의 시신을 돌려주지 않았다.
제우스가 테티스를 시켜 아들을 달래고, 프리아모스에게는 가라고 했다.
헤르메스가 늙은 왕을 밤에 그리스 진영까지 데려다 주었다.
프리아모스가 아킬레우스의 손을 잡고 부탁하자 둘은 함께 울었다.
아킬레우스는 시신을 돌려주고 장례 동안 열하루 싸움을 멈추기로 했다.
"""
fun = "아킬레우스는 자기 아버지 펠레우스를 생각하며 울었고, 프리아모스는 아들을 생각하며 울었다."
caused_by = ["hektor-dies"]
after = ["hektor-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 3장. 파트로클로스의 장례와 경기(23권)는 sources 에만."
sources = ["homer.iliad 23.1-257", "homer.iliad 24.1-140", "homer.iliad 24.334-467", "homer.iliad 24.468-676", "apollodorus.library E.4.7"]

# ---------- era 6 : 트로이의 마지막 ----------

[[event]]
id = "penthesileia-memnon"
name_ko = "펜테실레이아와 멤논이 트로이를 돕다"
era = 6
seq = 240
span = "season"
place = "troy"
cast = [
  { figure = "achilleus", role = "주인공" },
  { figure = "penthesileia", role = "상대" },
  { figure = "memnon", role = "상대" },
  { figure = "priamos", role = "등장" },
  { figure = "nestor", role = "피해" },
  { figure = "eos", role = "등장" },
]
oneliner = "펜테실레이아와 멤논이 차례로 트로이를 돕다 아킬레우스에게 죽었다."
body = """
헥토르가 죽은 뒤 아마존의 여왕 펜테실레이아가 트로이를 도우러 왔다.
많은 그리스 사람을 죽였지만 아킬레우스와 맞붙어 죽었다.
아킬레우스는 죽은 그녀를 보고 마음이 아팠다.
그다음 새벽의 여신의 아들 멤논이 에티오피아 군대를 이끌고 왔다.
멤논은 네스토르의 아들 안틸로코스를 죽였고, 아킬레우스가 멤논을 죽였다.
"""
fun = "멤논의 장작불에서 새들이 생겨나 서로 싸웠다고 오비디우스가 적었다."
after = ["priamos-ransoms-hektor"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장 「영웅들의 죽음」. 안틸로코스는 등록부에 없어 이름만."
sources = ["apollodorus.library E.5.1", "apollodorus.library E.5.3", "homer.odyssey 4.187-188", "ovid.metamorphoses 13.576-622", "virgil.aeneid 1.489-493"]

[[event]]
id = "achilleus-dies"
name_ko = "아킬레우스의 죽음"
era = 6
seq = 250
span = "days"
place = "troy"
cast = [
  { figure = "achilleus", role = "피해" },
  { figure = "paris", role = "상대" },
  { figure = "apollon", role = "상대" },
  { figure = "aias", role = "도움" },
  { figure = "odysseus", role = "도움" },
  { figure = "thetis", role = "등장" },
  { figure = "agamemnon", role = "등장" },
]
oneliner = "파리스와 아폴론의 화살이 아킬레우스의 발목을 맞혔다."
body = """
아킬레우스가 트로이군을 성문까지 쫓았다.
스카이아 성문에서 아폴론이 이끈 파리스의 화살이 발목에 맞았다.
아이아스가 시신을 안고 나오고 오디세우스가 뒤를 막았다.
테티스와 바다의 님프들이 올라와 열이레 동안 울었다.
뼈는 파트로클로스의 뼈와 한 항아리에 넣었다.
"""
fun = "헥토르가 죽으면서 이미 파리스와 아폴론이 너를 성문에서 죽인다고 말했었다."
caused_by = ["penthesileia-memnon"]
after = ["penthesileia-memnon"]
variants = [
  { source = "hyginus.fabulae 107", text = "히기누스는 아폴론이 파리스의 모습으로 나타나 아킬레우스의 발꿈치를 쏘았다고 한다." },
]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장 「영웅들의 죽음」. 히기누스 107 은 아폴론이 파리스의 모습을 했다고 하여 variants 에 넣었다."
sources = ["apollodorus.library E.5.3-E.5.5", "homer.iliad 22.358-360", "homer.odyssey 24.36-97", "ovid.metamorphoses 12.580-628"]

[[event]]
id = "aias-dies"
name_ko = "아이아스와 무구 다툼"
era = 6
seq = 260
span = "days"
place = "troy"
cast = [
  { figure = "aias", role = "주인공" },
  { figure = "odysseus", role = "상대" },
  { figure = "athena", role = "상대" },
  { figure = "agamemnon", role = "등장" },
  { figure = "menelaos", role = "등장" },
]
oneliner = "아킬레우스의 갑옷을 두고 다투다 진 아이아스가 스스로 목숨을 끊었다."
body = """
아킬레우스의 갑옷을 가장 뛰어난 사람에게 주기로 했다.
아이아스와 오디세우스가 나섰고, 오디세우스가 골라졌다.
아이아스는 너무 분해서 밤에 군대를 치려 했다.
아테나가 정신을 흐리게 해 소와 양 떼를 사람으로 알고 죽이게 했다.
정신이 돌아온 아이아스는 스스로 목숨을 끊었다.
"""
fun = "아이아스의 피에서 붉은 꽃이 피었다. 꽃잎에는 그의 이름 첫 글자이자 슬픈 울음소리인 '아이'가 적혀 있다."
sensitivity = "soften"
caused_by = ["achilleus-dies"]
after = ["achilleus-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장. 저승의 아이아스는 오디세우스에게 끝까지 말을 하지 않았다(오디세이아 11.543-564)."
sources = ["apollodorus.library E.5.6-E.5.7", "ovid.metamorphoses 13.1-398", "homer.odyssey 11.543-564"]

[[event]]
id = "paris-dies"
name_ko = "필록테테스가 돌아오고 파리스가 죽다"
era = 6
seq = 270
span = "days"
places = ["lemnos", "troy"]
cast = [
  { figure = "philoktetes", role = "주인공" },
  { figure = "paris", role = "피해" },
  { figure = "odysseus", role = "도움" },
  { figure = "diomedes", role = "도움" },
  { figure = "kalchas", role = "도움" },
  { figure = "helene", role = "등장" },
]
oneliner = "헤라클레스의 활이 돌아왔고, 필록테테스가 파리스를 쏘았다."
body = """
열 해가 되어도 성이 무너지지 않아 그리스군은 지쳤다.
칼카스가 헤라클레스의 활과 화살이 없으면 트로이를 못 얻는다고 했다.
오디세우스와 디오메데스가 렘노스로 가서 필록테테스를 데려왔다.
의사 포달레이리오스가 상처를 고쳐 주었다.
필록테테스가 파리스를 화살로 쏘았고, 파리스는 죽었다.
"""
fun = "파리스는 화살에 맞고 첫 아내 오이노네에게 갔다. 오이노네만 고칠 수 있었는데, 화가 나서 고쳐 주지 않았다."
caused_by = ["tenedos-philoktetes", "achilleus-dies"]
after = ["aias-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장. 오이노네·포달레이리오스는 등록부에 없어 이름만. 오이노네의 죽음(3.12.6)은 쓰지 않는다."
sources = ["apollodorus.library E.5.8", "apollodorus.library 3.12.6", "hyginus.fabulae 102"]

[[event]]
id = "helenos-conditions"
name_ko = "헬레노스의 말, 네옵톨레모스와 팔라디온"
era = 6
seq = 280
span = "season"
places = ["mt-ida-troad", "skyros", "troy"]
cast = [
  { figure = "odysseus", role = "주인공" },
  { figure = "helenos", role = "피해" },
  { figure = "kalchas", role = "도움" },
  { figure = "neoptolemos", role = "도움" },
  { figure = "diomedes", role = "도움" },
  { figure = "helene", role = "도움" },
  { figure = "deiphobos", role = "등장" },
  { figure = "athena", role = "등장" },
]
oneliner = "붙잡힌 헬레노스가 트로이가 무너질 세 가지 조건을 말했다."
body = """
파리스가 죽은 뒤 헬레노스는 데이포보스와 다투고 이데 산으로 갔다.
오디세우스가 그를 붙잡아 트로이를 얻는 방법을 말하게 했다.
펠롭스의 뼈, 네옵톨레모스, 그리고 팔라디온을 훔치는 것, 세 가지였다.
그리스군은 뼈를 가져오고, 스키로스에서 네옵톨레모스를 데려왔다.
오디세우스가 거지로 꾸미고 들어가 헬레네의 도움으로 팔라디온을 훔쳤다.
"""
fun = "팔라디온은 하늘에서 떨어진 아테나의 나무 조각상이다. 이것이 성 안에 있는 동안은 트로이를 얻을 수 없었다."
caused_by = ["paris-dies"]
after = ["paris-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장 「오디세우스의 계획」. 펠롭스는 era 4 인물이라 cast 에 넣지 않고 이름만."
sources = ["apollodorus.library E.5.9-E.5.13", "apollodorus.library 3.12.3", "homer.odyssey 11.506-537"]

[[event]]
id = "wooden-horse-built"
name_ko = "트로이 목마를 만들다"
era = 6
seq = 290
span = "days"
places = ["troy", "tenedos"]
cast = [
  { figure = "odysseus", role = "주인공" },
  { figure = "athena", role = "도움" },
  { figure = "sinon", role = "도움" },
  { figure = "neoptolemos", role = "등장" },
  { figure = "menelaos", role = "등장" },
  { figure = "diomedes", role = "등장" },
  { figure = "agamemnon", role = "등장" },
]
oneliner = "오디세우스의 꾀로 속이 빈 큰 나무 말을 만들고, 배들은 떠난 척했다."
body = """
오디세우스의 말대로 에페이오스가 이데 산의 나무로 큰 말을 만들었다.
말의 속은 비었고 옆구리에 문이 있었다.
가장 용감한 장수들이 안에 들어갔고, 오디세우스가 이들을 이끌었다.
말에는 아테나에게 바치는 선물이라고 새겼다.
나머지는 막사를 태우고 테네도스 뒤에 숨었고, 시논만 남았다.
"""
fun = "안에 들어간 사람 수는 쉰이라고도 하고, 어떤 시인은 삼천이라고도 했다."
caused_by = ["helenos-conditions"]
after = ["helenos-conditions"]
note = "참고: 처음 읽는 그리스 로마 신화 12권 4장 「트로이 목마」. 에페이오스는 등록부에 없어 이름만. 히기누스 108 도 같은 이야기(에페이오스, 새긴 글, 테네도스)라 sources 에 더했다."
sources = ["apollodorus.library E.5.14-E.5.15", "homer.odyssey 8.492-495", "virgil.aeneid 2.13-39", "hyginus.fabulae 108"]

[[event]]
id = "horse-into-troy"
name_ko = "라오코온과 시논, 목마가 성 안으로"
era = 6
seq = 300
span = "days"
place = "troy"
cast = [
  { figure = "sinon", role = "주인공" },
  { figure = "laokoon", role = "피해" },
  { figure = "kassandra", role = "도움" },
  { figure = "priamos", role = "등장" },
  { figure = "apollon", role = "등장" },
  { figure = "athena", role = "등장" },
]
oneliner = "트로이 사람들이 카산드라와 라오코온의 말을 듣지 않고 목마를 끌어들였다."
body = """
아침에 트로이 사람들은 그리스군이 떠난 것을 보고 기뻐했다.
붙잡힌 시논이 이것은 아테나의 선물이라고 거짓말을 했다.
카산드라가 안에 군사가 있다고 했고, 라오코온이 창을 던졌다.
그때 바다에서 뱀 두 마리가 나와 라오코온과 두 아들을 죽였다.
사람들은 신의 뜻이라 여겨 성벽을 헐고 말을 끌어들인 뒤 잔치를 벌였다.
"""
fun = "목마를 끌고 갈 때 네 번이나 안에서 무기 소리가 났지만 아무도 마음에 두지 않았다고 베르길리우스가 적었다."
variants = [
  { source = "apollodorus.library E.5.17", text = "어떤 사람은 말을 태우자고, 어떤 사람은 벼랑에서 떨어뜨리자고 했다. 하지만 대부분이 신에게 바친 것이라 두자고 했다." },
]
sensitivity = "soften"
