헬레네를 돌려 달라는 사절을 트로이가 거절했다.
맨 먼저 땅에 내린 프로테실라오스가 헥토르의 손에 죽었다.
그리스군은 트로이를 둘러싸고 아홉 해 동안 이웃 도시들을 무너뜨렸다.
브리세이스와 크리세이스는 그때 붙잡혀 왔다.
아홉 해가 지나자 이웃 나라들이 트로이를 도우러 왔다.
"""
fun = "아킬레우스는 배로 열두 도시, 걸어서 열한 도시를 무너뜨렸다고 스스로 말했다."
after = ["tenedos-philoktetes"]
note = "참고: 처음 읽는 그리스 로마 신화 11권 2장 「9년의 시간」. 트로일로스의 죽음(E.3.32)은 쓰지 않는다."
sources = ["apollodorus.library E.3.28-E.3.34", "homer.iliad 2.695-710", "homer.iliad 9.328-329", "homer.iliad 1.366-369", "homer.iliad 2.688-694", "hyginus.fabulae 103"]

