  { figure = "hektor", role = "상대" },
  { figure = "achilleus", role = "주인공" },
  { figure = "odysseus", role = "등장" },
  { figure = "menelaos", role = "등장" },
  { figure = "thetis", role = "도움" },
  { figure = "briseis", role = "피해" },
