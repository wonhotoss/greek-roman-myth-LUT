"""
sensitivity = "soften"
caused_by = ["thebes-plague-truth"]
note = "브리프 §6 — 눈은 '스스로 눈을 못 보게 했다' 까지, 상세 없음. 콜로노스는 아테네 근교라 place 를 athens 로 두었다."
sources = ["apollodorus.library 3.5.9"]

