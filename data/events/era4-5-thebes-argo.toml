# era 4~5 — 카드모스와 테베, 오이디푸스, 테베 공방전, 아르고호, 메데이아,
# 오르페우스, 칼리돈의 멧돼지, 디오스쿠로이.
# 집필: THE. seq 구간 — era 4: 200~299 / era 5: 100~199, 200~399, 900~999.

# ── era 4 · 카드모스가 테베를 세우다 ────────────────────────

[[event]]
id = "kadmos-seeks-europa"
name_ko = "카드모스가 누이를 찾아 떠나다"
era = 4
seq = 200
span = "years"
place = "thrake"
cast = [
  { figure = "kadmos", role = "주인공" },
]
oneliner = "찾아오지 못하면 돌아오지 말라는 말을 듣고 집을 나섰다."
body = """
누이 에우로페가 사라졌다. 제우스가 황소로 모습을 바꾸어 데려간 것이었다.
아버지 아게노르는 아들들에게 누이를 찾아오라고 했다.
찾지 못하면 돌아오지 말라고도 했다.
카드모스는 어머니와 함께 트라키아에 머물렀다.
"""
sensitivity = "soften"
note = "참고: 처음 읽는 그리스 로마 신화 9권 부록. 아게노르·텔레팟사·포이닉스·킬릭스는 등록부에 없어 이름만 부른다. 에우로페는 ATH 소유."
sources = ["apollodorus.library 3.1.1", "ovid.metamorphoses 3.1-10"]

[[event]]
id = "kadmos-follows-cow"
name_ko = "델포이의 말과 암소"
era = 4
seq = 210
span = "days"
places = ["delphi", "thebes"]
cast = [
  { figure = "kadmos", role = "주인공" },
  { figure = "apollon", role = "도움" },
]
oneliner = "누이는 잊고 암소를 따라가라는 대답이 왔다."
body = """
카드모스는 어디서 살아야 하는지 델포이에 물었다.
누이는 더 찾지 말고, 만나는 암소를 따라가라는 대답이 왔다.
암소가 지쳐 누운 자리에 성을 세우라고 했다.
암소는 포키스와 보이오티아를 지나 어느 자리에 누웠다.
"""
fun = "테베 사람들은 그 암소의 옆구리마다 보름달 같은 흰 무늬가 있었다고 했다. 암소가 누운 자리도 오래 보여 주었다."
caused_by = ["kadmos-seeks-europa"]
sources = ["apollodorus.library 3.4.1", "ovid.metamorphoses 3.6-25", "pausanias.greece 9.12"]

[[event]]
id = "dragon-teeth-sown"
name_ko = "용을 죽이고 이빨을 심다"
era = 4
seq = 220
span = "moment"
place = "thebes"
cast = [
  { figure = "kadmos", role = "주인공" },
  { figure = "ares", role = "상대" },
  { figure = "athena", role = "도움" },
]
oneliner = "땅에 심은 이빨에서 무장한 사람들이 솟아났다."
body = """
카드모스가 제사에 쓸 물을 뜨러 사람들을 샘으로 보냈다.
샘을 지키던 용이 그들을 덮쳤다.
카드모스는 용을 죽이고, 아테나의 말대로 그 이빨을 땅에 심었다.
심은 자리에서 무장한 사람들이 솟아나 서로 싸웠고, 다섯만 남았다.
"""
fun = "살아남은 다섯을 '스파르토이', 곧 '심어져 난 사람들'이라고 불렀다. 테베의 큰 집안들이 이 다섯에서 나왔다고 했다."
caused_by = ["kadmos-follows-cow"]
sources = ["apollodorus.library 3.4.1", "ovid.metamorphoses 3.26-130", "pausanias.greece 9.5"]

[[event]]
id = "thebes-founded"
name_ko = "테베를 세우고 하르모니아와 결혼하다"
era = 4
seq = 230
span = "years"
place = "thebes"
cast = [
  { figure = "kadmos", role = "주인공" },
  { figure = "harmonia", role = "주인공" },
  { figure = "ares", role = "상대" },
  { figure = "zeus", role = "도움" },
  { figure = "athena", role = "도움" },
  { figure = "aphrodite", role = "등장" },
  { figure = "hephaistos", role = "도움" },
]
oneliner = "용을 죽인 값을 치른 뒤, 신들이 모두 온 결혼식을 했다."
body = """
카드모스는 용을 죽인 값으로 여덟 해를 아레스에게 일해 주었다.
그 뒤 아테나가 나라를 얻어 주고, 제우스가 하르모니아를 아내로 주었다.
결혼식에는 신들이 하늘을 비우고 내려와 노래했다.
카드모스는 헤파이스토스가 만든 목걸이를 선물했다. 이렇게 테베가 섰다.
"""
fun = "성 안쪽 언덕을 카드모스의 이름을 따 카드메이아라고 불렀다. 지금도 티바 시내에 그 언덕이 있다."
caused_by = ["dragon-teeth-sown"]
sources = ["apollodorus.library 3.4.2", "hesiod.theogony 933-937", "pausanias.greece 9.5", "pausanias.greece 9.12"]

[[event]]
id = "phrixos-golden-ram"
name_ko = "프릭소스와 황금 양이 콜키스로 가다"
era = 4
seq = 240
span = "days"
places = ["kolchis"]
cast = [
  { figure = "phrixos", role = "주인공" },
  { figure = "hermes", role = "도움" },
  { figure = "zeus", role = "등장" },
]
oneliner = "황금 털을 가진 양이 남매를 태우고 하늘을 날았다."
body = """
새어머니가 꾸민 일로 프릭소스가 제단에 오르게 되었다.
어머니 네펠레가 황금 털을 가진 양을 보내 남매를 태워 하늘로 데려갔다.
누이 헬레는 바다에 떨어졌다. 그 바다를 헬레스폰토스라고 부른다.
콜키스에 닿아 양을 바치고, 털은 왕 아이에테스에게 주었다.
"""
sensitivity = "soften"
fun = "황금 양털은 아레스의 숲 참나무에 걸려 잠들지 않는 용이 지켰다. 아르고호가 찾으러 가는 것이 이 털이다."
note = "이노·네펠레·헬레는 등록부에 없어 이름만 부른다. aietes 는 era 5 로 등록되어 있어 cast 에 넣지 않고 body 에서 이름만 부른다."
sources = ["apollodorus.library 1.9.1", "hyginus.fabulae 3"]

# ── era 5 · 저주받은 왕자 오이디푸스 ────────────────────────

[[event]]
id = "aktaion-dies"
name_ko = "악타이온이 사슴이 되다"
era = 5
seq = 100
span = "moment"
place = "mt-kithairon"
cast = [
  { figure = "aktaion", role = "피해" },
  { figure = "artemis", role = "상대" },
  { figure = "kadmos", role = "등장" },
]
oneliner = "사슴이 되어 자기 개들에게 죽었다."
body = """
카드모스의 외손자 악타이온은 뛰어난 사냥꾼이었다.
사냥을 끝내고 쉴 곳을 찾다가 아르테미스가 목욕하는 골짜기에 들어섰다.
아르테미스는 그를 사슴으로 바꾸었다.
데리고 다니던 개 오십 마리가 주인을 알아보지 못하고 덮쳤다.
"""
sensitivity = "soften"
fun = "개들은 주인을 찾아 울며 돌아다녔다. 케이론이 악타이온의 모습을 만들어 보여 주자 그제야 그쳤다."
after = ["thebes-founded"]
note = "오비디우스 3.131-137 이 '테베가 서고 카드모스가 행복해 보일 때, 손자가 첫 슬픔이었다'며 순서를 말한다 — 그래서 after 로 붙였다."
sources = ["apollodorus.library 3.4.4", "ovid.metamorphoses 3.131-252"]

[[event]]
id = "teiresias-blinded"
name_ko = "테이레시아스가 앞일을 알게 되다"
era = 5
seq = 110
span = "moment"
place = "thebes"
cast = [
  { figure = "teiresias", role = "주인공" },
  { figure = "athena", role = "상대" },
  { figure = "hera", role = "상대" },
  { figure = "zeus", role = "도움" },
]
oneliner = "눈을 잃은 대신 새들의 말과 앞일을 알게 되었다."
body = """
테이레시아스가 왜 눈이 보이지 않게 되었는지는 이야기가 여러 가지다.
아테나가 눈을 감기는 대신 귀를 씻어 주었다고 한다.
그래서 새들의 말을 알아듣게 되었다.
제우스와 헤라의 말다툼을 판정한 벌로 헤라가 눈을 감겼다고도 한다.
그 뒤 테베 사람들은 큰일마다 이 사람에게 물었다.
"""
note = "원전이 셋으로 갈려(아폴로도로스 3.6.7) 하나를 고르지 않았다. 인과로 이어지는 사건이 없어 seq 만으로 자리를 잡는다 — 불확실 점검에 잡히는 것이 맞다."
sources = ["apollodorus.library 3.6.7"]

[[event]]
id = "laios-warned"
name_ko = "라이오스가 아기를 내다 버리다"
era = 5
seq = 120
span = "moment"
places = ["delphi", "thebes", "mt-kithairon"]
cast = [
  { figure = "laios", role = "주인공" },
  { figure = "iokaste", role = "등장" },
  { figure = "oidipous", role = "피해" },
]
oneliner = "아들을 낳지 말라는 말을 듣고도 아들을 얻었다."
body = """
테베의 왕 라이오스는 아들을 낳지 말라는 말을 델포이에서 들었다.
아들이 태어나면 그 아들이 아버지를 죽일 것이라고 했다.
그래도 아들이 태어나자, 발목을 꿰어 하인에게 산에 버리게 했다.
아기는 죽지 않았다. 코린토스 왕의 소치기들이 찾아내 왕비에게 데려갔다.
"""
sensitivity = "soften"
fun = "코린토스의 왕비는 아기 발목을 고쳐 주고 '부어오른 발'이라는 뜻으로 오이디푸스라고 불렀다."
note = "참고: 처음 읽는 그리스 로마 신화 9권 2장 「불행한 예언」. 폴리보스·페리보이아는 등록부에 없어 이름만 부른다."
sources = ["apollodorus.library 3.5.7"]

[[event]]
id = "oidipous-asks-delphi"
name_ko = "오이디푸스가 자기 부모를 묻다"
era = 5
seq = 130
span = "moment"
place = "delphi"
cast = [
  { figure = "oidipous", role = "주인공" },
]
oneliner = "고향에 가지 말라는 무서운 대답이 왔다."
body = """
자란 오이디푸스는 힘이 세고 뛰어나서 시샘을 받았다.
사람들이 '너는 이 집 아이가 아니다'라고 놀렸다.
키워 준 어머니에게 물어도 알 수 없어 델포이로 갔다.
고향에 가면 아버지를 죽이게 된다는 대답이 왔다. 그는 코린토스가 고향이라고 믿고 그곳을 떠났다.
"""
sensitivity = "soften"
caused_by = ["laios-warned"]
sources = ["apollodorus.library 3.5.7"]

[[event]]
id = "laios-killed"
name_ko = "좁은 길에서 아버지를 죽이다"
era = 5
seq = 140
span = "moment"
cast = [
  { figure = "oidipous", role = "주인공" },
  { figure = "laios", role = "피해" },
]
oneliner = "모르는 사람과 다투었는데, 그가 아버지였다."
body = """
오이디푸스는 수레를 타고 포키스의 좁은 길을 지나갔다.
맞은편에서 오던 수레가 길을 비키라고 했다.
비키지 않자 그쪽에서 오이디푸스의 말 한 마리를 죽였다.
오이디푸스는 화가 나 두 사람을 죽였다. 그 가운데 한 사람이 라이오스였다.
"""
sensitivity = "soften"
caused_by = ["oidipous-asks-delphi", "laios-warned"]
note = "장소는 원전이 '포키스의 좁은 길'이라고만 한다(아폴로도로스 3.5.7). 장소 항목을 만들 만큼 특정되지 않아 place 를 비웠다 — 불확실 점검에 잡힌다."
sources = ["apollodorus.library 3.5.7", "homer.odyssey 11.271-280"]

[[event]]
id = "sphinx-riddle"
name_ko = "스핑크스의 수수께끼"
era = 5
seq = 150
span = "season"
place = "thebes"
cast = [
  { figure = "sphinx", role = "상대" },
  { figure = "oidipous", role = "주인공" },
  { figure = "kreon", role = "등장" },
  { figure = "hera", role = "상대" },
]
oneliner = "답을 못 하면 잡혀갔다. 오이디푸스가 답을 맞혔다."
body = """
라이오스가 죽은 뒤 테베에 스핑크스가 왔다.
목소리는 하나인데 네 발, 두 발, 세 발로 걷는 것이 무엇이냐.
답을 못 하는 사람을 하나씩 잡아갔다.
오이디푸스가 사람이라고 답하자, 스핑크스는 성벽에서 몸을 던졌다.
"""
fun = "기어 다니는 아기는 네 발, 자란 사람은 두 발, 지팡이를 든 노인은 세 발이다."
caused_by = ["laios-killed"]
note = "참고: 처음 읽는 그리스 로마 신화 9권 2장 「스핑크스의 수수께끼」, 6권 2장 「스핑크스」. 크레온의 아들 하이몬도 잡혀갔다 — 등록부에 없어 이름을 넣지 않았다."
sources = ["apollodorus.library 3.5.8", "pausanias.greece 9.26"]

[[event]]
id = "oidipous-becomes-king"
name_ko = "오이디푸스가 테베의 왕이 되다"
era = 5
seq = 160
span = "years"
place = "thebes"
cast = [
  { figure = "oidipous", role = "주인공" },
  { figure = "iokaste", role = "주인공" },
  { figure = "kreon", role = "도움" },
]
oneliner = "수수께끼를 푼 값으로 왕자리와 왕비를 받았다."
body = """
크레온은 수수께끼를 푼 사람에게 왕자리를 주겠다고 알렸다.
그래서 오이디푸스는 테베의 왕이 되고 이오카스테와 결혼했다.
그 여왕이 자기 어머니라는 것은 아무도 몰랐다.
아들 둘과 딸 둘이 태어났다.
"""
sensitivity = "soften"
caused_by = ["sphinx-riddle"]
note = "브리프 §6 — 계보는 사실대로, body 는 '자기 어머니였다' 까지. 아이들을 에우리가니아가 낳았다는 이설도 있다(아폴로도로스 3.5.8)."
sources = ["apollodorus.library 3.5.8", "homer.odyssey 11.271-280"]

[[event]]
id = "thebes-plague-truth"
name_ko = "역병과 밝혀진 진실"
era = 5
seq = 170
span = "season"
place = "thebes"
cast = [
  { figure = "oidipous", role = "피해" },
  { figure = "iokaste", role = "피해" },
  { figure = "teiresias", role = "도움" },
]
oneliner = "누가 라이오스를 죽였는지 찾다가 자기를 찾았다."
body = """
테베에 나쁜 병이 돌았다.
라이오스를 죽인 사람을 찾아내야 병이 그친다는 말이 왔다.
오이디푸스는 그 사람을 찾다가, 그것이 자기라는 것을 알게 되었다.
그 여왕이 자기 어머니라는 것도 함께 밝혀졌다. 이오카스테는 스스로 목숨을 끊었다.
"""
sensitivity = "soften"
caused_by = ["oidipous-becomes-king", "laios-killed"]
note = "브리프 §6. 역병은 소포클레스 쪽 전승이지만 호메로스 11.271-280 도 '신들이 그 일을 온 세상에 알렸다'고 한다 — 그 선을 지켰다. 참고: 처음 읽는 그리스 로마 신화 9권 2장 「밝혀진 진실」."
sources = ["apollodorus.library 3.5.9", "homer.odyssey 11.271-280"]

[[event]]
id = "oidipous-exiled"
name_ko = "오이디푸스가 테베를 떠나다"
era = 5
seq = 180
span = "years"
places = ["thebes", "athens"]
cast = [
  { figure = "oidipous", role = "피해" },
  { figure = "antigone", role = "도움" },
  { figure = "kreon", role = "상대" },
  { figure = "theseus", role = "도움" },
]
oneliner = "스스로 눈을 못 보게 하고 도시를 떠났다."
body = """
오이디푸스는 스스로 눈을 못 보게 했다.
쫓겨날 때 두 아들은 손을 내밀지 않았다.
그래서 아들들을 저주했다.
