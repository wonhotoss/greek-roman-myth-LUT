fun = "청동 사람의 몸에 흐르던 것은 피가 아니라 이코르라고 불리는 신들의 액체였다."
after = ["orpheus-outsings-seirenes"]
note = "죽는 방식은 원전이 셋으로 갈린다(아폴로도로스 1.9.26) — 약으로 미치게 했다 / 죽지 않게 해 주겠다며 못을 뺐다 / 포이아스가 발목을 쏘았다. 그래서 '꾀에 걸려'로 두었다."
sources = ["apollodorus.library 1.9.26"]

[[event]]
id = "argo-returns"
name_ko = "이올코스로 돌아오고 펠리아스가 죽다"
era = 5
seq = 330
span = "season"
place = "iolkos"
cast = [
  { figure = "iason", role = "주인공" },
  { figure = "medeia", role = "도움" },
  { figure = "pelias", role = "피해" },
  { figure = "argonautai", role = "등장" },
]
oneliner = "넉 달 만에 털을 들고 돌아왔고, 펠리아스는 죽었다."
body = """
아르고호는 넉 달 걸린 항해를 끝내고 이올코스로 돌아왔다.
이아손이 황금 양털을 내놓았지만, 그 사이 아버지 아이손은 죽어 있었다.
메데이아는 펠리아스의 딸들을 속여 아버지를 죽게 만들었다.
펠리아스의 아들 아카스토스는 이아손과 메데이아를 이올코스에서 쫓아냈다.
"""
sensitivity = "soften"
after = ["talos-of-crete"]
note = "브리프 §6 — '죽였다' 사실만. 아폴로도로스 1.9.27 의 상세는 옮기지 않았다. 아카스토스는 등록부에 없어 이름만 부른다. 배는 이스트모스에서 포세이돈에게 바쳐졌다."
sources = ["apollodorus.library 1.9.26-1.9.27", "ovid.metamorphoses 7.159-349"]

[[event]]
id = "medeia-in-corinth"
name_ko = "코린토스의 메데이아"
era = 5
seq = 340
span = "years"
place = "corinth"
cast = [
  { figure = "medeia", role = "주인공" },
  { figure = "iason", role = "상대" },
  { figure = "glauke", role = "피해" },
]
oneliner = "이아손이 다른 사람과 결혼하려 했고, 메데이아가 그대로 갚았다."
body = """
쫓겨난 두 사람은 코린토스에서 열 해를 살았다.
그런데 이아손은 코린토스 왕의 딸 글라우케와 결혼하려 했다.
메데이아는 신부에게 옷을 보냈고, 글라우케와 그 아버지가 죽었다.
자기가 이아손에게서 얻은 두 아이도 죽였다.
"""
sensitivity = "soften"
after = ["argo-returns"]
note = "브리프 §6 — '죽였다' 사실만. 코린토스의 왕 크레온(테베의 크레온과 다른 사람)은 이름만 부른다."
variants = [
  { source = "pausanias.greece 2.3", text = "파우사니아스는 코린토스 사람들이 아이들을 죽였다고 전한다. 그래서 코린토스에서는 해마다 그 아이들을 위한 제사를 지냈다." },
  { source = "apollodorus.library 1.9.28", text = "메데이아가 아직 어린 아이들을 헤라의 제단에 남기고 떠났는데, 코린토스 사람들이 데려가 죽였다는 이야기도 있다." },
]
sources = ["apollodorus.library 1.9.28", "ovid.metamorphoses 7.350-401", "pausanias.greece 2.3"]

[[event]]
id = "medeia-leaves-for-athens"
name_ko = "메데이아가 아테네로 가다"
era = 5
seq = 350
span = "days"
places = ["corinth", "athens"]
cast = [
  { figure = "medeia", role = "주인공" },
]
oneliner = "날개 달린 용이 끄는 수레를 타고 하늘로 떠났다."
body = """
메데이아는 할아버지 헬리오스에게서 수레를 얻었다.
날개 달린 용이 끄는 수레였다.
그것을 타고 펠리온 산 위를 지나 하늘로 떠났다.
내린 곳은 아테네였다. 아테네에서의 일은 테세우스 이야기에 이어진다.
"""
caused_by = ["medeia-in-corinth"]
note = "아테네에서의 일(아이게우스와의 결혼, 테세우스를 노림)은 ATH 가 쓴다. 여기서는 '아테네로 갔다'까지."
sources = ["apollodorus.library 1.9.28", "ovid.metamorphoses 7.350-401"]

# ── era 5 · 지하 세계로 간 오르페우스 ────────────────────────

[[event]]
id = "eurydike-dies"
name_ko = "에우리디케가 뱀에게 물리다"
era = 5
seq = 360
span = "moment"
place = "thrake"
cast = [
  { figure = "eurydike", role = "피해" },
  { figure = "orpheus", role = "피해" },
]
oneliner = "결혼한 날 풀밭에서 뱀에게 물려 죽었다."
body = """
오르페우스가 에우리디케와 결혼했다.
그날 에우리디케는 풀밭을 걷다가 뱀에게 발을 물렸다.
그대로 죽어 저승으로 내려갔다.
오르페우스는 땅 위에서 오래 울었지만 아무것도 달라지지 않았다.
"""
note = "참고: 처음 읽는 그리스 로마 신화 4권 1장 「지하 세계로 간 오르페우스」. 오르페우스 이야기가 아르고호 항해 앞인지 뒤인지 원전이 말하지 않는다 — 인과로 잇지 않았다."
sources = ["apollodorus.library 1.3.2", "ovid.metamorphoses 10.1-10"]

[[event]]
id = "orpheus-in-underworld"
name_ko = "돌이킬 수 없는 실수"
era = 5
seq = 370
span = "days"
place = "hades-realm"
cast = [
  { figure = "orpheus", role = "주인공" },
  { figure = "eurydike", role = "피해" },
  { figure = "hades", role = "상대" },
  { figure = "persephone", role = "도움" },
]
oneliner = "노래로 저승을 움직였는데, 마지막에 뒤를 돌아보았다."
body = """
오르페우스는 저승으로 내려가 노래를 불렀다.
그 노래에 벌받던 사람들이 잠깐 벌을 잊었다.
저승의 왕은 집에 닿기 전에 뒤돌아보지 말라는 조건으로 돌려주었다.
땅 위에 거의 다 왔을 때 오르페우스는 뒤를 돌아보았다. 에우리디케는 다시 아래로 끌려갔다.
"""
fun = "이 이야기에서 오르페우스가 이긴 것은 저승의 왕이고, 진 것은 자기 자신이다."
caused_by = ["eurydike-dies"]
note = "참고: 처음 읽는 그리스 로마 신화 4권 1장 「돌이킬 수 없는 실수」. 파우사니아스 9.30 은 이 이야기를 그리스 사람들이 믿는 사실이 아닌 것 가운데 하나로 적는다."
sources = ["apollodorus.library 1.3.2", "ovid.metamorphoses 10.11-85", "pausanias.greece 9.30"]

# ── era 5 · 칼리돈의 멧돼지와 쌍둥이자리 ────────────────────

[[event]]
id = "kalydon-boar-hunt"
name_ko = "칼리돈의 멧돼지 사냥"
era = 5
seq = 380
span = "days"
place = "kalydon"
cast = [
  { figure = "meleagros", role = "주인공" },
  { figure = "atalante", role = "주인공" },
  { figure = "kalydonian-boar", role = "상대" },
  { figure = "artemis", role = "상대" },
  { figure = "oineus", role = "등장" },
  { figure = "kastor", role = "등장" },
  { figure = "polydeukes", role = "등장" },
  { figure = "iason", role = "등장" },
  { figure = "theseus", role = "등장" },
  { figure = "peleus", role = "등장" },
  { figure = "telamon", role = "등장" },
  { figure = "amphiaraos", role = "등장" },
]
oneliner = "아르테미스가 보낸 멧돼지를 잡으러 그리스 전체가 모였다."
body = """
오이네우스가 첫 곡식을 바칠 때 아르테미스만 빼놓았다.
아르테미스는 엄청나게 큰 멧돼지를 보내 밭과 짐승과 사람을 덮치게 했다.
오이네우스는 그리스에서 가장 뛰어난 사람들을 다 불렀다.
처음 화살을 맞힌 것은 아탈란테였다.
마지막에 잡은 것은 멜레아그로스이고, 가죽은 아탈란테가 받았다.
"""
fun = "몇 사람은 여자와 함께 사냥하기를 마다했다. 멜레아그로스가 그러면 사냥을 안 한다고 해서 다 따라나섰다."
note = "oineus 는 HER, theseus 는 ATH, peleus·telamon 은 TRO 소유 — 참조만. 명단은 아폴로도로스 1.8.2."
sources = ["apollodorus.library 1.8.2", "ovid.metamorphoses 8.260-444", "homer.iliad 9.529-546"]

[[event]]
id = "meleagros-dies"
name_ko = "멜레아그로스의 죽음"
era = 5
seq = 385
span = "moment"
place = "kalydon"
cast = [
  { figure = "meleagros", role = "피해" },
  { figure = "atalante", role = "등장" },
  { figure = "oineus", role = "등장" },
]
oneliner = "상자에 감춰 둔 나무 막대가 다 타면서 끝났다."
body = """
멜레아그로스가 태어난 지 이레 되던 날 운명의 여신들이 왔다.
화덕에서 타고 있는 나무 막대가 다 타면 이 아이도 끝난다고 했다.
어머니 알타이아는 그 막대를 꺼내 상자에 감추었다.
가죽을 두고 다투다 멜레아그로스가 알타이아의 형제들을 죽였다.
알타이아는 그 막대를 불에 넣었다.
"""
sensitivity = "soften"
caused_by = ["kalydon-boar-hunt"]
note = "브리프 §6 — 사실만. 알타이아·테스티오스의 아들들은 등록부에 없어 이름만 부른다."
variants = [
  { source = "apollodorus.library 1.8.3", text = "다르게 전하는 이야기도 있다. 가죽을 두고 나라끼리 싸움이 났고, 멜레아그로스는 그 싸움에서 죽었다는 것이다." },
  { source = "homer.iliad 9.550-599", text = "호메로스는 나무 막대를 말하지 않는다. 어머니의 저주 때문에 멜레아그로스가 싸움에 나가지 않고 방에 머물렀다는 데까지만 이야기한다." },
]
sources = ["apollodorus.library 1.8.2-1.8.3", "ovid.metamorphoses 8.445-546", "homer.iliad 9.550-599"]

[[event]]
id = "dioskouroi-alternate"
name_ko = "쌍둥이가 하루씩 번갈아 살다"
era = 5
seq = 390
span = "moment"
place = "sparta"
open = true
cast = [
  { figure = "kastor", role = "주인공" },
  { figure = "polydeukes", role = "주인공" },
  { figure = "zeus", role = "도움" },
]
oneliner = "형이 죽자 동생이 혼자 살기를 마다했다."
body = """
카스토르와 폴리데우케스는 소를 두고 이다스·린케우스 형제와 다투었다.
그 다툼에서 카스토르가 죽었다.
제우스는 폴리데우케스만 하늘로 데려가려 했다.
폴리데우케스는 혼자 죽지 않는 몸으로 있기를 마다했다.
제우스는 둘이 하루씩 번갈아 살게 해 주었다.
"""
sensitivity = "soften"
fun = "두 사람은 쌍둥이자리가 되었다. 뱃사람들은 폭풍이 오면 이 둘을 불렀다. 돛대 끝에 불빛이 보이면 둘이 왔다고 믿었다."
note = "참고: 처음 읽는 그리스 로마 신화 5권 「쌍둥이자리」. 이다스·린케우스는 등록부에 없어 이름만 부른다. 되풀이되는 일이라 open = true. sparta 는 TRO 소유 장소 — 참조만."
sources = ["apollodorus.library 3.11.2", "homer.odyssey 11.298-304", "homeric.hymns dioscuri 1-19"]

# ── era 5 · 테베 공방전과 안티고네 ────────────────────────

[[event]]
id = "brothers-quarrel"
name_ko = "형제가 왕자리를 두고 다투다"
era = 5
seq = 900
span = "years"
places = ["thebes", "argos"]
cast = [
  { figure = "eteokles", role = "주인공" },
  { figure = "polyneikes", role = "주인공" },
  { figure = "adrastos", role = "도움" },
]
oneliner = "한 해씩 번갈아 다스리기로 한 약속이 깨졌다."
body = """
오이디푸스의 두 아들은 한 해씩 번갈아 다스리기로 약속했다.
그런데 한쪽이 차례가 끝나도 왕자리를 내주지 않았다.
쫓겨난 폴리네이케스는 하르모니아의 목걸이와 옷을 들고 아르고스로 갔다.
아르고스의 왕 아드라스토스가 사위로 맞아 주었다.
나라를 되찾아 주겠다고도 약속했다.
"""
sensitivity = "soften"
caused_by = ["oidipous-exiled"]
note = "누가 먼저 다스렸는지는 원전이 갈린다(아폴로도로스 3.6.1). 티데우스·아르기아는 등록부에 없어 넣지 않았다."
sources = ["apollodorus.library 3.6.1"]

[[event]]
id = "seven-against-thebes"
name_ko = "일곱 장수가 테베를 치다"
era = 5
seq = 910
span = "season"
place = "thebes"
cast = [
  { figure = "adrastos", role = "주인공" },
  { figure = "polyneikes", role = "주인공" },
  { figure = "amphiaraos", role = "등장" },
  { figure = "eteokles", role = "상대" },
  { figure = "teiresias", role = "도움" },
]
oneliner = "일곱 문 앞에 일곱 장수가 섰고, 하나만 살아 돌아갔다."
body = """
아드라스토스는 일곱 장수를 모아 테베로 갔다.
암피아라오스는 아드라스토스만 살아 남는다는 것을 알았다.
그래서 가지 않으려 했다.
테베에는 성문이 일곱이어서, 문마다 장수 하나씩 섰다.
테이레시아스에게 물은 테베가 버텼고, 아르고스 쪽은 무너졌다.
"""
sensitivity = "soften"
fun = "성벽을 사다리로 오르던 카파네우스는 제우스의 번개에 맞았다. 암피아라오스는 땅이 갈라져 수레와 함께 사라졌다."
caused_by = ["brothers-quarrel"]
note = "일곱 장수 명단은 아폴로도로스 3.6.3. 카파네우스·티데우스·히포메돈·파르테노파이오스는 등록부에 없어 이름만 부르거나 넣지 않았다."
sources = ["apollodorus.library 3.6.3", "apollodorus.library 3.6.6-3.6.8", "homer.iliad 4.376-410"]

[[event]]
id = "brothers-kill-each-other"
name_ko = "형제가 서로를 죽이다"
era = 5
seq = 920
span = "moment"
place = "thebes"
within = "seven-against-thebes"
cast = [
  { figure = "eteokles", role = "피해" },
  { figure = "polyneikes", role = "피해" },
]
oneliner = "두 군대가 보는 앞에서 둘이 맞섰고, 둘 다 죽었다."
body = """
싸움이 길어지자 두 군대가 뜻을 모았다.
왕자리는 두 형제가 맞서 싸워 정하기로 했다.
둘은 서로를 죽였다.
아버지의 저주가 그대로 된 것이다.
"""
sensitivity = "soften"
caused_by = ["seven-against-thebes"]
fun = "테베 사람들은 그 자리에 기둥을 세우고 돌로 만든 방패를 올려 두었다. 파우사니아스가 그것을 보고 적었다."
sources = ["apollodorus.library 3.6.8", "pausanias.greece 9.25"]

[[event]]
id = "antigone-buries-polyneikes"
name_ko = "안티고네가 오빠를 묻다"
era = 5
seq = 930
span = "moment"
place = "thebes"
cast = [
  { figure = "antigone", role = "주인공" },
  { figure = "kreon", role = "상대" },
  { figure = "polyneikes", role = "피해" },
  { figure = "ismene", role = "등장" },
]
oneliner = "묻지 말라는 명령을 어기고 오빠를 묻었다."
body = """
다시 왕이 된 크레온은 쳐들어온 쪽의 시신을 묻지 못하게 했다.
지키는 사람도 세웠다.
안티고네는 오빠 폴리네이케스의 시신을 몰래 옮겨 묻었다.
크레온에게 들켜 벌을 받았다.
"""
