body = """
두 친구는 제우스의 딸을 아내로 삼자고 약속했다.
페이리토오스는 저승의 여왕 페르세포네를 골라, 둘은 저승으로 내려갔다.
하데스는 잔치를 열어 주는 척하며 '잊음의 의자'에 앉게 했다.
두 사람은 의자에 붙어 뱀에 감겼다.
뒷날 헤라클레스가 테세우스만 데리고 올라갔다.
"""
fun = "오디세우스는 저승에서 테세우스와 페이리토오스를 보고 싶었다. 그러나 무서워서 그냥 돌아왔다."
note = "헤라클레스가 풀어 준 일은 HER 의 케르베로스 사건이 다룬다. 헬레네 납치(E.1.23)는 쓰지 않는다. HER 의 케르베로스 사건 seq 가 870 보다 앞이면 시간축에서 구출이 하강보다 먼저가 된다 — 조정 필요."
sources = ["apollodorus.library E.1.23-E.1.24", "homer.odyssey 11.631", "pausanias.greece 1.17.4"]
