fun = "올림피아 제우스 신전의 문 위에 이 사냥 장면이 새겨져 있었다."
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.4", "pausanias.greece 5.10"]

[[event]]
id = "augeias-stables"
name_ko = "아우게이아스의 외양간을 하루에 치우다"
era = 5
seq = 540
