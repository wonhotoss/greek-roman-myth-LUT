]
oneliner = "청동 딱따기 소리로 새를 날아오르게 하고 활로 쏘았다."
body = """
여섯째 일은 스팀팔로스 호수의 새들을 쫓아내는 것이었다.
깊은 숲에 새가 셀 수 없이 모여 있어 어쩔 줄을 몰랐다.
아테나가 헤파이스토스가 만든 청동 딱따기를 주었다.
산 위에서 딱따기를 치자 새들이 놀라 날아올랐다.
헤라클레스는 그 새들을 활로 쏘았다.
"""
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.6"]

