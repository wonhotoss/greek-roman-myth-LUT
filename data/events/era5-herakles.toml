[[event]]
id = "eurytos-archery-contest"
name_ko = "에우리토스의 활쏘기 내기"
era = 5
seq = 1000
span = "moment"
after = ["kerberos-fetched"]
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "eurytos", role = "상대" },
  { figure = "iole", role = "등장" },
  { figure = "iphitos", role = "도움" },
  { figure = "iolaos", role = "등장" },
]
oneliner = "헤라클레스가 이겼지만 에우리토스는 딸 이올레를 주지 않았다."
body = """
일을 모두 마친 헤라클레스는 메가라를 이올라오스에게 아내로 주었다.
그리고 새 아내를 찾다가 오이칼리아 왕 에우리토스의 내기를 들었다.
활쏘기로 왕과 아들들을 이기면 딸 이올레를 준다는 것이었다.
헤라클레스가 이겼지만 왕은 자식을 또 죽일까 두렵다며 주지 않았다.
아들 이피토스만이 약속을 지켜야 한다고 말했다.
"""
note = "참고: 처음 읽는 그리스 로마 신화 8권 3장 「뜻하지 않은 사고」. 원전은 오이칼리아라고 하나 어디인지 다투어진다 — 파우사니아스 4.2 가 메세니아·테살리아·에우보이아 세 주장을 나열한다."
place_unknown = true
sources = ["apollodorus.library 2.6.1"]

[[event]]
id = "iphitos-killed"
name_ko = "이피토스를 죽이고 델포이의 벌을 받다"
era = 5
seq = 1009
span = "moment"
place = "tiryns"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "iphitos", role = "피해" },
  { figure = "eurytos", role = "등장" },
  { figure = "apollon", role = "상대" },
  { figure = "zeus", role = "등장" },
]
oneliner = "다시 미친 헤라클레스가 친구 이피토스를 죽였고, 벌로 종이 되어야 했다."
body = """
에우리토스는 헤라클레스가 소를 훔쳤다고 여겼지만 이피토스는 믿지 않았다.
이피토스는 함께 소를 찾자며 티린스로 헤라클레스를 찾아왔다.
그런데 헤라클레스가 다시 미쳐서 손님인 이피토스를 죽였다.
그 죄로 병이 든 헤라클레스가 델포이에 묻자 처음엔 대답이 없었다.
결국 세 해 동안 종으로 팔려 가라는 말을 받았다.
"""
fun = "대답이 없자 헤라클레스는 델포이의 세발솥을 들고 나왔다. 아폴론과 다투는 둘 사이에 제우스가 번개를 던져 말렸다."
sensitivity = "soften"
caused_by = ["eurytos-archery-contest"]
sources = ["apollodorus.library 2.6.2", "homer.odyssey 21.22-30"]

[[event]]
id = "omphale-service"
name_ko = "옴팔레의 종으로 일하다"
era = 5
seq = 1018
place = "lydia"
span = "years"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "omphale", role = "상대" },
  { figure = "hermes", role = "도움" },
]
oneliner = "헤르메스가 헤라클레스를 팔았고, 리디아의 여왕이 그를 샀다."
body = """
헤르메스가 헤라클레스를 종으로 팔았다.
리디아의 여왕 옴팔레가 그를 사서 세 해 동안 부렸다.
그동안에도 헤라클레스는 도둑 케르코페스를 잡아 묶었다.
이 무렵 아르고호가 떠났고 칼리돈의 멧돼지 사냥이 있었다고 한다.
테세우스가 길의 악당들을 없앤 것도 이때라고 아폴로도로스는 적었다.
"""
sensitivity = "soften"
caused_by = ["iphitos-killed"]
note = "여자 옷을 입었다는 뒷시대 이야기는 원전에 없어 쓰지 않았다."
sources = ["apollodorus.library 2.6.2-2.6.3"]

[[event]]
id = "herakles-sacks-troy"
name_ko = "헤라클레스가 트로이를 무너뜨리다"
era = 5
seq = 1027
span = "days"
after = ["omphale-service"]
place = "troy"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "laomedon", role = "상대" },
  { figure = "telamon", role = "도움" },
  { figure = "hesione", role = "피해" },
]
oneliner = "약속을 어긴 라오메돈을 벌하러 배 열여덟 척으로 트로이를 쳤다."
body = """
종살이가 끝나고 병도 나은 헤라클레스는 군대를 모아 트로이로 갔다.
성벽을 가장 먼저 넘은 것은 텔라몬이었다.
헤라클레스는 라오메돈과 아들들을 죽이고 성을 차지했다.
포다르케스만 살아남았고, 헤시오네가 몸값을 내고 풀어 주었다.
그가 뒷날 트로이의 왕 프리아모스다.
"""
fun = "먼저 들어간 텔라몬에게 헤라클레스가 화를 냈다. 텔라몬은 얼른 돌을 모으며 헤라클레스의 제단을 쌓는 거라고 했다."
caused_by = ["hesione-rescued"]
sources = ["apollodorus.library 2.6.4", "homer.iliad 5.638-651", "ovid.metamorphoses 11.213-215"]

[[event.variants]]
source = "homer.iliad 5.638-651"
text = "호메로스는 배가 여섯 척뿐이었다고 한다."

[[event]]
id = "olympic-games-founded"
name_ko = "아우게이아스를 벌하고 올림피아 경기를 열다"
era = 5
seq = 1036
span = "days"
after = ["herakles-sacks-troy"]
place = "elis"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "augeias", role = "상대" },
  { figure = "iolaos", role = "등장" },
]
oneliner = "약속을 어긴 엘리스의 왕을 물리치고 올림피아에서 경기를 열었다."
body = """
헤라클레스는 아르카디아 사람들을 모아 엘리스로 갔다.
처음에는 병이 들어 물러났지만, 다시 와서 엘리스를 차지했다.
약속을 어겼던 아우게이아스를 죽이고 그 아들 필레우스를 왕으로 세웠다.
그리고 올림피아에서 제우스에게 바치는 경기를 열었다.
파우사니아스는 이올라오스가 헤라클레스의 말을 빌려 타고 이겼다고 적었다.
"""
fun = "지금의 올림픽 경기 이름이 이 올림피아에서 왔다."
caused_by = ["augeias-stables"]
sources = ["apollodorus.library 2.7.2", "pausanias.greece 5.8"]

[[event]]
id = "deianeira-won"
name_ko = "아켈로오스와 씨름해 데이아네이라를 얻다"
era = 5
seq = 1045
span = "moment"
after = ["olympic-games-founded"]
place = "kalydon"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "akheloos", role = "상대" },
  { figure = "deianeira", role = "등장" },
  { figure = "oineus", role = "등장" },
]
oneliner = "강의 신이 황소로 변해 싸웠지만 헤라클레스가 뿔을 꺾고 이겼다."
body = """
헤라클레스는 칼리돈에 와서 오이네우스의 딸 데이아네이라를 아내로 청했다.
강의 신 아켈로오스도 같은 마음이어서 둘이 씨름을 했다.
아켈로오스는 뱀으로, 다시 황소로 모습을 바꾸었다.
헤라클레스가 황소의 뿔 하나를 꺾자 아켈로오스가 졌다.
그래서 헤라클레스가 데이아네이라와 결혼했다.
"""
fun = "님프들이 꺾인 뿔에 과일을 가득 채웠다. 사람들은 이것을 풍요의 뿔이라고 부른다."
note = "참고: 처음 읽는 그리스 로마 신화 8권 3장 「데이아네이라와의 결혼」"
sources = ["apollodorus.library 2.7.5", "ovid.metamorphoses 9.1-100"]

[[event]]
id = "nessos-slain"
name_ko = "네소스가 데이아네이라를 붙잡아 가려 하다"
era = 5
seq = 1054
span = "moment"
place = "kalydon"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "nessos", role = "상대" },
  { figure = "deianeira", role = "피해" },
]
oneliner = "강을 건네주던 켄타우로스가 아내를 붙잡아 가려 하자 헤라클레스가 쏘았다."
body = """
헤라클레스는 데이아네이라와 함께 칼리돈을 떠나 에우에노스 강에 왔다.
켄타우로스 네소스가 돈을 받고 사람을 건네주고 있었다.
헤라클레스는 혼자 건넜고, 아내는 네소스에게 맡겼다.
네소스가 아내를 억지로 데려가려 하자 헤라클레스가 독 화살을 쏘았다.
죽어 가던 네소스는 자기 피가 사랑의 약이라고 데이아네이라를 속였다.
"""
sensitivity = "soften"
caused_by = ["deianeira-won"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 4장 「네소스의 복수」. 에우에노스 강은 칼리돈 옆을 흐르므로 장소를 칼리돈으로 둔다."
sources = ["apollodorus.library 2.7.6", "ovid.metamorphoses 9.101-133"]

[[event]]
id = "oichalia-taken"
name_ko = "오이칼리아를 무너뜨리고 이올레를 데려오다"
era = 5
seq = 1063
span = "days"
after = ["nessos-slain"]
