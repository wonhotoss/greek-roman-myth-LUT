열두째 일은 저승의 문지기 개 케르베로스를 데려오는 것이었다.
헤라클레스는 라코니아 타이나론에 있는 굴로 저승에 내려갔다.
묶여 있던 테세우스는 일으켰지만 페이리토오스는 두고 와야 했다.
하데스는 무기를 쓰지 않고 이기면 개를 데려가라고 했다.
두 팔로 머리를 끌어안아 이겼고, 왕에게 보인 뒤 저승에 돌려 놓았다.
"""
fun = "오디세우스가 저승에서 헤라클레스의 그림자를 만났다. 헤라클레스 자신은 하늘에서 신들과 잔치를 하고 있었다."
caused_by = ["herakles-delphi-oracle"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 2장 「끝나지 않은 여정」. 내려가기 전 엘레우시스에서 비밀 제사를 받았다(2.5.12)."
sources = ["apollodorus.library 2.5.12", "homer.iliad 8.362-369", "homer.odyssey 11.601-627"]

