]
oneliner = "땅에 닿으면 힘이 세지는 거인을 들어 올려 이겼다."
body = """
열한째 일은 헤스페리데스의 황금 사과를 가져오는 것이었다.
사과가 어디 있는지 몰라 바다의 노인 네레우스를 붙잡아 길을 알아냈다.
리비아 땅에서 거인 안타이오스가 억지로 씨름을 시켰다.
안타이오스는 땅에 닿을수록 힘이 세졌다.
헤라클레스는 그를 높이 들어 올려 땅에서 떼어 놓고 이겼다.
"""
caused_by = ["herakles-delphi-oracle"]
note = "원전은 리비아라고만 한다. 옛 그리스 사람들의 리비아는 북아프리카 전체를 가리키는 이름이라 한 점으로 찍을 수 없다."
place_unknown = true
sources = ["apollodorus.library 2.5.11", "ovid.metamorphoses 9.183-184"]

[[event]]
id = "prometheus-freed"
name_ko = "프로메테우스가 풀려나다"
