  { figure = "persephone", role = "도움" },
  { figure = "theseus", role = "피해" },
  { figure = "peirithoos", role = "피해" },
  { figure = "hermes", role = "도움" },
  { figure = "athena", role = "도움" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "저승의 개를 무기 없이 이겨 끌고 왔고, 테세우스도 풀어 주었다."
