  { figure = "herakles", role = "주인공" },
  { figure = "eurytos", role = "피해" },
  { figure = "iole", role = "피해" },
]
oneliner = "트라키스에서 군대를 모아 에우리토스를 죽이고 이올레를 데려왔다."
body = """
헤라클레스는 트라키스의 케익스 왕에게 가서 살았다.
그리고 옛 약속을 어긴 에우리토스를 벌하려고 군대를 모았다.
오이칼리아를 쳐서 에우리토스와 아들들을 죽이고 성을 빼앗았다.
공주 이올레를 붙잡아 데려왔다.
에우보이아의 케나이온 곶에 제우스의 제단을 쌓고 제사를 준비했다.
"""
caused_by = ["eurytos-archery-contest"]
note = "오이칼리아는 위치가 다투어진다(파우사니아스 4.2 — 메세니아·테살리아·에우보이아). 아폴로도로스 2.7.7 도 트라키스에서 군대를 모아 갔다고만 한다."
place_unknown = true
sources = ["apollodorus.library 2.7.7", "ovid.metamorphoses 9.136-137"]

[[event]]
id = "poisoned-robe"
name_ko = "데이아네이라의 옷"
era = 5
seq = 1072
span = "moment"
place = "trachis"
cast = [
  { figure = "deianeira", role = "주인공" },
  { figure = "herakles", role = "피해" },
  { figure = "lichas", role = "피해" },
  { figure = "iole", role = "등장" },
  { figure = "nessos", role = "상대" },
]
oneliner = "사랑의 약이라 믿고 바른 네소스의 피가 헤라클레스를 태웠다."
body = """
헤라클레스가 심부름꾼 리카스를 보내 제사에 입을 옷을 가져오게 했다.
데이아네이라는 리카스에게서 이올레 이야기를 들었다.
남편의 마음을 붙들려고 네소스의 피를 옷에 발라 보냈다.
옷이 몸에서 따뜻해지자 히드라의 독이 헤라클레스를 태우기 시작했다.
데이아네이라는 그 소식을 듣고 스스로 목숨을 끊었다.
"""
fun = "오비디우스는 바다에 던져진 리카스가 바위가 되었다고 한다."
sensitivity = "soften"
caused_by = ["nessos-slain", "oichalia-taken", "lernaean-hydra-slain"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 4장 「헤라클레스의 최후」. 옷이 살을 찢은 상세는 쓰지 않았다."
sources = ["apollodorus.library 2.7.7", "ovid.metamorphoses 9.134-158", "ovid.metamorphoses 9.211-229"]

