]
oneliner = "헬리오스의 황금 잔을 타고 서쪽 끝 섬에 가서 소를 몰아 왔다."
body = """
열째 일은 서쪽 끝 에리테이아 섬에서 게리온의 소를 가져오는 것이었다.
더위에 화가 나 해를 향해 활을 겨누자 헬리오스가 황금 잔을 주었다.
그 잔을 배처럼 타고 바다를 건너 섬에 닿았다.
개 오르트로스와 목자 에우리티온, 쫓아온 게리온을 모두 이겼다.
돌아오는 길에 헤라가 쇠파리를 보내 소를 흩어 놓아 오래 고생했다.
"""
fun = "가는 길에 유럽과 아프리카 사이 바다 어귀에 기둥 둘을 세웠다. 사람들은 이곳을 지금의 지브롤터 해협이라고 본다."
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.10", "hesiod.theogony 287-294"]

[[event]]
id = "antaios-wrestled"
name_ko = "안타이오스와 씨름하다"
era = 5
seq = 610
span = "moment"
after = ["geryon-cattle"]
