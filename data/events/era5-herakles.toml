  { figure = "atlas", role = "도움" },
  { figure = "hesperides", role = "등장" },
  { figure = "ladon", role = "상대" },
  { figure = "athena", role = "도움" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "아틀라스 대신 하늘을 받치고 있는 동안 아틀라스가 사과를 따 왔다."
body = """
에우리스테우스는 히드라와 외양간을 세어 주지 않고 열한째 일을 시켰다.
황금 사과는 세상 서쪽 끝, 아틀라스가 하늘을 받치고 선 곳에 있었다.
헤라클레스가 하늘을 대신 받치고, 아틀라스가 사과 세 개를 따 왔다.
아틀라스가 하늘을 다시 받으려 하지 않았다.
헤라클레스는 머리에 받침을 대겠다고 속여 하늘을 되돌려 주었다.
"""
fun = "사과는 아무 데도 둘 수 없는 것이라 아테나가 정원에 되돌려 놓았다."
caused_by = ["prometheus-freed", "lernaean-hydra-slain", "augeias-stables"]
sources = ["apollodorus.library 2.5.11", "hesiod.theogony 215-216", "hesiod.theogony 517-520"]

[[event.variants]]
