[[event]]
id = "herakles-apotheosis"
name_ko = "헤라클레스가 신이 되다"
era = 5
seq = 1090
span = "moment"
after = ["herakles-pyre"]
places = ["mt-oita", "olympus-home"]
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "zeus", role = "도움" },
  { figure = "hera", role = "등장" },
]
oneliner = "불타는 장작 위에서 구름이 헤라클레스를 하늘로 데려갔다."
body = """
장작이 타는 동안 구름이 내려와 헤라클레스를 감쌌다.
우레 소리와 함께 구름이 그를 하늘로 올려 보냈다.
제우스는 죽는 몸은 불에 타고, 자기에게서 받은 부분은 남는다고 말했다.
헤라클레스는 죽지 않는 몸이 되어 헤라와도 화해했다.
헤라의 딸 헤베와 결혼했다.
"""
fun = "델포이의 말이 그대로 되었다. 일을 다 하면 죽지 않는 몸이 된다고 했었다."
caused_by = ["herakles-pyre", "herakles-delphi-oracle"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 4장 「신이 된 영웅」. 헤베는 등록부에 없어 이름만 불렀다."
sources = ["apollodorus.library 2.7.7", "ovid.metamorphoses 9.239-272", "homer.odyssey 11.601-604"]
