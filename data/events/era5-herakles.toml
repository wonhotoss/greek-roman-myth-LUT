  { figure = "augeias", role = "상대" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "강 두 줄기를 끌어와 산더미 같은 똥을 하루에 씻어 냈다."
body = """
다섯째 일은 아우게이아스 왕의 소똥을 하루에 치우는 것이었다.
헤라클레스는 왕에게 소의 열에 하나를 주면 하루에 치우겠다고 했다.
외양간 벽을 뚫고 알페이오스 강과 페네이오스 강을 끌어들였다.
왕은 에우리스테우스가 시킨 일인 줄 알고 약속을 어겼다.
에우리스테우스도 품삯을 받고 한 일이라며 세어 주지 않았다.
"""
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.5", "pausanias.greece 5.1"]

[[event]]
