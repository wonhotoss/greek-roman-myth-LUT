# era 5 — 큰 영웅들. 헤라클레스의 일생 전체.
# seq 400~699: 탄생~케르베로스. seq 1000~1099: 에우리토스~신이 되다.
# 묶음은 스크래치 arcs/HER.toml (herakles-early / herakles-labors / herakles-last).

# ========== 탄생과 젊은 날 ==========

[[event]]
id = "amphitryon-to-thebes"
name_ko = "암피트리온이 테베로 쫓겨 가다"
era = 5
seq = 400
span = "season"
places = ["mycenae", "thebes"]
cast = [
  { figure = "amphitryon", role = "주인공" },
  { figure = "elektryon", role = "피해" },
  { figure = "alkmene", role = "등장" },
  { figure = "sthenelos", role = "상대" },
  { figure = "kreon", role = "도움" },
]
oneliner = "실수로 왕을 죽게 한 암피트리온이 알크메네와 테베로 갔다."
body = """
미케네의 왕 엘렉트리온은 소를 돌려받다가 사고로 죽었다.
암피트리온이 소에게 던진 몽둥이가 튀어 왕을 맞힌 것이다.
스테넬로스는 그 일을 핑계로 암피트리온을 쫓아내고 왕이 되었다.
암피트리온은 알크메네를 데리고 테베로 가서 크레온 왕의 손님이 되었다.
알크메네는 오빠들의 원수를 갚아 주면 아내가 되겠다고 했다.
"""
sources = ["apollodorus.library 2.4.6"]

[[event]]
id = "zeus-visits-alkmene"
name_ko = "제우스가 암피트리온의 모습으로 찾아오다"
era = 5
seq = 410
span = "days"
place = "thebes"
cast = [
  { figure = "zeus", role = "주인공" },
  { figure = "alkmene", role = "피해" },
  { figure = "amphitryon", role = "등장" },
  { figure = "teiresias", role = "도움" },
]
oneliner = "암피트리온이 싸우러 간 사이 제우스가 그의 모습으로 알크메네를 찾아왔다."
body = """
암피트리온은 알크메네의 오빠들의 원수를 갚으러 섬으로 싸우러 갔다.
그가 돌아오기 전날 밤, 제우스가 암피트리온의 모습으로 찾아왔다.
제우스는 그 밤을 세 배로 길게 늘였다.
다음 날 돌아온 암피트리온은 아내가 반기지 않아 이상하게 여겼다.
앞을 보는 사람 테이레시아스가 무슨 일이 있었는지 알려 주었다.
"""
sensitivity = "soften"
caused_by = ["amphitryon-to-thebes"]
note = "참고: 처음 읽는 그리스 로마 신화 2권 1장 「영웅 헤라클레스의 어머니」"
sources = ["apollodorus.library 2.4.8"]

[[event]]
id = "hera-delays-birth"
name_ko = "헤라가 헤라클레스의 탄생을 늦추다"
era = 5
seq = 420
span = "days"
places = ["thebes", "mycenae"]
cast = [
  { figure = "hera", role = "주인공" },
  { figure = "zeus", role = "상대" },
  { figure = "alkmene", role = "피해" },
  { figure = "eurystheus", role = "등장" },
  { figure = "sthenelos", role = "등장" },
]
oneliner = "제우스의 맹세를 들은 헤라가 에우리스테우스를 먼저 태어나게 했다."
body = """
제우스는 오늘 태어나는 페르세우스의 자손이 왕이 된다고 맹세했다.
헤라클레스를 두고 한 말이었다.
헤라는 아기 낳기를 돕는 여신들을 붙잡아 알크메네를 막았다.
그사이 미케네에서 에우리스테우스가 일곱 달 만에 먼저 태어났다.
그래서 왕 자리는 에우리스테우스의 것이 되었다.
"""
fun = "오비디우스는 하녀 갈란티스가 여신을 속여 아기를 나오게 했다고 한다. 갈란티스는 그 벌로 족제비가 되었다."
caused_by = ["zeus-visits-alkmene"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 1장 「헤라의 저주」"
sources = ["homer.iliad 19.95-133", "apollodorus.library 2.4.5", "ovid.metamorphoses 9.273-323"]

[[event]]
id = "herakles-born"
name_ko = "쌍둥이 헤라클레스와 이피클레스가 태어나다"
era = 5
seq = 430
span = "moment"
after = ["hera-delays-birth"]
place = "thebes"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "alkmene", role = "주인공" },
  { figure = "iphikles", role = "등장" },
  { figure = "zeus", role = "등장" },
  { figure = "amphitryon", role = "등장" },
]
oneliner = "알크메네가 아버지가 다른 쌍둥이를 낳았다."
body = """
알크메네가 테베에서 아들 둘을 낳았다.
먼저 난 헤라클레스는 제우스의 아들이다.
하룻밤 뒤에 난 이피클레스는 암피트리온의 아들이다.
헤라클레스는 처음에 알키데스라고 불렸다.
제우스는 이 아이가 미케네의 왕이 되기를 바랐지만 헤라가 막았다.
"""
caused_by = ["zeus-visits-alkmene"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 1장 「페르세우스의 후손」"
sources = ["apollodorus.library 2.4.8", "apollodorus.library 2.4.12", "homer.iliad 19.98-99"]

[[event]]
id = "herakles-cradle-snakes"
name_ko = "요람의 두 뱀"
era = 5
seq = 440
span = "moment"
place = "thebes"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "hera", role = "상대" },
  { figure = "alkmene", role = "등장" },
  { figure = "amphitryon", role = "등장" },
  { figure = "iphikles", role = "등장" },
]
oneliner = "헤라가 보낸 큰 뱀 두 마리를 여덟 달 된 아기가 목 졸라 죽였다."
body = """
헤라클레스가 여덟 달이 되었을 때 헤라가 아기를 없애려 했다.
큰 뱀 두 마리를 아기들의 침대로 보냈다.
알크메네가 소리쳐 암피트리온을 불렀다.
그사이 헤라클레스가 일어나 두 손으로 뱀을 하나씩 잡아 목 졸라 죽였다.
"""
caused_by = ["herakles-born"]
sources = ["apollodorus.library 2.4.8"]

[[event.variants]]
source = "apollodorus.library 2.4.8"
text = "옛 작가 페레키데스는 뱀을 넣은 것이 암피트리온이라고 한다. 어느 아이가 제 아들인지 알아보려는 것이었다. 이피클레스는 달아났고 헤라클레스는 버텼다."

[[event]]
id = "herakles-taught"
name_ko = "헤라클레스가 자라며 배우다"
era = 5
seq = 450
span = "years"
after = ["herakles-cradle-snakes"]
place = "thebes"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "amphitryon", role = "도움" },
  { figure = "eurytos", role = "도움" },
  { figure = "kastor", role = "도움" },
  { figure = "autolykos", role = "도움" },
]
oneliner = "수레 몰기, 씨름, 활, 칼, 리라를 저마다 최고인 사람에게 배웠다."
body = """
암피트리온이 수레 몰기를 가르쳤다.
씨름은 아우톨리코스, 활은 에우리토스, 칼은 카스토르에게 배웠다.
리라는 오르페우스의 형제 리노스가 가르쳤다.
키가 남보다 훨씬 컸고 눈에서 불빛이 번쩍였다.
활도 창도 빗나가는 법이 없었다.
"""
fun = "몽둥이는 네메아에서 직접 잘라 만들었다. 칼은 헤르메스가, 활은 아폴론이 주었다."
sources = ["apollodorus.library 2.4.9", "apollodorus.library 2.4.11"]

[[event]]
id = "herakles-weds-megara"
name_ko = "테베를 지키고 메가라와 결혼하다"
era = 5
seq = 460
span = "days"
after = ["herakles-taught"]
place = "thebes"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "megara", role = "등장" },
  { figure = "kreon", role = "도움" },
  { figure = "amphitryon", role = "피해" },
  { figure = "athena", role = "도움" },
  { figure = "iphikles", role = "등장" },
]
oneliner = "미니아이 사람들을 물리친 상으로 크레온 왕의 딸을 아내로 맞았다."
body = """
테베는 해마다 미니아이 사람들에게 소 백 마리를 바치고 있었다.
헤라클레스는 아테나에게서 무기를 받아 테베 사람들을 이끌고 싸웠다.
미니아이 왕 에르기노스가 죽고 테베는 자유로워졌다.
이 싸움에서 암피트리온이 용감하게 싸우다 죽었다.
크레온 왕은 상으로 큰딸 메가라를 헤라클레스의 아내로 주었다.
"""
sources = ["apollodorus.library 2.4.11"]

[[event]]
id = "herakles-madness"
name_ko = "헤라가 헤라클레스를 미치게 하다"
era = 5
seq = 470
span = "moment"
place = "thebes"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "hera", role = "상대" },
  { figure = "megara", role = "피해" },
  { figure = "iphikles", role = "피해" },
]
oneliner = "헤라 때문에 미친 헤라클레스가 자기 아이들을 죽였다."
body = """
헤라는 헤라클레스가 잘되는 것을 견디지 못했다.
그래서 그를 미치게 만들었다.
헤라클레스는 정신을 잃은 채 메가라와 낳은 아이들을 죽였다.
이피클레스의 아이 둘도 함께 죽었다.
정신이 돌아온 헤라클레스는 스스로 테베를 떠났다.
"""
sensitivity = "soften"
caused_by = ["herakles-weds-megara"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 1장 「헤라의 저주」. 불에 던졌다는 방법은 쓰지 않았다."
sources = ["apollodorus.library 2.4.12"]

[[event]]
id = "herakles-delphi-oracle"
name_ko = "델포이에서 열 가지 일을 받다"
era = 5
seq = 480
span = "moment"
place = "delphi"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "apollon", role = "등장" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "에우리스테우스를 열두 해 섬기고 열 가지 일을 하라는 말을 들었다."
body = """
헤라클레스는 어디서 살아야 하는지 델포이에 물었다.
아폴론의 말을 전하는 여자가 그를 처음으로 헤라클레스라고 불렀다.
티린스에 살면서 에우리스테우스를 열두 해 동안 섬기라고 했다.
왕이 시키는 열 가지 일을 다 하면 죽지 않는 몸이 된다고 했다.
"""
fun = "처음엔 열 가지였다. 왕이 둘을 세어 주지 않아 열두 가지가 되었다."
caused_by = ["herakles-madness"]
note = "참고: 처음 읽는 그리스 로마 신화 8권 2장 「열 가지의 임무」"
sources = ["apollodorus.library 2.4.12"]

# ========== 열두 가지 일 ==========

[[event]]
id = "nemean-lion-slain"
name_ko = "네메아의 사자를 잡다"
era = 5
seq = 490
span = "days"
place = "nemea"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "nemean-lion", role = "상대" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "화살이 들지 않는 사자를 두 팔로 목 졸라 이겼다."
body = """
에우리스테우스의 첫 명령은 네메아 사자의 가죽을 가져오는 것이었다.
화살을 쏘았지만 가죽에 들지 않았다.
사자가 입구가 둘인 굴로 들어가자 한쪽을 막고 다른 쪽으로 들어갔다.
그리고 두 팔로 사자의 목을 졸라 죽였다.
왕은 사자를 멘 헤라클레스를 보고 놀라 성문 안에 들이지 않았다.
"""
fun = "겁이 난 왕은 땅속에 청동 항아리를 묻고 그 안에 숨었다고 한다."
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.1", "hesiod.theogony 326-332", "pausanias.greece 2.15"]

[[event]]
id = "lernaean-hydra-slain"
name_ko = "레르나의 히드라를 죽이다"
era = 5
seq = 500
span = "moment"
after = ["nemean-lion-slain"]
place = "lerna"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "hydra", role = "상대" },
  { figure = "iolaos", role = "도움" },
  { figure = "hera", role = "상대" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "머리를 부술수록 둘이 나는 뱀을 이올라오스가 불로 지져 이겼다."
body = """
둘째 일은 레르나 늪의 히드라를 죽이는 것이었다.
머리를 부수면 둘이 새로 났고, 큰 게까지 나와 발을 물었다.
조카 이올라오스가 불로 잘린 자리를 지져 머리가 나지 못하게 했다.
헤라클레스는 죽지 않는 머리를 잘라 돌 밑에 묻고, 화살에 독을 발랐다.
에우리스테우스는 도움을 받았다며 이 일을 세어 주지 않았다.
"""
fun = "헤라가 헤라클레스를 미워해서 이 히드라를 키웠다고 헤시오도스는 말한다."
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.2", "hesiod.theogony 313-318"]

[[event]]
id = "keryneian-hind"
name_ko = "황금 뿔 암사슴을 산 채로 잡다"
era = 5
seq = 510
place = "ladon-river"
span = "years"
after = ["lernaean-hydra-slain"]
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "artemis", role = "상대" },
  { figure = "apollon", role = "등장" },
  { figure = "eurystheus", role = "등장" },
]
oneliner = "아르테미스의 사슴을 한 해 동안 쫓아 다치지 않게 잡았다."
body = """
셋째 일은 케리네이아의 암사슴을 산 채로 데려오는 것이었다.
뿔이 금이고 아르테미스의 사슴이라 죽일 수도 다치게 할 수도 없었다.
헤라클레스는 한 해 동안 사슴을 쫓았다.
사슴이 라돈 강을 건너려 할 때 붙잡아 어깨에 메었다.
아르테미스가 화를 냈지만, 왕이 시킨 일이라고 하자 놓아주었다.
"""
caused_by = ["herakles-delphi-oracle"]
note = "붙잡은 곳인 라돈 강만 place 로 붙였다. 사슴이 처음 있던 오이노에와 아르테미시온 산은 등록부에 없다."
sources = ["apollodorus.library 2.5.3"]

[[event]]
id = "pholos-and-kentauroi"
name_ko = "폴로스의 술독과 켄타우로스들의 싸움"
era = 5
seq = 520
span = "days"
after = ["keryneian-hind"]
place = "mt-erymanthos"
cast = [
  { figure = "herakles", role = "주인공" },
  { figure = "pholos", role = "도움" },
  { figure = "kentauroi", role = "상대" },
  { figure = "cheiron", role = "피해" },
]
oneliner = "술 냄새에 몰려온 켄타우로스들과 싸우다 케이론이 화살에 다쳤다."
body = """
멧돼지를 잡으러 가던 헤라클레스가 켄타우로스 폴로스의 굴에 들었다.
헤라클레스가 술을 달라고 하자 폴로스는 켄타우로스 모두의 술독을 열었다.
냄새를 맡은 켄타우로스들이 돌과 나무를 들고 몰려왔다.
헤라클레스가 쏜 화살 하나가 죄 없는 케이론의 무릎에 박혔다.
폴로스도 화살을 살펴보다 발에 떨어뜨려 죽었다.
"""
caused_by = ["herakles-delphi-oracle"]
sources = ["apollodorus.library 2.5.4"]

[[event]]
id = "erymanthian-boar"
name_ko = "에리만토스의 멧돼지를 잡다"
era = 5
seq = 530
span = "days"
